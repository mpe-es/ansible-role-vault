---
###############################################################################
# Filename: .github/dependabot.yml
# Role: ansible-role-vault
# Summary: Dependabot configuration for automated dependency updates.
#          Conventions are shared across the MPE-ES Ansible role family.
# Last Updated: 20 Aug 2026
# Classification: UNCLASSIFIED
###############################################################################
# Ecosystems monitored:
#   1. pip            - requirements.in / requirements.txt (pip-compile managed).
#                       requirements-generator.* is the pinned GENERATOR toolchain
#                       and is deliberately excluded via ignore: -- see below.
#   2. github-actions - .github/workflows/ (SHA-pinned to full commit hashes)
#
# NOT monitored: requirements.yml (Ansible Galaxy collections). Dependabot has
# no Galaxy ecosystem; those collection versions are bumped by hand.
###############################################################################
version: 2

updates:
  # ---------------------------------------------------------------------------
  # Python dependencies - requirements.in (source) + requirements.txt (compiled)
  # ---------------------------------------------------------------------------
  # Rationale: keep hvac and its transitive HTTP stack (requests, urllib3,
  # certifi, idna, charset-normalizer) current with upstream security fixes.
  # allow: direct + indirect is REQUIRED for a pip-compile lockfile - without
  # "indirect", the transitive pins in requirements.txt would never update.
  # Dependabot regenerates the --hash entries in the same PR.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Etc/UTC"
    # Cooldown: 7-day floor for new releases, 10 days for majors. Gives a
    # malicious or yanked upstream release (e.g. the yanked charset-normalizer
    # 3.4.8) time to be caught before Dependabot proposes it. The 7-day floor
    # also satisfies the semgrep supply-chain guardian.
    cooldown:
      default-days: 7
      semver-major-days: 10
    open-pull-requests-limit: 10
    commit-message:
      prefix: "build"
      include: scope
    labels:
      - dependencies
      - python
    allow:
      - dependency-type: direct
      - dependency-type: indirect
    # requirements-generator.txt pins the toolchain that GENERATES
    # requirements.txt (see requirements-generator.in). Dependabot's pip
    # ecosystem globs every requirements*.txt in this directory, so without
    # these ignores it would bump the generator without regenerating the lock
    # the generator produced -- breaking the reproducibility the pin exists to
    # provide. Moving the toolchain is a deliberate act: bump it by hand, then
    # regenerate requirements.txt from it in the same commit. None of these
    # names appear in requirements.txt, so nothing runtime is suppressed.
    #
    # These ignores DO remove the generator stack from the cooldown enforcement
    # below, so the floor is re-enforced for it by
    # tests/assert-generator-lock-cooldown.sh, which reads default-days from
    # THIS file and fails CI on a pin inside the floor or on a yanked release.
    # Without that guard the floor would be prose here and a control nowhere.
    ignore:
      - dependency-name: pip-tools
      - dependency-name: click
      - dependency-name: pip
      - dependency-name: setuptools
      - dependency-name: wheel
      - dependency-name: build
      - dependency-name: packaging
      - dependency-name: pyproject-hooks
    groups:
      # Collapse the hvac stack into one PR for patch + minor bumps. Major
      # bumps stay individual for deliberate review.
      python-deps:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # ---------------------------------------------------------------------------
  # GitHub Actions - .github/workflows/
  # ---------------------------------------------------------------------------
  # Rationale: actions are pinned to full commit SHAs with a trailing
  # "# vX.Y.Z" comment. Dependabot updates both the SHA and the comment while
  # preserving the pinning policy.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: "Etc/UTC"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions
