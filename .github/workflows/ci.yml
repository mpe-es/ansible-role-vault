---
###############################################################################
# Filename: .github/workflows/ci.yml
# Role: ansible-role-vault
# Summary: Continuous Integration workflow for linting and testing
# Last Updated: 20 Aug 2026
# Classification: UNCLASSIFIED
###############################################################################
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly to catch upstream changes
    - cron: '0 6 * * 0'
  workflow_dispatch:

# Least-privilege default for GITHUB_TOKEN. Every job inherits read-only
# access to repository contents; a job needing more must opt in explicitly.
# This matters once the repository is public and fork pull requests run CI.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ###########################################################
  # Linting Stage
  ###########################################################
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-core ansible-lint

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      # Widened per the #46-era comment now that both script lineages are
      # in tree; full consolidation + version pinning tracked in issue #47
      - name: Run shellcheck on shipped and test scripts
        run: shellcheck files/*.sh tests/*.sh

      - name: Run vault-unseal behavioral tests
        run: bash tests/vault-unseal-test.sh

      - name: Run vault-audit-backup behavioral tests
        run: bash tests/vault-audit-backup-test.sh

      - name: Assert no CLI-argv unseal form (issue #31 regression lock)
        run: bash tests/assert-no-unseal-argv.sh

      - name: Assert least-privilege ownership posture (issue #38)
        run: bash tests/assert-root-owned-posture.sh

  ###########################################################
  # Syntax Check Stage
  ###########################################################
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          pip install -r requirements.txt

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Create test playbook
        run: |
          cat > test-playbook.yml << 'EOF'
          ---
          - name: Test playbook
            hosts: localhost
            connection: local
            gather_facts: false
            roles:
              - role: ansible-role-vault
          EOF

      - name: Run syntax check
        run: ansible-playbook test-playbook.yml --syntax-check
        env:
          ANSIBLE_ROLES_PATH: "${{ github.workspace }}/.."

  ###########################################################
  # Molecule Test Stage
  ###########################################################
  molecule:
    name: Molecule Test (${{ matrix.el.name }})
    runs-on: ubuntu-latest
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
        el:
          - name: el8
            image: registry.access.redhat.com/ubi8/ubi-init:latest
            python: /usr/bin/python3.11
          - name: el9
            image: registry.access.redhat.com/ubi9/ubi-init:latest
            python: /usr/bin/python3
          - name: el10
            image: registry.access.redhat.com/ubi10/ubi-init:latest
            python: /usr/bin/python3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            ansible-core \
            molecule \
            molecule-plugins[podman] \
            ansible-lint \
            yamllint
          pip install -r requirements.txt

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Configure Podman for systemd containers
        run: |
          # Create registries config for unqualified image pulls
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/registries.conf << 'EOF'
          unqualified-search-registries = ["registry.access.redhat.com", "docker.io"]
          EOF
          # Verify Podman works
          podman info

      - name: Test Podman container creation
        run: |
          # Pull and test official Red Hat UBI init image (SCRM-friendly base)
          podman pull "${MOLECULE_IMAGE}"
          # Test basic container creation with systemd
          podman run --rm -d --name test-systemd \
            --privileged \
            --cgroupns=host \
            --tmpfs /run --tmpfs /tmp \
            --cap-add SYS_ADMIN --cap-add AUDIT_WRITE --cap-add AUDIT_CONTROL \
            "${MOLECULE_IMAGE}" /usr/sbin/init
          sleep 5
          podman exec test-systemd systemctl status || true
          podman stop test-systemd || true
        env:
          MOLECULE_IMAGE: ${{ matrix.el.image }}

      - name: Run Molecule tests
        run: molecule test --scenario-name ${{ matrix.scenario }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '3'
          MOLECULE_IMAGE: ${{ matrix.el.image }}
          MOLECULE_PYTHON: ${{ matrix.el.python }}

  ###########################################################
  # Molecule Init Stage (real Vault init transaction, issue #33)
  # Separate job so a binary-fetch/network issue does not mask the
  # default-scenario molecule results. Vault binary source is
  # airgap-overridable via the MOLECULE_VAULT_URL repo/org variable.
  ###########################################################
  molecule-init:
    name: Molecule Init (${{ matrix.el.name }} ${{ matrix.mode.name }})
    runs-on: ubuntu-latest
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        mode:
          # secure: #34 core — no keys/root token on the node
          - {name: secure, init_unseal: 'true', auto_unseal: 'false'}
          # autounseal: shares on the node for the boot service (no root token)
          - {name: autounseal, init_unseal: 'true', auto_unseal: 'true'}
          # sealed: #33 opt-out (auto_unseal MUST be false — forbidden-combo assert)
          - {name: sealed, init_unseal: 'false', auto_unseal: 'false'}
        el:
          - name: el8
            image: registry.access.redhat.com/ubi8/ubi-init:latest
            python: /usr/bin/python3.11
          - name: el9
            image: registry.access.redhat.com/ubi9/ubi-init:latest
            python: /usr/bin/python3
          - name: el10
            image: registry.access.redhat.com/ubi10/ubi-init:latest
            python: /usr/bin/python3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            ansible-core \
            molecule \
            molecule-plugins[podman] \
            ansible-lint \
            yamllint
          pip install -r requirements.txt

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Configure Podman for systemd containers
        run: |
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/registries.conf << 'EOF'
          unqualified-search-registries = ["registry.access.redhat.com", "docker.io"]
          EOF
          podman info

      - name: Run Molecule init scenario
        run: molecule test --scenario-name init
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '3'
          MOLECULE_IMAGE: ${{ matrix.el.image }}
          MOLECULE_PYTHON: ${{ matrix.el.python }}
          MOLECULE_INIT_UNSEAL: ${{ matrix.mode.init_unseal }}
          MOLECULE_AUTO_UNSEAL: ${{ matrix.mode.auto_unseal }}
          # Enclave CI overrides MOLECULE_VAULT_URL (repo/org variable) to an
          # internal web server; public default constructed from the version.
          MOLECULE_VAULT_URL: ${{ vars.MOLECULE_VAULT_URL }}
          MOLECULE_VAULT_VERSION: ${{ vars.MOLECULE_VAULT_VERSION || '1.18.5' }}

  ###########################################################
  # Molecule HSM Stage (PIN handling, issue #41)
  # Renders the pkcs11 seal config with a valid sentinel PIN and proves the PIN
  # lands only in vault.env (double-quoted), never in vault.hcl or --diff. No
  # real HSM/Vault. The check-diff grep runs while vault.env is still ABSENT
  # (before the real converge) so the diff is non-vacuous.
  ###########################################################
  molecule-hsm:
    name: Molecule HSM (${{ matrix.el.name }})
    runs-on: ubuntu-latest
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        el:
          - name: el8
            image: registry.access.redhat.com/ubi8/ubi-init:latest
            python: /usr/bin/python3.11
          - name: el9
            image: registry.access.redhat.com/ubi9/ubi-init:latest
            python: /usr/bin/python3
          - name: el10
            image: registry.access.redhat.com/ubi10/ubi-init:latest
            python: /usr/bin/python3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            ansible-core \
            molecule \
            molecule-plugins[podman] \
            ansible-lint \
            yamllint
          pip install -r requirements.txt

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Configure Podman for systemd containers
        run: |
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/registries.conf << 'EOF'
          unqualified-search-registries = ["registry.access.redhat.com", "docker.io"]
          EOF
          podman info

      - name: Molecule create + prepare (hsm)
        run: |
          molecule create --scenario-name hsm
          molecule prepare --scenario-name hsm
        env:
          MOLECULE_IMAGE: ${{ matrix.el.image }}
          MOLECULE_PYTHON: ${{ matrix.el.python }}

      - name: Assert the PIN never appears in --check --diff (diff:false)
        run: |
          # vault.env does not exist yet (prepare does not create it), so the
          # template task WOULD create it and — without diff:false — print
          # VAULT_HSM_PIN in the diff. diff:false must suppress it. Grep of stdout
          # is the sound test (a diff:false task's .diff attr is always empty).
          # `-- <args>` forwards to ansible-playbook. If a molecule version does
          # NOT forward, fall back to:
          #   ansible-playbook -i "$(molecule --scenario-name hsm reset >/dev/null; \
          #     ls molecule/hsm/../../.cache 2>/dev/null)" ... --check --diff
          # Skip 'stig' in the CHECK-mode run: the STIG phase enables the
          # vault-audit-backup.timer, and systemd can't enable a unit that
          # check-mode never actually wrote ("Could not find the requested
          # service") — a pre-existing check-mode limitation unrelated to the PIN.
          # The real converge below keeps STIG for full coverage. (Full skip list
          # passed so it wins regardless of how molecule's own --skip-tags merges.)
          out="$(molecule converge --scenario-name hsm -- --check --diff --skip-tags preflight,service_start,stig 2>&1)" || { echo "$out"; exit 1; }
          # ANTI-VACUOUS GUARD: if --check did NOT take effect (arg-forwarding
          # broken), the converge wrote vault.env for real. It MUST still be absent.
          if podman exec vault-el test -f /etc/vault.d/vault.env; then
            echo "FAIL: --check did not take effect (vault.env exists) — molecule did not forward --check; restore the ansible-playbook fallback"; exit 1
          fi
          if printf '%s' "$out" | grep -q 'S3NTINEL-hsm-pin'; then
            echo "FAIL: PIN leaked into --check --diff output"; exit 1
          fi
          echo "ok: --check took effect (vault.env absent) and no PIN in diff"
        env:
          MOLECULE_IMAGE: ${{ matrix.el.image }}
          MOLECULE_PYTHON: ${{ matrix.el.python }}

      - name: Molecule converge + verify + destroy (hsm)
        run: |
          molecule converge --scenario-name hsm
          molecule verify --scenario-name hsm
          molecule destroy --scenario-name hsm
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '3'
          MOLECULE_IMAGE: ${{ matrix.el.image }}
          MOLECULE_PYTHON: ${{ matrix.el.python }}

  ###########################################################
  # Security Scan Stage
  ###########################################################
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    # security-events: write is required by github/codeql-action/upload-sarif.
    # Staged here deliberately ahead of the SARIF block below, which stays
    # commented until the repository is public (Advanced Security is a paid
    # feature on private repositories).
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # NOTE: SARIF upload to GitHub Security tab requires Advanced Security
      # (paid feature for private repos). When this repo goes public, uncomment:
      # - name: Run Trivy (SARIF output)
      #   uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      #   with:
      #     scan-type: 'fs'
      #     scan-ref: '.'
      #     format: 'sarif'
      #     output: 'trivy-results.sarif'
      #     severity: 'CRITICAL,HIGH'
      #
      # - name: Upload Trivy scan results
      #   uses: github/codeql-action/upload-sarif@d4b3ca9fa7f69d38bfcd667bdc45bc373d16277e  # v4
      #   if: always()
      #   with:
      #     sarif_file: 'trivy-results.sarif'

  ###########################################################
  # Final Status Check
  ###########################################################
  check:
    name: CI Status
    if: always()
    needs:
      - lint
      - syntax
      - molecule
      - molecule-init
      - molecule-hsm
      - security
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.syntax.result }}" != "success" ]] || \
             [[ "${{ needs.molecule.result }}" != "success" ]] || \
             [[ "${{ needs['molecule-init'].result }}" != "success" ]] || \
             [[ "${{ needs['molecule-hsm'].result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more required jobs did not succeed"
            exit 1
          fi
          echo "All required jobs passed"
