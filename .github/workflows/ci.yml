---
###############################################################################
# Filename: .github/workflows/ci.yml
# Role: ansible-role-vault
# Summary: Continuous Integration workflow for linting and testing
# Last Updated: 13 Aug 2026
# Classification: UNCLASSIFIED
###############################################################################
name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  schedule:
    # Run weekly to catch upstream changes
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ###########################################################
  # Linting Stage
  ###########################################################
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yamllint ansible-core ansible-lint

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Run yamllint
        run: yamllint .

      - name: Run ansible-lint
        run: ansible-lint

      - name: Run shellcheck on shipped and test scripts
        run: shellcheck files/*.sh tests/vault-unseal-test.sh

      - name: Run vault-unseal behavioral tests
        run: bash tests/vault-unseal-test.sh

      # Replica-drift tripwire: molecule converge hand-copies role tasks,
      # so its assertions cannot detect deletion of the ROLE's copy. Pin
      # the load-bearing repair task to the role file itself.
      - name: Assert Install-link repair exists in the role (not just the molecule replica)
        run: grep -q "systemctl reenable vault-unseal.service" tasks/service.yml

  ###########################################################
  # Syntax Check Stage
  ###########################################################
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Ansible and dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core
          pip install -r requirements.txt

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Create test playbook
        run: |
          cat > test-playbook.yml << 'EOF'
          ---
          - name: Test playbook
            hosts: localhost
            connection: local
            gather_facts: false
            roles:
              - role: ansible-role-vault
          EOF

      - name: Run syntax check
        run: ansible-playbook test-playbook.yml --syntax-check
        env:
          ANSIBLE_ROLES_PATH: "${{ github.workspace }}/.."

  ###########################################################
  # Molecule Test Stage
  ###########################################################
  molecule:
    name: Molecule Test (${{ matrix.el.name }})
    runs-on: ubuntu-latest
    needs: syntax
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - default
        el:
          - name: el8
            image: registry.access.redhat.com/ubi8/ubi-init:latest
            python: /usr/bin/python3.11
          - name: el9
            image: registry.access.redhat.com/ubi9/ubi-init:latest
            python: /usr/bin/python3
          - name: el10
            image: registry.access.redhat.com/ubi10/ubi-init:latest
            python: /usr/bin/python3
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            ansible-core \
            molecule \
            molecule-plugins[podman] \
            ansible-lint \
            yamllint
          pip install -r requirements.txt

      - name: Install required Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Configure Podman for systemd containers
        run: |
          # Create registries config for unqualified image pulls
          mkdir -p ~/.config/containers
          cat > ~/.config/containers/registries.conf << 'EOF'
          unqualified-search-registries = ["registry.access.redhat.com", "docker.io"]
          EOF
          # Verify Podman works
          podman info

      - name: Test Podman container creation
        run: |
          # Pull and test official Red Hat UBI init image (SCRM-friendly base)
          podman pull "${MOLECULE_IMAGE}"
          # Test basic container creation with systemd
          podman run --rm -d --name test-systemd \
            --privileged \
            --cgroupns=host \
            --tmpfs /run --tmpfs /tmp \
            --cap-add SYS_ADMIN --cap-add AUDIT_WRITE --cap-add AUDIT_CONTROL \
            "${MOLECULE_IMAGE}" /usr/sbin/init
          sleep 5
          podman exec test-systemd systemctl status || true
          podman stop test-systemd || true
        env:
          MOLECULE_IMAGE: ${{ matrix.el.image }}

      - name: Run Molecule tests
        run: molecule test --scenario-name ${{ matrix.scenario }}
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_VERBOSITY: '3'
          MOLECULE_IMAGE: ${{ matrix.el.image }}
          MOLECULE_PYTHON: ${{ matrix.el.python }}

  ###########################################################
  # Security Scan Stage
  ###########################################################
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'

      # NOTE: SARIF upload to GitHub Security tab requires Advanced Security
      # (paid feature for private repos). When this repo goes public, uncomment:
      # - name: Run Trivy (SARIF output)
      #   uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
      #   with:
      #     scan-type: 'fs'
      #     scan-ref: '.'
      #     format: 'sarif'
      #     output: 'trivy-results.sarif'
      #     severity: 'CRITICAL,HIGH'
      #
      # - name: Upload Trivy scan results
      #   uses: github/codeql-action/upload-sarif@d4b3ca9fa7f69d38bfcd667bdc45bc373d16277e  # v4
      #   if: always()
      #   with:
      #     sarif_file: 'trivy-results.sarif'

  ###########################################################
  # Final Status Check
  ###########################################################
  check:
    name: CI Status
    if: always()
    needs:
      - lint
      - syntax
      - molecule
      - security
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.syntax.result }}" != "success" ]] || \
             [[ "${{ needs.molecule.result }}" != "success" ]] || \
             [[ "${{ needs.security.result }}" != "success" ]]; then
            echo "One or more required jobs did not succeed"
            exit 1
          fi
          echo "All required jobs passed"
