---
###############################################################################
# Filename: .github/workflows/release.yml
# Role: ansible-role-vault
# Summary: Publish role to Ansible Galaxy on release
# Last Updated: 03 Apr 2026
# Classification: UNCLASSIFIED
###############################################################################
name: Release to Galaxy

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  ###########################################################
  # Publish to Ansible Galaxy
  ###########################################################
  release:
    name: Publish to Galaxy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.11'

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core

      - name: Extract version from tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Releasing version: ${VERSION}"

      - name: Validate role metadata
        run: |
          ansible-galaxy role info --offline . || true
          echo "Role validation complete"

      - name: Import role to Ansible Galaxy
        run: |
          ansible-galaxy role import \
            --api-key "${{ secrets.GALAXY_API_KEY }}" \
            --role-name vault \
            ${{ github.repository_owner }} \
            ${{ github.event.repository.name }}
        env:
          ANSIBLE_GALAXY_SERVER: https://galaxy.ansible.com

      - name: Create release summary
        run: |
          echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Role:** vault" >> $GITHUB_STEP_SUMMARY
          echo "- **Galaxy:** https://galaxy.ansible.com/${{ github.repository_owner }}/vault" >> $GITHUB_STEP_SUMMARY
