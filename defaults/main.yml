---
###############################################################################
# Filename: defaults/main.yml
# Role: ansible-role-vault
# Summary: Default variables for HashiCorp Vault installation and STIG
#   compliance. Override these in playbooks or inventory to customize behavior.
# Last Updated: 13 Aug 2026
# Classification: UNCLASSIFIED
###############################################################################

###############################################################################
# RPM Repository Configuration
# Override these for airgap environments pointing to a local mirror.
# NIST 800-53: SI-7 (Software, Firmware, and Information Integrity)
###############################################################################
# Whether the role should create /etc/yum.repos.d/hashicorp.repo
vault_manage_repo: true

# HashiCorp RPM repository base URL
# Internet-connected default; override with local mirror for airgap
vault_repo_url: "https://rpm.releases.hashicorp.com/RHEL/$releasever/$basearch/stable"

# HashiCorp GPG key URL for RPM signature verification
# Internet-connected default; override with local mirror for airgap
vault_repo_gpg_key: "https://rpm.releases.hashicorp.com/gpg"

# Enable GPG checking on the repository (always true for STIG compliance)
vault_repo_gpgcheck: true

###############################################################################
# Vault Package Configuration
###############################################################################
# Vault package version to install. Use 'latest' for newest available or
# pin to a specific version (e.g., '1.18.3-1') for reproducibility.
# In airgap environments, this must match what is available in the local repo.
vault_package_version: "latest"

# Vault package state for ansible.builtin.dnf
# Options: 'present' (install if missing), 'latest' (upgrade to newest)
vault_package_state: "present"

# Install the Vault package (the dnf transaction). false when the binary is
# provided out-of-band (pre-baked image, container test); post-install
# validation still runs.
vault_manage_install: true

# Manage SELinux file contexts (sefcontext+restorecon in system.yml). false
# where SELinux is disabled (containers) or owned by a separate baseline.
vault_manage_selinux: true

###############################################################################
# Vault Server Configuration
# These map directly to vault.hcl configuration parameters.
###############################################################################
# Enable the Vault web UI
vault_ui_enabled: true

# Disable memory lock (mlock)
# SECURITY: false = mlock ENABLED (prevents secrets from being swapped to disk)
# Set to true only if the system does not support mlock (e.g., some containers)
vault_disable_mlock: false

# Disable performance standby mode
# Recommended true in STIG environments for predictable behavior
vault_disable_performance_standby: true

# Vault log level: trace, debug, info, warn, error
# STIG compliance requires at minimum 'info' for audit trail
vault_log_level: "info"

###############################################################################
# Listener Configuration
# NIST 800-53: SC-8 (Transmission Confidentiality and Integrity)
# NIST 800-53: SC-23 (Session Authenticity)
# APSC-DV-002010: CNSA 1.0 cryptographic requirements
###############################################################################
# Address and port for Vault API listener
vault_listener_address: "0.0.0.0"
vault_listener_port: 8200

# TLS configuration
vault_tls_cert_file: "/opt/vault/tls/tls.crt"
vault_tls_key_file: "/opt/vault/tls/tls.key"
vault_tls_ca_file: "/opt/vault/tls/ca.crt"

# Minimum TLS version (STIG requires TLS 1.2 minimum)
# FIPS 140-3: Use 'tls12' or 'tls13'
# CNSA 1.0: TLS 1.2 with approved cipher suites, or TLS 1.3
vault_tls_min_version: "tls12"

# TLS cipher suites (only applies to TLS 1.2; TLS 1.3 uses fixed suites)
# CNSA 1.0 approved: AES-256-GCM with SHA-384, ECDHE with P-384
# Leave empty to use Vault/Go defaults (which are FIPS-compliant when
# FIPS mode is enabled at the OS level). Override only if you need to
# restrict to a specific CNSA 1.0 subset.
vault_tls_cipher_suites: []

# Client certificate verification
# true = require and verify client certificates (mutual TLS)
# false = allow but do not require client certificates
vault_tls_require_client_cert: false
vault_tls_disable_client_certs: false

###############################################################################
# Raft Storage Configuration
# HashiCorp recommended storage backend for all deployments.
# NIST 800-53: SC-28 (Protection of Information at Rest)
###############################################################################
# Raft node ID (typically the hostname; set per-host in inventory)
vault_raft_node_id: "{{ inventory_hostname_short }}"

###############################################################################
# Cluster / HA Configuration
# Single-node: leave vault_cluster_members empty or undefined
# HA cluster: provide a list of cluster member FQDNs or IPs
###############################################################################
# API address advertised to clients
# Format: https://<fqdn_or_ip>:8200
vault_api_addr: "https://{{ ansible_fqdn }}:{{ vault_listener_port }}"

# Cluster address for Raft replication between nodes
vault_cluster_addr: "https://{{ ansible_fqdn }}:8201"

# Load balancer or leader address for HA retry_join
# Set this for HA clusters; leave empty/null for single-node
vault_cluster_leader_addr: ""

###############################################################################
# Firewall Configuration
# NIST 800-53: SC-7 (Boundary Protection)
###############################################################################
# Whether the role should configure firewalld rules
vault_manage_firewall: true

# Ports to open in firewalld
vault_firewall_ports:
  - "8200/tcp"   # Vault API
  - "8201/tcp"   # Vault Cluster (Raft replication)

###############################################################################
# TLS Certificate Deployment
# Set to true if the role should deploy TLS certificates from provided paths.
# Set to false if certificates are managed externally (e.g., by another role
# or pre-baked into the image).
###############################################################################
vault_manage_tls: false

# Source paths for TLS files (on the Ansible controller)
# Only used when vault_manage_tls is true
vault_tls_src_cert: ""
vault_tls_src_key: ""
vault_tls_src_ca: ""

###############################################################################
# STIG Compliance Toggles
# Enable/disable specific STIG hardening categories.
# Most default to true for a strong compliance posture; AIDE defaults off
# (host-owned, presence-gated — the role never forces an external tool).
###############################################################################
# Deploy logrotate configuration for Vault logs
vault_stig_logrotate_enabled: true

# Logrotate retention (days) - STIG requires minimum 90 days
vault_stig_logrotate_days: 90

# Deploy Vault audit backup service and timer
# RHEL 9 STIG V-205167: Backup audit records
vault_stig_audit_backup_enabled: true

# Audit backup retention (days)
# Injected into vault-audit-backup.service via Environment=RETENTION_DAYS;
# the backup script falls back to 7 if unset or invalid
vault_stig_audit_backup_retention_days: 7

# Deploy AIDE file integrity check service and timer WHEN aide is installed.
# RHEL 9 STIG V-257842, Application Security STIG V-263644.
# Default off: AIDE is host-owned; the role integrates but never forces it.
vault_stig_aide_check_enabled: false

# Deploy the BOOT-TIME auto-unseal systemd service (a key-at-rest decision).
# This does NOT control post-init unseal — see vault_init_unseal.
vault_auto_unseal_enabled: false

# Unseal via the Shamir threshold immediately after init, as PART OF the init
# transaction (so audit devices can be enabled). Independent of the boot-time
# auto-unseal service above. Set false only for the rare "initialize but leave
# sealed" case (audit devices then require manual unseal). Non-HSM only; with
# an HSM seal, Vault auto-unseals regardless.
vault_init_unseal: true

# Vault initialization parameters (used during initial setup)
vault_key_shares: 5
vault_key_threshold: 3

###############################################################################
# Rsyslog Configuration
# NIST 800-53: AU-4 (Audit Log Storage Capacity)
# NIST 800-53: AU-6 (Audit Review, Analysis, and Reporting)
###############################################################################
# Enable remote syslog forwarding
vault_rsyslog_enabled: false

# Remote syslog target (FQDN or IP)
vault_rsyslog_host: ""

# Remote syslog port
vault_rsyslog_port: 514

###############################################################################
# Vault Edition
# Controls the RPM package name installed.
# 'vault' = Community (OSS), 'vault-enterprise' = Enterprise,
# 'vault-enterprise-fips1403' = Enterprise with FIPS 140-3 crypto
###############################################################################
vault_edition: "vault"

###############################################################################
# TLS Maximum Version
# NIST 800-53: SC-8 (Transmission Confidentiality and Integrity)
###############################################################################
vault_tls_max_version: "tls13"

###############################################################################
# TLS Certificate Source
# 'file' = Copy certs from controller (enclave CA, ADCS, RHCS)
# 'vault_pki' = Generate via Vault PKI engine (requires existing Vault)
###############################################################################
vault_tls_source: "file"

# Vault PKI engine settings (only used when vault_tls_source is 'vault_pki')
vault_pki_mount: ""
vault_pki_role: ""

###############################################################################
# Vault Initialization
# Set to true for greenfield deployments to auto-initialize Vault.
# By default, keys are stored in /etc/vault.d/tokens.env (mode 0600,
# root:root; the directory is root:vault 0750). AAP/controller capture can
# also write the init JSON to the calling execution environment so it can
# be moved to an approved secret store.
###############################################################################
vault_initialize: false

# Store unseal keys and the root token on the target host.
vault_init_store_target: true

# Capture the raw vault operator init JSON on the Ansible controller/AAP
# execution environment. This file is secret-bearing and should be treated as a
# temporary handoff artifact.
vault_init_controller_capture_enabled: false
vault_init_controller_output_path: ""
vault_init_controller_output_mode: '0600'

###############################################################################
# HSM / PKCS#11 Seal Configuration (Enterprise Only)
# NIST 800-53: SC-13 (Cryptographic Protection)
# FIPS 140-3: Hardware security module for key protection
###############################################################################
# Enable PKCS#11 seal stanza in vault.hcl
vault_hsm_enabled: false

# Install HSM client libraries from Satellite
vault_configure_hsm_client: false

# HSM client RPM package name (from Satellite mirror)
vault_hsm_client_package: ""

# PKCS#11 library path on target
vault_hsm_lib_path: ""

# HSM slot identification (mutually exclusive - use one or the other)
vault_hsm_slot: ""
vault_hsm_token_label: ""

# HSM authentication
vault_hsm_pin: ""

# HSM key configuration
vault_hsm_key_label: ""
vault_hsm_hmac_key_label: ""

# Cryptographic mechanisms
# Common values: 0x1087 (CKM_AES_GCM), 0x1085 (CKM_AES_CBC_PAD)
vault_hsm_mechanism: ""

# HMAC mechanism (only CKM_SHA256_HMAC / 0x0251 is currently supported)
vault_hsm_hmac_mechanism: "0x0251"

# Auto-generate keys on HSM during initialization
vault_hsm_generate_key: false

# Maximum concurrent HSM requests
vault_hsm_max_parallel: 1

###############################################################################
# fapolicyd Trust Management
# NIST 800-53: CM-7(5) (Authorized Software — Allow-by-Exception; effective
# only where fapolicyd enforces with file trust — see README), SI-7
# RHEL 9 STIG: supports RHEL-09-433016 (fapolicyd deny-all enforcement;
# 433010/433015 = install/enable prerequisites — this role remediates
# none of the three; it registers trust entries consumed under them)
###############################################################################
# Whether the role manages fapolicyd trust entries.
# Tasks skip without failure (logging the reason) if fapolicyd (with
# trust.d support) is not present.
# When false the role does not touch fapolicyd at all — including not
# removing a previously deployed trust file (see README for manual cleanup).
vault_manage_fapolicyd: true

# Files to register in the fapolicyd file trust database.
# Entries are generated only for regular files that exist on the target.
# Paths containing whitespace cannot be represented in the space-delimited
# trust format and are silently excluded. Duplicates are deduped by the role.
vault_fapolicyd_trusted_files:
  - "{{ vault_binary }}"                    # RPM install location (vars/main.yml)
  - /usr/local/bin/vault                    # binary/zip install location (future)
  - /usr/local/bin/vault-audit-backup.sh    # deployed by stig.yml
  - /usr/local/bin/vault-unseal.sh          # deployed by stig.yml (auto-unseal)
