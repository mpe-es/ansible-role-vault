---
###############################################################################
# Filename: handlers/main.yml
# Role: ansible-role-vault
# Summary: Event handlers for HashiCorp Vault service management
# Last Updated: 03 Apr 2026
# Classification: UNCLASSIFIED
###############################################################################

###############################################################################
# Vault Service Handlers
###############################################################################
- name: Restart vault
  ansible.builtin.systemd:
    name: vault
    state: restarted
    daemon_reload: true
  listen: Restart vault

- name: Reload vault
  ansible.builtin.systemd:
    name: vault
    state: reloaded
  listen: Reload vault

- name: Enable vault
  ansible.builtin.systemd:
    name: vault
    enabled: true
  listen: Enable vault

###############################################################################
# Rsyslog Handler
###############################################################################
- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted
  listen: Restart rsyslog

- name: Reload systemd
  ansible.builtin.systemd_service:
    daemon_reload: true
  listen: Reload systemd

###############################################################################
# Re-enable on unit-file change: `systemd_service: enabled: true` is a no-op
# when the unit is already enabled, so an [Install] section change (e.g. the
# added WantedBy=vault.service) never creates its new symlinks on upgraded
# hosts. reenable = disable + enable, recreating all [Install] links.
# Defined AFTER Reload systemd: handlers flush in definition order, so the
# daemon sees the new unit file before links are rebuilt.
###############################################################################
- name: Reenable vault-unseal
  ansible.builtin.command:
    cmd: systemctl reenable vault-unseal.service
  changed_when: true
  listen: Reenable vault-unseal
