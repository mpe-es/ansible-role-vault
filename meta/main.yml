---
###############################################################################
# Filename: meta/main.yml
# Role: ansible-role-vault
# Summary: Ansible Role metadata for HashiCorp Vault installation and STIG
#   compliance on RHEL systems
# Last Updated: 20 Aug 2026
# Classification: UNCLASSIFIED
###############################################################################
galaxy_info:
  namespace: mpe-es
  role_name: vault
  author: Alex Ackerman
  description: >-
    Install and configure HashiCorp Vault on RHEL with STIG compliance in
    airgap or internet-connected environments. Single-node deployments are
    fully supported; multi-node Raft HA is developmental (see README).
  license: Apache-2.0
  min_ansible_version: '2.17'
  platforms:
    - name: EL
      versions:
        - '8'
        - '9'
        - '10'
  galaxy_tags:
    - security
    - stig
    - rhel
    - vault
    - hashicorp
    - compliance
    - secrets
    - encryption
dependencies: []
