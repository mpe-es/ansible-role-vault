---
###############################################################################
# Filename: meta/main.yml
# Role: ansible-role-vault
# Summary: Ansible Role metadata for HashiCorp Vault installation and STIG
#   compliance on RHEL systems
# Last Updated: 28 Sep 2026
# Classification: UNCLASSIFIED
###############################################################################
galaxy_info:
  namespace: mpe-es
  role_name: vault
  author: Alex Ackerman
  description: >-
    Install and configure HashiCorp Vault on RHEL with STIG compliance in
    airgap or internet-connected environments. Single-node deployments are the
    CI-exercised path; multi-node Raft HA is implemented, with configuration
    verified by CI and cluster formation not behaviour-tested (see README).
  license: Apache-2.0
  # ADVISORY ONLY -- ansible-core does not enforce this; verified with a probe
  # role declaring '99.0', which ran normally. CI's tested floor is the pin in
  # requirements-dev.in (#91).
  min_ansible_version: '2.21'
  platforms:
    - name: EL
      versions:
        - '8'
        - '9'
        - '10'
  galaxy_tags:
    - security
    - stig
    - rhel
    - vault
    - hashicorp
    - compliance
    - secrets
    - encryption
dependencies: []
