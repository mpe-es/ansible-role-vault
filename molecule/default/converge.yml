---
###############################################################################
# Filename: molecule/default/converge.yml
# Role: ansible-role-vault
# Summary: Execute the REAL role via import_role (issue #43). Host-dependent
#   phases are gated off in molecule.yml (manage_repo/tls/firewall/install/
#   selinux=false, initialize=false) and the live-Vault tasks are skipped
#   via --skip-tags preflight,service_start. Mocks live in prepare.yml.
# Classification: UNCLASSIFIED
###############################################################################
- name: Converge
  hosts: all
  # Running as root in container - no become needed

  vars:
    # Test-observability overrides: each is deliberately NON-default so a
    # verify.yml assertion proves it flowed through the real templates.
    vault_listener_port: 8205
    vault_api_addr: "https://vault-el:8205"
    vault_cluster_addr: "https://vault-el:8201"
    vault_raft_node_id: vault-el
    vault_stig_audit_backup_retention_days: 14   # non-default (role default 7)
    # fapolicyd fixture list: extra entries exercise the trust template's
    # whitespace-exclusion, symlink-exclusion, and dedup logic (fixture files
    # created in prepare.yml); verify.yml asserts only the 3 valid paths survive.
    vault_fapolicyd_trusted_files:
      - /usr/bin/vault
      - /usr/local/bin/vault-audit-backup.sh
      - /usr/local/bin/vault-unseal.sh
      - "/usr/local/bin/vault-with space.sh"
      - /usr/local/bin/vault-symlink
      - /usr/local/bin/vault-audit-backup.sh

  tasks:
    - name: Execute the ansible-role-vault role
      ansible.builtin.import_role:
        name: ansible-role-vault

    # Post-role fixture (NOT a role-task replica): render the real fapolicyd
    # trust template with a synthetic two-version rpm query to exercise the
    # rc==0 version/dedup branch (the container's mock rpm returns non-zero,
    # so the role run renders the "unknown" branch). verify.yml asserts both.
    # set_fact (NOT task vars): the role run REGISTERS __vault_fapolicyd_pkg,
    # and a registered var outranks task vars — so the override must be at
    # register/fact precedence. These are the last tasks; the clobber is safe.
    - name: Override package register with synthetic rc0 fixture
      ansible.builtin.set_fact:
        __vault_fapolicyd_pkg:
          rc: 0
          stdout: "vault-enterprise-fips1403 2.0.3-1\nvault-enterprise-fips1403 2.0.2-1\n"
          stdout_lines:
            - "vault-enterprise-fips1403 2.0.3-1"
            - "vault-enterprise-fips1403 2.0.2-1"

    - name: Render synthetic rc0 fapolicyd trust file (version-branch fixture)
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../../templates/fapolicyd-vault.trust.j2"
        dest: /root/.molecule-fapolicyd-rc0.trust
        owner: root
        group: root
        mode: '0644'
