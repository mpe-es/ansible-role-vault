---
###############################################################################
# Filename: molecule/default/molecule.yml
# Role: ansible-role-vault
# Summary: Default Molecule scenario - container-based testing with Podman
# Classification: UNCLASSIFIED
###############################################################################
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: podman

platforms:
  - name: vault-el
    image: ${MOLECULE_IMAGE:-registry.access.redhat.com/ubi9/ubi-init:latest}
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init

provisioner:
  name: ansible
  connection_options:
    ansible_become: false
  inventory:
    host_vars:
      vault-el:
        ansible_user: root
        ansible_python_interpreter: ${MOLECULE_PYTHON:-/usr/bin/python3}
        # Skip phases that require real infrastructure
        vault_manage_repo: false
        vault_manage_firewall: false
        vault_manage_tls: false
        vault_initialize: false

verifier:
  name: ansible
