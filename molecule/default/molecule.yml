---
###############################################################################
# Filename: molecule/default/molecule.yml
# Role: ansible-role-vault
# Summary: Default Molecule scenario - container-based testing with Podman
# Classification: UNCLASSIFIED
###############################################################################
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: podman

platforms:
  - name: vault-el
    image: ${MOLECULE_IMAGE:-registry.access.redhat.com/ubi9/ubi-init:latest}
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init

provisioner:
  name: ansible
  connection_options:
    ansible_become: false
  # Resolve the role by its directory name (assumes the checkout leaf dir is
  # 'ansible-role-vault' — true under actions/checkout default). requirements.yml
  # is collections-only so pinning the roles path clobbers no role deps.
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  # Skip only tasks that need a real host / running Vault. 'install' is NOT
  # tag-skipped (its tag is shared with fapolicyd); gated by
  # vault_manage_install instead.
  options:
    skip-tags: preflight,service_start
  inventory:
    host_vars:
      vault-el:
        ansible_user: root
        ansible_python_interpreter: ${MOLECULE_PYTHON:-/usr/bin/python3}
        # Gate host-dependent phases; the real role tasks still execute.
        vault_manage_repo: false
        vault_manage_firewall: false
        vault_manage_tls: false
        vault_manage_install: false
        vault_manage_selinux: false
        vault_initialize: false
        # Exercise the real auto-unseal deploy + [Install]-link repair.
        vault_auto_unseal_enabled: true
        # Exercise the AIDE presence-gate warn+skip path (no aide in container).
        vault_stig_aide_check_enabled: true

verifier:
  name: ansible
