---
###############################################################################
# Filename: molecule/default/verify.yml
# Role: ansible-role-vault
# Summary: Verification playbook - validates STIG compliance in container
# Classification: UNCLASSIFIED
###############################################################################
- name: Verify
  hosts: all
  # Running as root in container - no become needed

  tasks:
    ###########################################################################
    # Directory structure and permissions (NIST AC-6)
    ###########################################################################
    - name: Verify Vault directories exist with STIG permissions
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: __verify_dirs
      loop:
        - { path: /etc/vault.d, mode: '0750', owner: vault, group: vault }
        - { path: /opt/vault/data, mode: '0750', owner: vault, group: vault }
        - { path: /opt/vault/tls, mode: '0750', owner: vault, group: vault }
        - { path: /var/log/vault, mode: '0750', owner: vault, group: vault }
        - { path: /opt/vault-backup, mode: '0750', owner: root, group: root }
      loop_control:
        label: "{{ item.path }}"

    - name: Assert directory permissions are STIG-compliant
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.mode == item.item.mode
        fail_msg: >-
          {{ item.item.path }} has incorrect permissions:
          exists={{ item.stat.exists }},
          mode={{ item.stat.mode | default('missing') }},
          expected={{ item.item.mode }}
      loop: "{{ __verify_dirs.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    ###########################################################################
    # Vault configuration files
    ###########################################################################
    - name: Verify vault.hcl exists with correct permissions
      ansible.builtin.stat:
        path: /etc/vault.d/vault.hcl
      register: __verify_vault_hcl

    - name: Assert vault.hcl permissions
      ansible.builtin.assert:
        that:
          - __verify_vault_hcl.stat.exists
          - __verify_vault_hcl.stat.mode == '0640'
          - __verify_vault_hcl.stat.pw_name == 'vault'
          - __verify_vault_hcl.stat.gr_name == 'vault'
        fail_msg: "vault.hcl has incorrect permissions or ownership"

    - name: Verify vault.env exists with correct permissions
      ansible.builtin.stat:
        path: /etc/vault.d/vault.env
      register: __verify_vault_env

    - name: Assert vault.env permissions
      ansible.builtin.assert:
        that:
          - __verify_vault_env.stat.exists
          - __verify_vault_env.stat.mode == '0640'
          - __verify_vault_env.stat.pw_name == 'vault'
          - __verify_vault_env.stat.gr_name == 'vault'
        fail_msg: "vault.env has incorrect permissions or ownership"

    ###########################################################################
    # vault.hcl content validation
    ###########################################################################
    - name: Read vault.hcl content
      ansible.builtin.slurp:
        src: /etc/vault.d/vault.hcl
      register: __verify_vault_hcl_content

    - name: Assert vault.hcl contains required configuration
      ansible.builtin.assert:
        that:
          - "'ui' in (__verify_vault_hcl_content.content | b64decode)"
          - "'storage \"raft\"' in (__verify_vault_hcl_content.content | b64decode)"
          - "'listener \"tcp\"' in (__verify_vault_hcl_content.content | b64decode)"
          - "'tls_min_version' in (__verify_vault_hcl_content.content | b64decode)"
          - "'tls_max_version' in (__verify_vault_hcl_content.content | b64decode)"
        fail_msg: "vault.hcl is missing required configuration blocks"

    - name: Assert vault.hcl does NOT contain deprecated parameters
      ansible.builtin.assert:
        that:
          - "'tls_prefer_server_cipher_suites' not in (__verify_vault_hcl_content.content | b64decode)"
        fail_msg: "vault.hcl contains deprecated tls_prefer_server_cipher_suites"

    ###########################################################################
    # Logrotate configuration (NIST AU-4)
    ###########################################################################
    - name: Verify logrotate config exists
      ansible.builtin.stat:
        path: /etc/logrotate.d/vault
      register: __verify_logrotate

    - name: Assert logrotate config exists
      ansible.builtin.assert:
        that:
          - __verify_logrotate.stat.exists

    - name: Read logrotate config
      ansible.builtin.slurp:
        src: /etc/logrotate.d/vault
      register: __verify_logrotate_content

    - name: Assert logrotate has 90-day minimum retention
      ansible.builtin.assert:
        that:
          - "'rotate 90' in (__verify_logrotate_content.content | b64decode)"
        fail_msg: "Logrotate does not meet STIG 90-day minimum retention"

    ###########################################################################
    # Systemd unit files (STIG services)
    ###########################################################################
    - name: Verify STIG systemd unit files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __verify_units
      loop:
        - /usr/lib/systemd/system/vault-audit-backup.service
        - /usr/lib/systemd/system/vault-audit-backup.timer
        - /usr/lib/systemd/system/vault-unseal.service
      loop_control:
        label: "{{ item | basename }}"

    - name: Assert STIG systemd units exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing systemd unit: {{ item.item }}"
      loop: "{{ __verify_units.results }}"
      loop_control:
        label: "{{ item.item | basename }}"

    ###########################################################################
    # Script files
    ###########################################################################
    - name: Verify audit backup script exists with correct permissions
      ansible.builtin.stat:
        path: /usr/local/bin/vault-audit-backup.sh
      register: __verify_backup_script

    - name: Assert audit backup script permissions
      ansible.builtin.assert:
        that:
          - __verify_backup_script.stat.exists
          - __verify_backup_script.stat.mode == '0750'
        fail_msg: "vault-audit-backup.sh missing or incorrect permissions"

    - name: Verify unseal script exists with correct permissions
      ansible.builtin.stat:
        path: /usr/local/bin/vault-unseal.sh
      register: __verify_unseal_script

    - name: Assert unseal script permissions
      ansible.builtin.assert:
        that:
          - __verify_unseal_script.stat.exists
          - __verify_unseal_script.stat.mode == '0750'
          - __verify_unseal_script.stat.pw_name == 'root'
          - __verify_unseal_script.stat.gr_name == 'root'
        fail_msg: >-
          vault-unseal.sh missing, incorrect permissions, or not root:root
          (root-run service; vault user must not be able to edit it)

    - name: Read unseal script
      ansible.builtin.slurp:
        src: /usr/local/bin/vault-unseal.sh
      register: __verify_unseal_script_content

    - name: Assert unseal script validates TLS instead of skipping verification
      ansible.builtin.assert:
        that:
          - "'VAULT_SKIP_VERIFY' not in (__verify_unseal_script_content.content | b64decode)"
          - "'VAULT_CACERT' in (__verify_unseal_script_content.content | b64decode)"
        fail_msg: "vault-unseal.sh must use VAULT_CACERT and must not set VAULT_SKIP_VERIFY"

    - name: Read unseal service
      ansible.builtin.slurp:
        src: /usr/lib/systemd/system/vault-unseal.service
      register: __verify_unseal_service_content

    - name: Assert unseal service passes configured CA path
      ansible.builtin.assert:
        that:
          - "'Environment=VAULT_CACERT=/opt/vault/tls/ca.crt' in (__verify_unseal_service_content.content | b64decode)"
        fail_msg: "vault-unseal.service does not pass VAULT_CACERT"

    - name: Assert unseal service runs as root with vault.service coupling
      ansible.builtin.assert:
        that:
          - "'User=' not in (__verify_unseal_service_content.content | b64decode)"
          - "'Requires=vault.service' in (__verify_unseal_service_content.content | b64decode)"
        fail_msg: >-
          vault-unseal.service must run as root (no User= directive; the
          tokens file is root-only 0600) and must Require vault.service

    ###########################################################################
    # fapolicyd trust file
    ###########################################################################
    - name: Slurp fapolicyd trust file
      ansible.builtin.slurp:
        src: /etc/fapolicyd/trust.d/vault.trust
      register: __verify_fapolicyd_slurp

    - name: Stat fapolicyd trust file
      ansible.builtin.stat:
        path: /etc/fapolicyd/trust.d/vault.trust
      register: __verify_fapolicyd_stat

    - name: Stat trusted files for independent hash verification
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        get_mime: false
        get_attributes: false
      loop:
        - /usr/bin/vault
        - /usr/local/bin/vault-audit-backup.sh
        - /usr/local/bin/vault-unseal.sh
      loop_control:
        label: "{{ item }}"
      register: __verify_fapolicyd_files

    - name: Assert fapolicyd trust file shape and content
      vars:
        content: "{{ __verify_fapolicyd_slurp.content | b64decode }}"
        __entries: "{{ content.split('\n') | map('trim') | reject('eq', '') | reject('match', '^#') | list }}"
        __hdr: "{{ content.split('\n') | select('match', '^# Vault package: ') | list }}"
      ansible.builtin.assert:
        fail_msg: "fapolicyd trust file failed shape/content assertions"
        that:
          - "__verify_fapolicyd_stat.stat.exists"
          - "__verify_fapolicyd_stat.stat.mode == '0644'"
          - "__verify_fapolicyd_stat.stat.pw_name == 'root'"
          - "__verify_fapolicyd_stat.stat.gr_name == 'root'"
          - "content.split('\n') | last == ''"
          - "content.split('\n')[:-1] | select('eq', '') | list | length == 0"
          - "content.split('\n')[:-1] | select('match', '^\\s') | list | length == 0"
          - "content.split('\n')[:-1] | select('search', '\\s$') | list | length == 0"
          - "content.split('\n') | first == '# Ansible managed - ansible-role-vault'"
          - "__entries | map('split') | map('first') | sort | list == ['/usr/bin/vault', '/usr/local/bin/vault-audit-backup.sh', '/usr/local/bin/vault-unseal.sh']"
          - "__entries | reject('match', '^\\S+ [0-9]+ [0-9a-f]{64}$') | list | length == 0"
          - "__hdr | list | length == 1"
          - "__hdr | first | trim == '# Vault package: unknown'"

    - name: Assert trust entries match independently computed hashes
      vars:
        content: "{{ __verify_fapolicyd_slurp.content | b64decode }}"
        __entries: "{{ content.split('\n') | map('trim') | reject('eq', '') | reject('match', '^#') | list }}"
      ansible.builtin.assert:
        fail_msg: "trust entry for {{ item.item }} does not match independently computed size/hash"
        that:
          - "item.item ~ ' ' ~ item.stat.size ~ ' ' ~ item.stat.checksum in __entries"
      loop: "{{ __verify_fapolicyd_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Slurp synthetic rc0 render
      ansible.builtin.slurp:
        src: /root/.molecule-fapolicyd-rc0.trust
      register: __verify_fapolicyd_rc0

    - name: Assert synthetic rc0 render exercises the version branch
      vars:
        __rc0_content: "{{ __verify_fapolicyd_rc0.content | b64decode }}"
        __rc0_entries: "{{ __rc0_content.split('\n') | map('trim') | reject('eq', '') | reject('match', '^#') | list }}"
        __rc0_hdr: "{{ __rc0_content.split('\n') | select('match', '^# Vault package: ') | list }}"
      ansible.builtin.assert:
        fail_msg: "synthetic rc0 render failed shape/header assertions"
        that:
          - "__rc0_content.split('\n') | last == ''"
          - "__rc0_content.split('\n')[:-1] | select('eq', '') | list | length == 0"
          - "__rc0_content.split('\n')[:-1] | select('match', '^\\s') | list | length == 0"
          - "__rc0_content.split('\n')[:-1] | select('search', '\\s$') | list | length == 0"
          - "__rc0_entries | reject('match', '^\\S+ [0-9]+ [0-9a-f]{64}$') | list | length == 0"
          - "__rc0_hdr | list | length == 1"
          - "__rc0_hdr | first | trim == '# Vault package: vault-enterprise-fips1403 2.0.3-1'"
