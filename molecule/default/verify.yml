---
###############################################################################
# Filename: molecule/default/verify.yml
# Role: ansible-role-vault
# Summary: Verification playbook - validates STIG compliance in container
# Classification: UNCLASSIFIED
###############################################################################
- name: Verify
  hosts: all
  # Running as root in container - no become needed

  tasks:
    ###########################################################################
    # Directory structure and permissions (NIST AC-6)
    ###########################################################################
    - name: Verify Vault directories exist with STIG permissions
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: __verify_dirs
      loop:
        - { path: /etc/vault.d, mode: '0750', owner: root, group: vault }
        # The PARENT. prepare.yml stages it 0700 root:root (what STIG's umask
        # 077 really produces); all three fields must change for this to pass.
        - { path: /opt/vault, mode: '0750', owner: root, group: vault }
        - { path: /opt/vault/data, mode: '0750', owner: vault, group: vault }
        - { path: /opt/vault/tls, mode: '0750', owner: root, group: vault }
        - { path: /var/log/vault, mode: '0750', owner: vault, group: vault }
        # Root-only backup staging: contains root-only auditd extracts, so
        # the vault service account must have no read access (issue #32)
        - { path: /opt/vault-backup, mode: '0700', owner: root, group: root }
      loop_control:
        label: "{{ item.path }}"

    - name: Assert directory permissions are STIG-compliant
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isdir
          - item.stat.mode == item.item.mode
          # pw_name/gr_name are absent when the uid/gid has no passwd/group
          # entry - default so the fail_msg fires instead of a Jinja error
          - item.stat.pw_name | default('') == item.item.owner
          - item.stat.gr_name | default('') == item.item.group
        fail_msg: >-
          {{ item.item.path }} has incorrect permissions or ownership:
          exists={{ item.stat.exists }},
          mode={{ item.stat.mode | default('missing') }},
          expected={{ item.item.mode }},
          owner={{ item.stat.pw_name | default('missing') }}:{{ item.stat.gr_name | default('missing') }},
          expected_owner={{ item.item.owner }}:{{ item.item.group }}
      loop: "{{ __verify_dirs.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    ###########################################################################
    # Operator-staged TLS material (issue #77)
    #
    # vault_manage_tls is false in this scenario, so tasks/tls.yml is gated off
    # by tasks/main.yml and never executes. prepare.yml stages the trio
    # root:root 0600 -- the posture openssl actually produces. The role must
    # converge it to root:vault 0640 itself, in tasks/system.yml, or vault.service
    # cannot read its own private key.
    #
    # gr_name AND mode are the discriminating assertions: the fixture stages
    # root:root 0600, so both must change for the assert to pass. pw_name is
    # the one the fixture already satisfies by accident -- it is kept as a
    # regression guard against an implementation that hands the files to the
    # vault account (#38), not as evidence of convergence.
    # Hardcoded rather than read from vault_tls_file_mode/vault_group because
    # verify.yml is a plain playbook and loads neither defaults/ nor vars/.
    #
    # Only the cert and key are asserted here: prepare.yml stages ca.crt as a
    # SYMLINK to exercise the scope bound below, so this scenario cannot also
    # prove the CA converges on the in-directory regular-file shape. That shape
    # is covered by molecule/init, which stages all three root:root 0600 as
    # regular files and then starts a REAL vault server on them.
    # NIST 800-53: AC-6 (Least Privilege), SC-8
    ###########################################################################
    # Mode bits are a projection; traversal is the property that actually
    # failed on live hardware. Ask the kernel as the service account itself:
    # a parent that is root:root 0750, or root:vault 0640, satisfies a
    # mode-string check for group-readability and still denies this probe.
    - name: Probe that the vault service account can traverse the root directory
      ansible.builtin.command:
        argv: [runuser, -u, vault, --, test, -x, /opt/vault]
      register: __verify_root_traverse
      changed_when: false
      failed_when: false

    - name: Assert the vault service account can traverse the root directory
      ansible.builtin.assert:
        that:
          - __verify_root_traverse.rc == 0
        fail_msg: >-
          The vault service account cannot traverse /opt/vault (rc={{
          __verify_root_traverse.rc }}). Every path beneath it is unreachable
          regardless of its own ownership, which is the live failure this
          asserts against: "stat /opt/vault/data/vault.db: permission denied".
        success_msg: "vault can traverse /opt/vault"

    - name: Verify operator-staged TLS material
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      register: __verify_staged_tls
      loop:
        - /opt/vault/tls/tls.crt
        - /opt/vault/tls/tls.key

    - name: Assert staged TLS material was converged to root vault 0640
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.isreg
          - item.stat.mode == '0640'
          - item.stat.pw_name | default('') == 'root'
          - item.stat.gr_name | default('') == 'vault'
        fail_msg: >-
          {{ item.item }} was left as staged instead of being converged:
          mode={{ item.stat.mode | default('missing') }} (expected 0640),
          owner={{ item.stat.pw_name | default('missing') }}:{{ item.stat.gr_name | default('missing') }}
          (expected root:vault). vault_manage_tls is false, so tasks/tls.yml
          never runs -- tasks/system.yml must enforce this posture (issue #77).
        success_msg: "{{ item.item }}: root:vault 0640"
      loop: "{{ __verify_staged_tls.results }}"
      loop_control:
        label: "{{ item.item }}"

    ###########################################################################
    # Scope bound: symlinked material and its out-of-tree target are NOT touched
    #
    # prepare.yml stages ca.crt as a symlink to /etc/pki/mock-shared-ca.crt, the
    # certmonger/certbot shape. ansible.builtin.file defaults to follow: true,
    # so an unbounded enforcement would resolve the link and rewrite the SHARED
    # anchor -- chgrp'ing it to vault and dropping world-read from a file other
    # consumers on the host depend on. This asserts the role did neither.
    #
    # The target assertion is the load-bearing one: the link's own mode is
    # meaningless on Linux, so only the target's posture proves follow was not
    # taken. Readability of symlinked material is issue #69's subject.
    ###########################################################################
    - name: Stat the symlinked CA and its out-of-tree target
      ansible.builtin.stat:
        path: "{{ item }}"
        follow: false
      register: __verify_symlink_ca
      loop:
        - /opt/vault/tls/ca.crt
        - /etc/pki/mock-shared-ca.crt

    - name: Assert the symlinked CA and its shared target were left untouched
      ansible.builtin.assert:
        that:
          # still a link, and still pointing where prepare.yml put it:
          # "is a symlink" alone passes even if the role repointed it elsewhere
          - __verify_symlink_ca.results[0].stat.islnk | default(false)
          - __verify_symlink_ca.results[0].stat.lnk_target | default('') == '/etc/pki/mock-shared-ca.crt'
          # the shared anchor kept root:root 0644
          - __verify_symlink_ca.results[1].stat.mode == '0644'
          - __verify_symlink_ca.results[1].stat.pw_name | default('') == 'root'
          - __verify_symlink_ca.results[1].stat.gr_name | default('') == 'root'
        fail_msg: >-
          The role followed a symlinked CA and mutated material outside
          /opt/vault/tls: ca.crt islnk={{ __verify_symlink_ca.results[0].stat.islnk | default('missing') }},
          target /etc/pki/mock-shared-ca.crt is now
          {{ __verify_symlink_ca.results[1].stat.pw_name | default('missing') }}:{{ __verify_symlink_ca.results[1].stat.gr_name | default('missing') }}
          {{ __verify_symlink_ca.results[1].stat.mode | default('missing') }}
          (expected root:root 0644, unchanged). See issue #77 scope bounds.
        success_msg: "symlinked CA and its shared target: untouched"

    ###########################################################################
    # The property the posture exists FOR: vault can READ the key, and cannot
    # REPLACE it. Mode and owner strings are a proxy; this asks the kernel.
    # Before #77 the fixture was vault:vault 0640, so the write probe PASSED --
    # this is the regression that change closes.
    ###########################################################################
    # Mechanism sanity FIRST. `runuser` with failed_when: false returns non-zero
    # when util-linux is absent, and the assert below would then report that as
    # "vault cannot read its own private key" -- a false #77 regression. The
    # same guard precedes the #38 probe block later in this file.
    - name: Confirm runuser is available before the staged-TLS probe
      ansible.builtin.command: runuser --version
      changed_when: false

    - name: Probe the staged key AS the vault user
      ansible.builtin.command: "runuser -u vault -- sh -c '{{ item.cmd }}'"
      register: __verify_tls_asvault
      changed_when: false
      failed_when: false
      loop:
        - { label: "read tls.key", cmd: "test -r /opt/vault/tls/tls.key", want: 0 }
        - { label: "overwrite tls.key", cmd: "echo x >> /opt/vault/tls/tls.key", want: 1 }
      loop_control:
        label: "{{ item.label }}"

    - name: Assert vault can read the key but cannot replace it
      ansible.builtin.assert:
        that:
          - (item.rc == 0) == (item.item.want == 0)
        fail_msg: >-
          {{ item.item.label }} returned rc={{ item.rc }};
          {% if item.item.want == 0 %}
          the vault account cannot read its own private key, so vault.service
          would fail at start (issue #77).
          {% else %}
          the vault account can REPLACE its own private key, which #38 forbids.
          {% endif %}
        success_msg: "{{ item.item.label }}: rc={{ item.rc }} as expected"
      loop: "{{ __verify_tls_asvault.results }}"
      loop_control:
        label: "{{ item.item.label }}"

    ###########################################################################
    # Vault configuration files
    ###########################################################################
    - name: Verify vault.hcl exists with correct permissions
      ansible.builtin.stat:
        path: /etc/vault.d/vault.hcl
      register: __verify_vault_hcl

    - name: Assert vault.hcl permissions
      ansible.builtin.assert:
        that:
          - __verify_vault_hcl.stat.exists
          - __verify_vault_hcl.stat.mode == '0640'
          - __verify_vault_hcl.stat.pw_name == 'root'
          - __verify_vault_hcl.stat.gr_name == 'vault'
        fail_msg: "vault.hcl has incorrect permissions or ownership (expect root:vault 0640, #38)"

    - name: Verify vault.env exists with correct permissions
      ansible.builtin.stat:
        path: /etc/vault.d/vault.env
      register: __verify_vault_env

    - name: Assert vault.env permissions
      ansible.builtin.assert:
        that:
          - __verify_vault_env.stat.exists
          - __verify_vault_env.stat.mode == '0600'
          - __verify_vault_env.stat.pw_name == 'root'
          - __verify_vault_env.stat.gr_name == 'root'
        fail_msg: "vault.env has incorrect permissions or ownership (expect root:root 0600, #38/#41)"

    ###########################################################################
    # vault.hcl content validation
    ###########################################################################
    - name: Read vault.hcl content
      ansible.builtin.slurp:
        src: /etc/vault.d/vault.hcl
      register: __verify_vault_hcl_content

    - name: Assert vault.hcl contains required configuration
      ansible.builtin.assert:
        that:
          - "'ui' in (__verify_vault_hcl_content.content | b64decode)"
          - "'storage \"raft\"' in (__verify_vault_hcl_content.content | b64decode)"
          - "'listener \"tcp\"' in (__verify_vault_hcl_content.content | b64decode)"
          - "'tls_min_version' in (__verify_vault_hcl_content.content | b64decode)"
          - "'tls_max_version' in (__verify_vault_hcl_content.content | b64decode)"
        fail_msg: "vault.hcl is missing required configuration blocks"

    - name: Assert vault.hcl does NOT contain deprecated parameters
      ansible.builtin.assert:
        that:
          - "'tls_prefer_server_cipher_suites' not in (__verify_vault_hcl_content.content | b64decode)"
        fail_msg: "vault.hcl contains deprecated tls_prefer_server_cipher_suites"

    ###########################################################################
    # Logrotate configuration (NIST AU-4)
    ###########################################################################
    - name: Verify logrotate config exists
      ansible.builtin.stat:
        path: /etc/logrotate.d/vault
      register: __verify_logrotate

    - name: Assert logrotate config exists
      ansible.builtin.assert:
        that:
          - __verify_logrotate.stat.exists

    - name: Read logrotate config
      ansible.builtin.slurp:
        src: /etc/logrotate.d/vault
      register: __verify_logrotate_content

    - name: Assert logrotate has 90-day minimum retention
      ansible.builtin.assert:
        that:
          - "'rotate 90' in (__verify_logrotate_content.content | b64decode)"
        fail_msg: "Logrotate does not meet STIG 90-day minimum retention"

    ###########################################################################
    # Systemd unit files (STIG services)
    ###########################################################################
    - name: Verify STIG systemd unit files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      register: __verify_units
      loop:
        - /usr/lib/systemd/system/vault-audit-backup.service
        - /usr/lib/systemd/system/vault-audit-backup.timer
        - /usr/lib/systemd/system/vault-unseal.service
      loop_control:
        label: "{{ item | basename }}"

    - name: Assert STIG systemd units exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing systemd unit: {{ item.item }}"
      loop: "{{ __verify_units.results }}"
      loop_control:
        label: "{{ item.item | basename }}"

    - name: Read vault-audit-backup.service unit
      ansible.builtin.slurp:
        src: /usr/lib/systemd/system/vault-audit-backup.service
      register: __verify_backup_unit_content

    - name: Assert audit backup retention variable is wired into the unit
      ansible.builtin.assert:
        that:
          # 14 is the deliberately non-default value set in converge.yml:
          # proves the variable flows, not merely the script default.
          # Anchored so RETENTION_DAYS=140 etc. cannot pass.
          - >-
            __verify_backup_unit_content.content | b64decode
            is search('(?m)^Environment=RETENTION_DAYS=14$')
        fail_msg: >-
          vault-audit-backup.service does not inject RETENTION_DAYS from
          vault_stig_audit_backup_retention_days (issue #32)

    ###########################################################################
    # Script files
    ###########################################################################
    - name: Verify audit backup script exists with correct permissions
      ansible.builtin.stat:
        path: /usr/local/bin/vault-audit-backup.sh
      register: __verify_backup_script

    - name: Assert audit backup script permissions
      ansible.builtin.assert:
        that:
          - __verify_backup_script.stat.exists
          - __verify_backup_script.stat.mode == '0750'
        fail_msg: "vault-audit-backup.sh missing or incorrect permissions"

    - name: Verify unseal script exists with correct permissions
      ansible.builtin.stat:
        path: /usr/local/bin/vault-unseal.sh
      register: __verify_unseal_script

    - name: Assert unseal script permissions
      ansible.builtin.assert:
        that:
          - __verify_unseal_script.stat.exists
          - __verify_unseal_script.stat.mode == '0750'
          - __verify_unseal_script.stat.pw_name == 'root'
          - __verify_unseal_script.stat.gr_name == 'root'
        fail_msg: >-
          vault-unseal.sh missing, incorrect permissions, or not root:root
          (root-run service; vault user must not be able to edit it)

    - name: Read unseal script
      ansible.builtin.slurp:
        src: /usr/local/bin/vault-unseal.sh
      register: __verify_unseal_script_content

    - name: Assert unseal script validates TLS instead of skipping verification
      ansible.builtin.assert:
        that:
          - "'VAULT_SKIP_VERIFY' not in (__verify_unseal_script_content.content | b64decode)"
          - "'VAULT_CACERT' in (__verify_unseal_script_content.content | b64decode)"
        fail_msg: "vault-unseal.sh must use VAULT_CACERT and must not set VAULT_SKIP_VERIFY"

    - name: Read unseal service
      ansible.builtin.slurp:
        src: /usr/lib/systemd/system/vault-unseal.service
      register: __verify_unseal_service_content

    - name: Assert unseal service passes configured CA path
      ansible.builtin.assert:
        that:
          - "'Environment=VAULT_CACERT=/opt/vault/tls/ca.crt' in (__verify_unseal_service_content.content | b64decode)"
        fail_msg: "vault-unseal.service does not pass VAULT_CACERT"

    # Line-anchored: a comment MENTIONING the directives must not trip this,
    # only a real directive at line start (review round 1, finding 1).
    - name: Assert unseal service runs as root with vault.service coupling
      ansible.builtin.assert:
        that:
          # splitlines() (NOT split('\n')): a folded/plain scalar does not
          # process the \n escape, so split('\n') would silently no-op and
          # this absence check would pass vacuously (#33 review, same class).
          - >-
            (__verify_unseal_service_content.content | b64decode).splitlines()
            | select('match', '^(User|Group)=')
            | list | length == 0
          - "'Requires=vault.service' in (__verify_unseal_service_content.content | b64decode)"
          - "'Environment=VAULT_ADDR=https://127.0.0.1:8205' in (__verify_unseal_service_content.content | b64decode)"
          - "'WantedBy=multi-user.target vault.service' in (__verify_unseal_service_content.content | b64decode)"
          - "'PartOf=vault.service' in (__verify_unseal_service_content.content | b64decode)"
        fail_msg: >-
          vault-unseal.service must run as root (no User=/Group= directive;
          the tokens file is root-only 0600), must Require vault.service,
          must pass VAULT_ADDR with the configured listener port, must be
          PartOf vault.service (explicit stop/restart propagation,
          redundant with Requires), and must be WantedBy vault.service
          (start re-pull)

    - name: Stat vault.service.wants symlink for the unseal unit
      ansible.builtin.stat:
        path: /etc/systemd/system/vault.service.wants/vault-unseal.service
      register: __verify_unseal_wants

    - name: Assert the vault.service.wants link resolves to the real unit
      ansible.builtin.assert:
        that:
          - __verify_unseal_wants.stat.islnk | default(false)
          - >-
            __verify_unseal_wants.stat.lnk_source | default('')
            == '/usr/lib/systemd/system/vault-unseal.service'
        fail_msg: >-
          vault.service.wants/vault-unseal.service missing or not resolving
          to /usr/lib/systemd/system/vault-unseal.service — the [Install]
          WantedBy coupling exists only as unit text, or the repair guard
          accepted a stale/wrong-target link; enable/reenable did not
          materialize the correct link

    ###########################################################################
    # fapolicyd trust file
    ###########################################################################
    - name: Slurp fapolicyd trust file
      ansible.builtin.slurp:
        src: /etc/fapolicyd/trust.d/vault.trust
      register: __verify_fapolicyd_slurp

    - name: Stat fapolicyd trust file
      ansible.builtin.stat:
        path: /etc/fapolicyd/trust.d/vault.trust
      register: __verify_fapolicyd_stat

    - name: Stat trusted files for independent hash verification
      ansible.builtin.stat:
        path: "{{ item }}"
        checksum_algorithm: sha256
        get_mime: false
        get_attributes: false
      loop:
        - /usr/bin/vault
        - /usr/local/bin/vault-audit-backup.sh
        - /usr/local/bin/vault-unseal.sh
      loop_control:
        label: "{{ item }}"
      register: __verify_fapolicyd_files

    - name: Assert fapolicyd trust file shape and content
      vars:
        content: "{{ __verify_fapolicyd_slurp.content | b64decode }}"
        __entries: "{{ content.split('\n') | map('trim') | reject('eq', '') | reject('match', '^#') | list }}"
        __hdr: "{{ content.split('\n') | select('match', '^# Vault package: ') | list }}"
      ansible.builtin.assert:
        fail_msg: "fapolicyd trust file failed shape/content assertions"
        that:
          - "__verify_fapolicyd_stat.stat.exists"
          - "__verify_fapolicyd_stat.stat.mode == '0644'"
          - "__verify_fapolicyd_stat.stat.pw_name == 'root'"
          - "__verify_fapolicyd_stat.stat.gr_name == 'root'"
          - "content.split('\n') | last == ''"
          - "content.split('\n')[:-1] | select('eq', '') | list | length == 0"
          - "content.split('\n')[:-1] | select('match', '^\\s') | list | length == 0"
          - "content.split('\n')[:-1] | select('search', '\\s$') | list | length == 0"
          - "content.split('\n') | first == '# Ansible managed - ansible-role-vault'"
          - "__entries | map('split') | map('first') | sort | list == ['/usr/bin/vault', '/usr/local/bin/vault-audit-backup.sh', '/usr/local/bin/vault-unseal.sh']"
          - "__entries | reject('match', '^\\S+ [0-9]+ [0-9a-f]{64}$') | list | length == 0"
          - "__hdr | list | length == 1"
          - "__hdr | first | trim == '# Vault package: unknown'"

    - name: Assert trust entries match independently computed hashes
      vars:
        content: "{{ __verify_fapolicyd_slurp.content | b64decode }}"
        __entries: "{{ content.split('\n') | map('trim') | reject('eq', '') | reject('match', '^#') | list }}"
      ansible.builtin.assert:
        fail_msg: "trust entry for {{ item.item }} does not match independently computed size/hash"
        that:
          - "item.item ~ ' ' ~ item.stat.size ~ ' ' ~ item.stat.checksum in __entries"
      loop: "{{ __verify_fapolicyd_files.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Slurp synthetic rc0 render
      ansible.builtin.slurp:
        src: /root/.molecule-fapolicyd-rc0.trust
      register: __verify_fapolicyd_rc0

    - name: Assert synthetic rc0 render exercises the version branch
      vars:
        __rc0_content: "{{ __verify_fapolicyd_rc0.content | b64decode }}"
        __rc0_entries: "{{ __rc0_content.split('\n') | map('trim') | reject('eq', '') | reject('match', '^#') | list }}"
        __rc0_hdr: "{{ __rc0_content.split('\n') | select('match', '^# Vault package: ') | list }}"
      ansible.builtin.assert:
        fail_msg: "synthetic rc0 render failed shape/header assertions"
        that:
          - "__rc0_content.split('\n') | last == ''"
          - "__rc0_content.split('\n')[:-1] | select('eq', '') | list | length == 0"
          - "__rc0_content.split('\n')[:-1] | select('match', '^\\s') | list | length == 0"
          - "__rc0_content.split('\n')[:-1] | select('search', '\\s$') | list | length == 0"
          - "__rc0_entries | reject('match', '^\\S+ [0-9]+ [0-9a-f]{64}$') | list | length == 0"
          - "__rc0_hdr | list | length == 1"
          - "__rc0_hdr | first | trim == '# Vault package: vault-enterprise-fips1403 2.0.3-1'"

    ###########################################################################
    # AIDE presence-gate (issue #43): molecule enables the check but the
    # container ships no aide, so the role must warn+skip — no unit deployed.
    ###########################################################################
    - name: Stat the AIDE service unit (must be absent — aide not installed)
      ansible.builtin.stat:
        path: /usr/lib/systemd/system/vault-aide-check.service
      register: __verify_aide_unit

    - name: Assert AIDE integration skipped when aide is absent
      ansible.builtin.assert:
        that:
          - not __verify_aide_unit.stat.exists
        fail_msg: >-
          vault-aide-check.service was deployed even though aide is not
          installed — the presence gate did not fire.

    ###########################################################################
    # Least-privilege ownership (issue #38): the vault process must NOT be able
    # to write the artifacts that define its posture, but MUST still write its
    # own data. Run writes AS the vault user via `runuser` (util-linux) — NOT
    # `become_user: vault` (the image has no sudo and vault's shell is /bin/false).
    ###########################################################################
    - name: Confirm runuser is available (mechanism sanity)
      # `runuser --version` execs the real binary (util-linux). Do NOT use
      # `command -v runuser`: `command` is a shell builtin, and
      # ansible.builtin.command execvp's a literal binary named `command`
      # (absent on RHEL/UBI) → "Unable to find executable" (branch-review RC3).
      ansible.builtin.command: runuser --version
      changed_when: false

    - name: Attempt writes AS the vault user (must be DENIED post-#38)
      ansible.builtin.command: "runuser -u vault -- sh -c '{{ item.cmd }}'"
      register: __vault_write
      changed_when: false
      failed_when: false
      loop:
        - { label: "append vault.hcl", cmd: "echo x >> /etc/vault.d/vault.hcl" }
        - { label: "append vault.env", cmd: "echo x >> /etc/vault.d/vault.env" }
        - { label: "create in /opt/vault/tls", cmd: "echo x > /opt/vault/tls/attack.crt" }
      loop_control:
        label: "{{ item.label }}"

    - name: Assert every write AS vault was DENIED (rc != 0)
      ansible.builtin.assert:
        that:
          - item.rc != 0
        fail_msg: "vault user could WRITE {{ item.item.label }} (rc {{ item.rc }}) — #38 not enforced"
        success_msg: "denied: {{ item.item.label }}"
      loop: "{{ __vault_write.results }}"
      loop_control:
        label: "{{ item.item.label }}"

    - name: Regression guard — vault cannot create in /etc/vault.d (already root:vault; GREEN throughout)
      ansible.builtin.command: "runuser -u vault -- sh -c 'echo x > /etc/vault.d/probe'"
      register: __vaultd_create
      changed_when: false
      failed_when: __vaultd_create.rc == 0

    - name: Regression guard — vault CAN still write its own data dir (must SUCCEED)
      # Hardcode the path: verify.yml does NOT load the role's vars/main.yml, so
      # {{ vault_data_dir }} is undefined here (the other tests use literal paths).
      ansible.builtin.command: "runuser -u vault -- sh -c 'echo x > /opt/vault/data/probe'"
      register: __data_write
      changed_when: false
      failed_when: __data_write.rc != 0
