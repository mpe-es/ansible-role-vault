---
###############################################################################
# Filename: molecule/hsm/molecule.yml
# Role: ansible-role-vault
# Summary: HSM PIN handling scenario (issue #41) - renders the pkcs11 seal
#   config with a valid sentinel PIN and proves the PIN lands in vault.env
#   (double-quoted), NEVER in vault.hcl, and never in --diff. No real HSM /
#   no real Vault (modeled on molecule/default, the no-Vault scenario).
# Classification: UNCLASSIFIED
###############################################################################
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: podman

platforms:
  - name: vault-el
    image: ${MOLECULE_IMAGE:-registry.access.redhat.com/ubi9/ubi-init:latest}
    pre_build_image: true
    privileged: true
    command: /usr/sbin/init

provisioner:
  name: ansible
  connection_options:
    ansible_become: false
  env:
    ANSIBLE_ROLES_PATH: ${MOLECULE_PROJECT_DIRECTORY}/..
  # As molecule/default: skip preflight (real host) and service_start (the mock
  # unit is a oneshot stub). 'install' is NOT tag-skipped; gated by
  # vault_manage_install below.
  options:
    skip-tags: preflight,service_start
  inventory:
    host_vars:
      vault-el:
        ansible_user: root
        ansible_python_interpreter: ${MOLECULE_PYTHON:-/usr/bin/python3}
        vault_manage_repo: false
        vault_manage_firewall: false
        vault_manage_tls: false
        vault_manage_install: false
        vault_manage_selinux: false
        vault_manage_fapolicyd: false
        vault_initialize: false
        vault_disable_mlock: true
        # HSM enabled with a VALID sentinel PIN. Leading/trailing spaces exercise
        # the double-quote whitespace preservation through the render.
        vault_hsm_enabled: true
        vault_hsm_pin: " S3NTINEL-hsm-pin "
        vault_hsm_lib_path: /usr/lib64/pkcs11/stub.so
        vault_hsm_key_label: vault-key
        vault_hsm_hmac_key_label: vault-hmac
        vault_listener_port: 8200
        vault_api_addr: "https://127.0.0.1:8200"
        vault_cluster_addr: "https://127.0.0.1:8201"
        vault_raft_node_id: vault-hsm

verifier:
  name: ansible
