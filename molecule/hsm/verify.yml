---
###############################################################################
# Filename: molecule/hsm/verify.yml
# Role: ansible-role-vault
# Summary: Verify HSM PIN handling (issue #41), no real HSM:
#   Test 1 - vault.hcl has NO PIN; vault.env HAS the double-quoted PIN; the
#            vault.env deploy task carries diff:false (static guard). The real
#            --check --diff suppression is grepped in the CI job (Task 6).
#   Test 2 - systemd EnvironmentFile preserves a double-quoted value verbatim
#            (leading/trailing whitespace) on the target systemd.
#   Test 3 - the §2a charset assert fails CLOSED on an unsafe PIN.
#   Test 4 - the licence is a STATE (#42, review of #95): clearing
#            vault_license_content removes vault.hclic, moving to a Community
#            edition removes it, and vault_license_manage_state=false leaves an
#            out-of-band licence alone. Runs LAST -- each case re-runs
#            configure.yml and re-renders vault.hcl/vault.env.
# Classification: UNCLASSIFIED
###############################################################################
- name: "Verify (HSM PIN handling, issue #41)"
  hosts: all
  vars:
    __core: "S3NTINEL-hsm-pin"
    __env_line: 'VAULT_HSM_PIN=" S3NTINEL-hsm-pin "'
  tasks:
    # --- Test 1: render — FILE CONTENTS (sound; not vacuous) --------------
    - name: Slurp rendered vault.hcl and vault.env
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - /etc/vault.d/vault.hcl
        - /etc/vault.d/vault.env
      register: __files

    - name: Assert vault.hcl has NO PIN and vault.env HAS the double-quoted PIN
      ansible.builtin.assert:
        that:
          - __core not in (__files.results[0].content | b64decode)
          - "'pin ' not in (__files.results[0].content | b64decode)"
          - __env_line in (__files.results[1].content | b64decode)
        fail_msg: "PIN placement wrong (see #41)"
        success_msg: "PIN is in vault.env (double-quoted) and absent from vault.hcl"

    - name: Assert the vault.env deploy task carries diff:false (static guard)
      ansible.builtin.assert:
        that:
          # Scoped to the vault.env task's OWN comment. A bare 'diff: false'
          # substring stopped binding when the licence deploy (#42) added a
          # second one -- deleting this task's would have left the check green.
          # The authoritative per-task lock is
          # tests/assert-configure-gates-the-render.sh.
          - "'keep it out of --diff (#41)' in lookup('file', playbook_dir ~ '/../../tasks/configure.yml')"
        fail_msg: "configure.yml lost the vault.env diff:false — PIN could leak into --diff"

    # --- Test 1b: the licence file's on-disk posture (#42) ----------------
    # The static guard asserts what configure.yml DECLARES; this asserts what
    # actually landed. Both matter: a declaration can be right while a umask,
    # an SELinux context or a pre-existing file makes the result wrong.
    - name: Stat the deployed licence file
      ansible.builtin.stat:
        path: /etc/vault.d/vault.hclic
      register: __hsm_licence

    - name: Assert the licence landed root:vault 0640
      ansible.builtin.assert:
        that:
          - __hsm_licence.stat.exists
          - __hsm_licence.stat.mode == '0640'
          - __hsm_licence.stat.pw_name == 'root'
          - __hsm_licence.stat.gr_name == 'vault'
        fail_msg: >-
          vault.hclic posture wrong (expect root:vault 0640, #38/#77) --
          exists={{ __hsm_licence.stat.exists }}
          mode={{ __hsm_licence.stat.mode | default('n/a') }}
          owner={{ __hsm_licence.stat.pw_name | default('n/a') }}:{{ __hsm_licence.stat.gr_name | default('n/a') }}

    # --- Test 2: systemd EnvironmentFile quote round-trip (no HSM) --------
    - name: Write a round-trip probe EnvironmentFile (quoted, leading/trailing space)
      ansible.builtin.copy:
        dest: /tmp/rt.env
        content: "VAULT_HSM_PIN=\" abc \"\n"
        mode: '0600'

    - name: Deploy a oneshot unit that echoes the env var to a file
      ansible.builtin.copy:
        dest: /usr/lib/systemd/system/rt-probe.service
        mode: '0644'
        content: |
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          EnvironmentFile=/tmp/rt.env
          # %%s: escape the systemd specifier so printf gets a literal %s (a bare
          # %s in a unit is systemd's "user shell" specifier -> /bin/bash).
          # $VAULT_HSM_PIN (single $) is left for the shell to expand from the
          # EnvironmentFile-loaded environment — which is exactly what we test.
          ExecStart=/bin/sh -c 'printf %%s "$VAULT_HSM_PIN" > /tmp/rt.out'

    - name: Start the round-trip probe
      ansible.builtin.systemd_service:
        name: rt-probe
        state: started
        daemon_reload: true

    - name: Read back the delivered value
      ansible.builtin.slurp:
        src: /tmp/rt.out
      register: __rt

    - name: Assert systemd preserved the quoted value byte-for-byte (incl. spaces)
      ansible.builtin.assert:
        that:
          - (__rt.content | b64decode) == ' abc '
        fail_msg: >-
          systemd EnvironmentFile did NOT preserve the quoted value
          (got '{{ __rt.content | b64decode }}') — double-quoting assumption wrong.

    # --- Test 3a: §2a charset assert fails CLOSED via the REAL assert path -
    - name: Prove the charset assert aborts the play on an embedded-quote PIN
      block:
        - name: Run the charset assert with an unsafe PIN (must fail)
          ansible.builtin.assert:
            that:
              - vault_hsm_pin | regex_search('[\x00-\x1f\x7f"\\\\]') is none
            fail_msg: "REJECT_UNSAFE_PIN"
          vars:
            vault_hsm_pin: 'embed"quote'

        - name: This must be unreachable (charset assert is a no-op)
          ansible.builtin.fail:
            msg: "charset assert did NOT reject an embedded quote — §2a is a no-op"
      rescue:
        - name: Confirm the failure was the charset assert (not something else)
          ansible.builtin.assert:
            that:
              - "'REJECT_UNSAFE_PIN' in ansible_failed_result.msg"
            fail_msg: "failed, but not at the charset assert"
            success_msg: "charset assert correctly rejected the unsafe PIN"

    # --- Test 3b: table-driven — the regex rejects EVERY prohibited family
    #     and accepts safe values (durable against a char-class regression) --
    - name: The charset regex REJECTS every prohibited character family
      ansible.builtin.assert:
        that:
          - item | regex_search('[\x00-\x1f\x7f"\\\\]') is not none
        fail_msg: "charset regex FAILED to reject: {{ item | to_json }}"
        quiet: true
      loop:
        - 'embed"quote'      # double-quote
        - 'back\slash'       # backslash
        - "line\nfeed"       # LF
        - "carriage\rret"    # CR
        - "tab\tchar"        # tab
        - "del\x7fchar"      # DEL
        - "ctrl\x01char"     # C0 low-end (SOH; avoid a literal NUL, which Ansible chokes on)
      loop_control:
        label: "reject {{ item | to_json }}"

    - name: "The charset regex ACCEPTS safe values (incl. #, =, $, spaces)"
      ansible.builtin.assert:
        that:
          - item | regex_search('[\x00-\x1f\x7f"\\\\]') is none
        fail_msg: "charset regex WRONGLY rejected safe value: {{ item | to_json }}"
        quiet: true
      loop:
        - 'plainPIN123'
        - ' leading-and-trailing '
        - 'has#hash=eq$dollar'
        - "unicode-café-ok"
      loop_control:
        label: "accept {{ item | to_json }}"

    # --- Test 4: the licence is a STATE, not a one-way deploy --------------
    #     (#42, review of #95)
    #
    # LAST in this file deliberately. Each case re-runs tasks/configure.yml,
    # which re-renders vault.hcl and vault.env as a side effect. Test 1 slurped
    # both long before this point, and nothing below reads them.
    #
    # Driven with include_role + tasks_from and per-case vars -- the idiom
    # tests/local-preflight-harness/run.yml uses for its eighteen DNS cases. A
    # second converge cannot express these: molecule fixes each scenario's
    # licence posture ONCE in molecule.yml, so no container run ever transitions
    # between postures. That is precisely why the missing absent state survived
    # a green 18-job matrix.
    #
    # The restores between cases are plain copies, not role runs. They are SETUP,
    # and routing them through the role would make each case depend on the
    # correctness of the thing the next case is trying to measure.

    # 4a: present -> empty. THE defect this review found.
    - name: "4a present -> empty | re-run configure with no licence supplied"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: configure.yml
      vars:
        vault_license_content: ""

    - name: 4a | stat vault.hclic after the licence was withdrawn
      ansible.builtin.stat:
        path: /etc/vault.d/vault.hclic
      register: __lic_4a

    - name: 4a | assert the withdrawn licence is GONE
      ansible.builtin.assert:
        that:
          - not __lic_4a.stat.exists
        fail_msg: >-
          vault.hclic STILL EXISTS after vault_license_content was cleared.
          license_path references it unconditionally on Enterprise, so the node
          keeps running on an entitlement the desired state retired -- and the
          role reports success (review of #95).
        success_msg: "4a ok: clearing vault_license_content removes vault.hclic"

    - name: 4a | restore the sentinel licence (SETUP, not via the role)
      ansible.builtin.copy:
        content: "SENTINEL-NOT-A-REAL-LICENCE-#42"
        dest: /etc/vault.d/vault.hclic
        owner: root
        group: vault
        mode: '0640'
      no_log: true
      diff: false

    # 4b: Enterprise -> Community. vault_hsm_enabled MUST drop with the edition:
    # configure.yml includes preflight/edition.yml, and a PKCS#11 seal on a
    # Community build is exactly what that gate exists to refuse (#62). Flipping
    # the edition alone would fail this case for the RIGHT reason at the WRONG
    # assert, and would prove nothing about the licence.
    - name: "4b Enterprise -> Community | re-run configure on the Community build"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: configure.yml
      vars:
        vault_edition: "vault"
        vault_hsm_enabled: false

    - name: 4b | stat vault.hclic after moving to Community
      ansible.builtin.stat:
        path: /etc/vault.d/vault.hclic
      register: __lic_4b

    - name: 4b | assert Community does not keep entitlement material
      ansible.builtin.assert:
        that:
          - not __lic_4b.stat.exists
        fail_msg: >-
          vault.hclic survived the move to a Community edition. Community renders
          no license_path, so the file is unreferenced entitlement material left
          readable by the vault group for no operational reason (review of #95).
        success_msg: "4b ok: Enterprise -> Community removes vault.hclic"

    - name: 4b | restore the sentinel licence (SETUP, not via the role)
      ansible.builtin.copy:
        content: "SENTINEL-NOT-A-REAL-LICENCE-#42"
        dest: /etc/vault.d/vault.hclic
        owner: root
        group: vault
        mode: '0640'
      no_log: true
      diff: false

    # 4c: the escape hatch. vault_license_content is EMPTY BY DEFAULT, so without
    # this opt-out the role would delete an out-of-band licence -- a golden image,
    # a separate playbook, VAULT_LICENSE_PATH -- on the first routine run that
    # simply never set the variable. This case proves the hatch actually holds.
    - name: "4c unmanaged | re-run configure with no licence AND management off"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: configure.yml
      vars:
        vault_license_content: ""
        vault_license_manage_state: false

    - name: 4c | stat vault.hclic with management disabled
      ansible.builtin.stat:
        path: /etc/vault.d/vault.hclic
      register: __lic_4c

    - name: 4c | assert an out-of-band licence was left ALONE
      ansible.builtin.assert:
        that:
          - __lic_4c.stat.exists
          - __lic_4c.stat.mode == '0640'
        fail_msg: >-
          vault.hclic was removed although vault_license_manage_state is false.
          The role deleted a file it did not write; on an Enterprise node that
          costs Enterprise features -- including the PKCS#11 seal -- at the next
          restart.
        success_msg: "4c ok: vault_license_manage_state=false leaves vault.hclic alone"
