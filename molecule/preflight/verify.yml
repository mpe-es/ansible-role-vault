---
###############################################################################
# Filename: molecule/preflight/verify.yml
# Role: ansible-role-vault
# Summary: Prove each repaired gate FIRES on its own cause and does NOT fire
#   when its feature is toggled off (issue #36).
#
#   A fires-case wraps the gate in block/rescue and asserts the rescue ran AND
#   that ansible_failed_result.msg carries THAT gate's own remediation text.
#   Asserting only "it failed" cannot discriminate: the gate under test and an
#   unrelated defect both produce a failed task. Only the message separates them.
#
#   A did-not-fire case asserts the gate's register shows skipped -- not merely
#   that nothing failed, which is also what a silently deleted gate looks like.
#   One exception, stated rather than implied: the mirror-source RHSM case has
#   no marker assertion. It is still non-vacuous (removing the source predicate
#   makes it fail on the unregistered fixture, and another case catches deleting
#   the gate outright), but it does not check a skipped register.
#
#   fips.yml and selinux.yml are deliberately NOT exercised: both read state
#   from the host kernel, so a container inherits the runner's answer. They pass
#   on a FIPS-enabled host and fail on GitHub's runners -- a test that looks
#   like proof and is not. Their zero-CI-coverage is a named gap; closing it
#   needs a FIPS-enabled self-hosted runner.
# Classification: UNCLASSIFIED
###############################################################################
- name: Verify preflight gates
  hosts: all
  gather_facts: true

  pre_tasks:
    # Fixtures below override individual FACTS per include. With
    # INJECT_FACTS_AS_VARS gone (#78) the gates read ansible_facts[...], so
    # setting `ansible_fqdn:` in vars no longer reaches them -- the gate would
    # silently read the container's real value and the case would stop testing
    # what it names. Overriding ansible_facts directly self-references and dies
    # with "Recursive loop detected"; replacing the whole dict loses every other
    # fact. Snapshotting once into a plain var breaks the self-reference, so a
    # per-include `ansible_facts: "{{ __real_facts | combine({...}) }}"` is
    # scoped, leak-free and keeps the untouched facts. All three behaviours were
    # measured before this was written.
    - name: Snapshot the real facts so fixtures can override one at a time
      ansible.builtin.set_fact:
        __real_facts: "{{ ansible_facts }}"

  tasks:
    ###########################################################################
    # The repo-source gate - repo source coherence
    ###########################################################################
    - name: "FIRES - satellite mode on a non-RHEL host"
      block:
        - name: Run repo_source with a simulated EL rebuild
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/repo_source.yml
          vars:
            vault_manage_repo: true
            vault_repo_source: satellite
            ansible_facts: "{{ __real_facts | combine({'distribution': 'Rocky'}) }}"
        - name: Satellite-on-rebuild should not have passed
          ansible.builtin.fail:
            msg: "repo_source did not fire for satellite on a non-RHEL host"
      rescue:
        - name: Assert the rebuild message names the cause
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('does not manage EL rebuilds')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"

    - name: "FIRES - mirror mode still pointing at the public GPG key"
      block:
        - name: Run repo_source with an internal URL but upstream key
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/repo_source.yml
          vars:
            vault_manage_repo: true
            vault_repo_source: mirror
            vault_repo_url: https://repo.closednetwork.local/hashicorp
        - name: Upstream GPG key should not have passed
          ansible.builtin.fail:
            msg: "repo_source did not fire for an upstream GPG key"
      rescue:
        - name: Assert the GPG message names the key, not the URL
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('vault_repo_gpg_key')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"

    - name: "DID NOT FIRE - master switch off suppresses the repo-source gate entirely"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/repo_source.yml
      vars:
        vault_manage_repo: false
        vault_repo_source: satellite
        ansible_facts: "{{ __real_facts | combine({'distribution': 'Rocky'}) }}"

    - name: Assert the repo-source marker was skipped, not merely non-failing
      ansible.builtin.assert:
        that:
          - __vault_repo_source_marker is defined
          - __vault_repo_source_marker.skipped | default(false)
        fail_msg: >-
          repo_source ran with vault_manage_repo false. A suppressed gate must
          register skipped; "nothing failed" is also what a deleted gate looks
          like.

    - name: "EXECUTES - hashicorp source enters the repo-source gate but fires no cause"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/repo_source.yml
      vars:
        vault_manage_repo: true
        vault_repo_source: hashicorp

    - name: Assert the marker ran while every cause-assert skipped
      ansible.builtin.assert:
        that:
          - not (__vault_repo_source_marker.skipped | default(false))
          - not (__vault_repo_source_marker.failed | default(false))
          - __vault_repo_source_rhel.skipped | default(false)
          - __vault_repo_source_url.skipped | default(false)
          - __vault_repo_source_gpg.skipped | default(false)
        fail_msg: >-
          The repo-source gate's marker must EXECUTE under a non-firing source while its cause
          asserts skip. Without that distinction, "suppressed by
          vault_manage_repo" and "this source has no checks" are byte-identical.

    ###########################################################################
    # The TLS gate - TLS trio (inverted polarity: the switch being OFF turns it ON)
    ###########################################################################
    - name: "FIRES - staged certificate is missing"
      block:
        - name: Run tls with a missing certificate
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/tls.yml
          vars:
            vault_manage_tls: false
            vault_tls_cert_file: /tmp/preflight-fixtures/absent.crt
            vault_tls_key_file: /tmp/preflight-fixtures/good.key
            vault_tls_ca_file: /tmp/preflight-fixtures/good.ca
        - name: Missing certificate should not have passed
          ansible.builtin.fail:
            msg: "tls did not fire for a missing certificate"
      rescue:
        - name: Assert the message names the missing file
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([])
                | map(attribute='msg', default='') | join(' ') is search('but it is missing')
            fail_msg: "wrong cause: {{ ansible_failed_result | default('') }}"

    - name: "FIRES - staged path is a directory, not a regular file"
      block:
        - name: Run tls against a directory
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/tls.yml
          vars:
            vault_manage_tls: false
            vault_tls_cert_file: /tmp/preflight-fixtures/isdir.crt
            vault_tls_key_file: /tmp/preflight-fixtures/good.key
            vault_tls_ca_file: /tmp/preflight-fixtures/good.ca
        - name: Directory should not have passed
          ansible.builtin.fail:
            msg: "tls did not fire for a directory in place of a certificate"
      rescue:
        - name: Assert the message names the file-type cause
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([])
                | map(attribute='msg', default='') | join(' ') is search('not a regular file')
            fail_msg: "wrong cause: {{ ansible_failed_result | default('') }}"

    - name: "PASSES - a symlinked certificate is accepted"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/tls.yml
      vars:
        vault_manage_tls: false
        vault_tls_cert_file: /tmp/preflight-fixtures/link.crt
        vault_tls_key_file: /tmp/preflight-fixtures/good.key
        vault_tls_ca_file: /tmp/preflight-fixtures/good.ca

    - name: Assert that pass-case actually evaluated all three files
      ansible.builtin.assert:
        that:
          - __vault_tls_ok is defined
          - __vault_tls_ok.results | default([]) | length == 3
          # rejectattr('failed') on TRUTHINESS, never on 'defined': the stat
          # carries failed_when: false, which DEFINES .failed as False on every
          # result. Testing for the key's existence rejects all three -- the
          # exact rewriting this issue exists to repair, and I reintroduced it
          # here while asserting about the gate that repairs it.
          - __vault_tls_ok.results | rejectattr('failed') | list | length == 3
        fail_msg: >-
          The TLS pass-case did not evaluate three files cleanly:
          {{ __vault_tls_ok.results | default([]) | length }} results. Placed
          AFTER a pass case deliberately -- before one, it consumes the previous
          failing case's results and reports success for the wrong run.

    # Every other TLS case sets vault_manage_tls: false, so deleting the
    # production `when: not (vault_manage_tls | bool)` would not change the
    # scenario at all. This is the oracle that notices.
    - name: "DID NOT FIRE - role manages TLS, so the staged-material gate is suppressed"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/tls.yml
      vars:
        vault_manage_tls: true
        vault_tls_cert_file: /tmp/preflight-fixtures/absent.crt
        vault_tls_key_file: /tmp/preflight-fixtures/absent.key
        vault_tls_ca_file: /tmp/preflight-fixtures/absent.ca

    - name: Assert the TLS gate was suppressed, not merely non-failing
      ansible.builtin.assert:
        that:
          - __vault_tls_ok is defined
          - __vault_tls_ok.skipped | default(false)
        fail_msg: >-
          The staged-material gate ran while the role manages TLS. Three absent
          files were supplied, so "nothing failed" is also what a deleted
          when: condition looks like.

    ###########################################################################
    # The managed_tls gate - role-managed TLS inputs (issue #80)
    #
    # The exact mirror of the TLS gate above: that one fires when
    # vault_manage_tls is FALSE, this one when it is TRUE.
    #
    # Its fixtures live on the CONTROLLER, not in the container, because the
    # gate delegates its stat to localhost -- vault_tls_src_* are paths that
    # ansible.builtin.copy resolves controller-side. Every other case in this
    # scenario stages into the container; staging these there would make the
    # gate pass or fail for reasons unrelated to what it measures.
    ###########################################################################
    - name: Stage controller-side managed-TLS fixtures
      delegate_to: localhost
      become: false
      block:
        - name: Create the controller fixture directory
          ansible.builtin.file:
            path: /tmp/managed-tls-fixtures
            state: directory
            mode: '0755'

        - name: Create readable controller-side sources
          ansible.builtin.copy:
            content: "mock material"
            dest: "/tmp/managed-tls-fixtures/{{ item }}"
            mode: '0644'
          loop: [good.crt, good.key, good.ca]

        - name: Create a directory where a certificate is expected
          ansible.builtin.file:
            path: /tmp/managed-tls-fixtures/isdir.crt
            state: directory
            mode: '0755'

        # follow: true on the gate's stat is load-bearing for the same reason it
        # is on the sibling tls gate: certmonger/certbot material is normally a
        # symlink, and lstat would report isreg false and reject a working
        # controller-side source.
        - name: Symlink a controller-side source (the certmonger/certbot pattern)
          ansible.builtin.file:
            src: /tmp/managed-tls-fixtures/good.crt
            dest: /tmp/managed-tls-fixtures/link.crt
            state: link
            force: true

    - name: "FIRES - vault_tls_src_cert is unset"
      block:
        - name: Run managed_tls with an empty source variable
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/managed_tls.yml
          vars:
            vault_manage_tls: true
            vault_tls_source: file
            vault_tls_src_cert: ""
            vault_tls_src_key: /tmp/managed-tls-fixtures/good.key
            vault_tls_src_ca: /tmp/managed-tls-fixtures/good.ca
        - name: An empty source should not have passed
          ansible.builtin.fail:
            msg: "managed_tls did not fire for an empty vault_tls_src_cert"
      rescue:
        - name: Assert the message names the unset variable
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([])
                | map(attribute='msg', default='') | join(' ') is search('vault_tls_src_cert is empty')
            fail_msg: "wrong cause: {{ ansible_failed_result | default('') }}"

    - name: "FIRES - source is absent on the CONTROLLER"
      block:
        - name: Run managed_tls against a controller path that does not exist
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/managed_tls.yml
          vars:
            vault_manage_tls: true
            vault_tls_source: file
            vault_tls_src_cert: /tmp/managed-tls-fixtures/absent.crt
            vault_tls_src_key: /tmp/managed-tls-fixtures/good.key
            vault_tls_src_ca: /tmp/managed-tls-fixtures/good.ca
        - name: An absent controller source should not have passed
          ansible.builtin.fail:
            msg: "managed_tls did not fire for a source absent on the controller"
      rescue:
        - name: Assert the message points at the controller, not the target
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([])
                | map(attribute='msg', default='') | join(' ') is search('does not exist on the Ansible controller')
            fail_msg: "wrong cause: {{ ansible_failed_result | default('') }}"

    - name: "FIRES - source is a directory on the controller"
      block:
        - name: Run managed_tls against a controller directory
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/managed_tls.yml
          vars:
            vault_manage_tls: true
            vault_tls_source: file
            vault_tls_src_cert: /tmp/managed-tls-fixtures/isdir.crt
            vault_tls_src_key: /tmp/managed-tls-fixtures/good.key
            vault_tls_src_ca: /tmp/managed-tls-fixtures/good.ca
        - name: A directory should not have passed
          ansible.builtin.fail:
            msg: "managed_tls did not fire for a directory in place of a certificate"
      rescue:
        - name: Assert the message names the file-type cause
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([])
                | map(attribute='msg', default='') | join(' ') is search('not a regular file')
            fail_msg: "wrong cause: {{ ansible_failed_result | default('') }}"

    - name: "FIRES - vault_pki selected with no mount configured"
      block:
        - name: Run managed_tls with vault_pki and an empty mount
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/managed_tls.yml
          vars:
            vault_manage_tls: true
            vault_tls_source: vault_pki
            vault_pki_mount: ""
            vault_pki_role: vault-listener
        - name: An empty PKI mount should not have passed
          ansible.builtin.fail:
            msg: "managed_tls did not fire for an empty vault_pki_mount"
      rescue:
        - name: Assert the message names the PKI variable
          ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([])
                | map(attribute='msg', default='') | join(' ') is search('vault_pki_mount is empty')
            fail_msg: "wrong cause: {{ ansible_failed_result | default('') }}"

    - name: "PASSES - a symlinked controller-side source is accepted"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/managed_tls.yml
      vars:
        vault_manage_tls: true
        vault_tls_source: file
        vault_tls_src_cert: /tmp/managed-tls-fixtures/link.crt
        vault_tls_src_key: /tmp/managed-tls-fixtures/good.key
        vault_tls_src_ca: /tmp/managed-tls-fixtures/good.ca

    - name: "PASSES - a relative source is reported, not rejected"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/managed_tls.yml
      vars:
        vault_manage_tls: true
        vault_tls_source: file
        # The shape the README's own example playbooks ship. copy resolves it
        # through Ansible's search path; the gate cannot verify it and must not
        # fail it (an earlier draft did, which would have broken every operator
        # who copied those examples).
        vault_tls_src_cert: files/vault-tls.crt
        vault_tls_src_key: /tmp/managed-tls-fixtures/good.key
        vault_tls_src_ca: /tmp/managed-tls-fixtures/good.ca

    - name: Assert the relative source was skipped by the stat, not failed
      ansible.builtin.assert:
        that:
          - __vault_managed_tls_stat.results | default([])
            | selectattr('skipped', 'defined') | list | length == 1
        fail_msg: >-
          The relative source was not skipped by the controller-side stat:
          {{ __vault_managed_tls_stat | default('undefined') }}

    - name: "PASSES - all three controller-side sources are present and readable"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/managed_tls.yml
      vars:
        vault_manage_tls: true
        vault_tls_source: file
        vault_tls_src_cert: /tmp/managed-tls-fixtures/good.crt
        vault_tls_src_key: /tmp/managed-tls-fixtures/good.key
        vault_tls_src_ca: /tmp/managed-tls-fixtures/good.ca

    - name: Assert that pass-case actually evaluated all three sources
      ansible.builtin.assert:
        that:
          - __vault_managed_tls_readable is defined
          - __vault_managed_tls_readable.results | default([]) | length == 3
          # rejectattr on TRUTHINESS, never on 'defined'. Note this register is
          # the ASSERT's, not the stat's -- a looped assert result always carries
          # a `failed` key, so 'defined' would reject every element here too. The
          # #36 lesson is the same either way: discriminate on the value, never
          # on the key's presence.
          - __vault_managed_tls_readable.results | default([])
            | rejectattr('failed') | list | length == 3
        fail_msg: >-
          The pass case did not evaluate all three controller-side sources:
          {{ __vault_managed_tls_readable | default('undefined') }}

    # Every other managed_tls case sets vault_manage_tls: true, so deleting the
    # production `when: vault_manage_tls | bool` would not change the scenario
    # at all. This is the oracle that notices -- and it is the mirror image of
    # the staged-material suppression case above.
    - name: "DID NOT FIRE - operator stages TLS, so the managed-input gate is suppressed"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/managed_tls.yml
      vars:
        vault_manage_tls: false
        vault_tls_source: file
        vault_tls_src_cert: ""
        vault_tls_src_key: ""
        vault_tls_src_ca: ""

    - name: Assert the managed-input gate was suppressed, not merely non-failing
      ansible.builtin.assert:
        that:
          - __vault_managed_tls_marker is defined
          - __vault_managed_tls_marker.skipped | default(false)
        fail_msg: >-
          The managed-input gate ran while the operator stages TLS. All three
          source variables were empty, so "nothing failed" is also what a
          deleted when: condition looks like.

    ###########################################################################
    # The dns gate - the FQDN resolves to a reachable address (issue #79)
    #
    # The fqdn FACT is overridable per-include -- ansible_facts rebuilt from
    # __real_facts (vars precedence 21 beats host facts 15, see pre_tasks) --
    # and prepare.yml owns /etc/hosts, so both of this gate's inputs are under
    # the scenario's control. It does NOT have to settle for whatever the
    # container's own name resolves to.
    #
    # vault_api_addr is set per case ON PURPOSE: it is the polarity input, and
    # a case that left it at the default would prove only one half.
    ###########################################################################
    - name: "FIRES - FQDN resolves only to loopback and the addresses derive from it"
      block:
        - name: Run dns against a loopback-only name
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/dns.yml
          vars:
            ansible_facts: "{{ __real_facts | combine({'fqdn': 'dns-loopback-fixture.test'}) }}"
            vault_api_addr: "https://dns-loopback-fixture.test:8200"
            vault_cluster_addr: "https://dns-loopback-fixture.test:8201"
        - name: A loopback-only name should not have passed
          # Deliberately does NOT name the address: the rescue asserts on it, and
          # a scaffold message containing it would satisfy that search even when
          # the gate never fired (caught by assert-verify-rescues-discriminate).
          ansible.builtin.fail:
            msg: "dns did not fire for a loopback-only name"
      rescue:
        - name: Assert the message names the reachability cause
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('resolves to no reachable address')
              - ansible_failed_result.msg | default('') is search('127.0.1.1')
            fail_msg: "wrong cause: {{ ansible_failed_result | default('') }}"

    - name: "FIRES - FQDN resolves only to a link-local address"
      block:
        - name: Run dns against a link-local-only name
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/dns.yml
          vars:
            ansible_facts: "{{ __real_facts | combine({'fqdn': 'dns-linklocal-fixture.test'}) }}"
            vault_api_addr: "https://dns-linklocal-fixture.test:8200"
            vault_cluster_addr: "https://dns-linklocal-fixture.test:8201"
        - name: A link-local-only name should not have passed
          ansible.builtin.fail:
            msg: "dns did not fire for a link-local-only name"
      rescue:
        - name: Assert link-local was not counted as reachable
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('resolves to no reachable address')
              # Names the fixture: without this the case also passes when the
              # 169.254 fixture never landed and the name simply did not resolve.
              - ansible_failed_result.msg | default('') is search('169.254.7.7')
            fail_msg: "wrong cause: {{ ansible_failed_result | default('') }}"

    - name: "PASSES - FQDN resolves to a routable address"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/dns.yml
      vars:
        ansible_facts: "{{ __real_facts | combine({'fqdn': 'dns-routable-fixture.test'}) }}"
        vault_api_addr: "https://dns-routable-fixture.test:8200"
        vault_cluster_addr: "https://dns-routable-fixture.test:8201"

    - name: Assert the pass case saw the routable address and nothing else
      ansible.builtin.assert:
        that:
          - __vault_dns_routable == ['10.99.0.1']
        fail_msg: >-
          The routable set is {{ __vault_dns_routable | default('undefined') }},
          expected exactly ['10.99.0.1'].

    # The polarity oracle. Every FIRES case above sets vault_api_addr to a URL
    # containing the fqdn, so deleting the production `when: __vault_dns_required`
    # would not change the scenario at all. This is the case that notices -- the
    # same loopback-only name, with the advertised addresses pinned to literals.
    - name: "DID NOT FIRE - loopback-only FQDN but the advertised addresses are pinned"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/dns.yml
      vars:
        ansible_facts: "{{ __real_facts | combine({'fqdn': 'dns-loopback-fixture.test'}) }}"
        vault_api_addr: "https://10.99.0.1:8200"
        vault_cluster_addr: "https://10.99.0.1:8201"

    - name: Assert the dns gate was suppressed, not merely non-failing
      ansible.builtin.assert:
        that:
          - not (__vault_dns_required | bool)
          - __vault_dns_routable | length == 0
        fail_msg: >-
          The dns gate did not treat pinned addresses as removing the dependency:
          required={{ __vault_dns_required | default('undefined') }},
          routable={{ __vault_dns_routable | default('undefined') }}. The same
          name failed two cases above, so "nothing failed" is also what a deleted
          when: condition looks like.

    - name: "DID NOT FIRE - firewalld absent but management disabled"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/firewalld.yml
      vars:
        vault_manage_firewall: false

    - name: Assert the firewalld gate was suppressed by its toggle
      ansible.builtin.assert:
        that:
          - __vault_firewalld_ok is defined
          - __vault_firewalld_ok.skipped | default(false)
        fail_msg: >-
          The firewalld gate ran with vault_manage_firewall false, which is
          issue #36 defect 3: the feature toggle must reach preflight.

    - name: "FIRES - firewalld absent while management is enabled"
      block:
        - name: Run firewalld gate with management on
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/firewalld.yml
          vars:
            vault_manage_firewall: true
        - name: Absent firewalld should not have passed
          ansible.builtin.fail:
            msg: "firewalld gate did not fire on a host without firewalld"
      rescue:
        - name: Assert the message says not installed, not "start it"
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('is not installed')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"

    ###########################################################################
    # The chrony gate - chrony absent (measured: chronyc ships on none of ubi8/9/10)
    ###########################################################################
    - name: "FIRES - chronyc absent fails the ASSERT, not the task"
      block:
        - name: Run chrony gate without chronyc installed
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/chrony.yml
        - name: Absent chronyc should not have passed
          ansible.builtin.fail:
            msg: "chrony gate did not fire on a host without chronyc"
      rescue:
        - name: Assert remediation text was reached, not a crash
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('chronyc is not installed')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"


    ###########################################################################
    # Suppressor oracles. One per (suppressor, gate) pair: without these,
    # any single conjunct of a gate's when: can be deleted with the suite green
    # -- and deleting the RHSM gate's is_rhel conjunct puts subscription-manager back on
    # Rocky, which is the #36 defect this PR closes.
    ###########################################################################
    - name: "DID NOT FIRE - the RHSM gate suppressed by vault_manage_repo"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/rhsm.yml
      vars:
        vault_manage_repo: false
        vault_repo_source: satellite

    - name: Assert the RHSM gate marker skipped under the master switch
      ansible.builtin.assert:
        that:
          - __vault_rhsm_marker is defined
          - __vault_rhsm_marker.skipped | default(false)
        fail_msg: "the RHSM gate ran with vault_manage_repo false"

    - name: "DID NOT FIRE - the RHSM gate suppressed on a non-RHEL host"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/rhsm.yml
      vars:
        vault_manage_repo: true
        vault_repo_source: satellite
        ansible_facts: "{{ __real_facts | combine({'distribution': 'Rocky'}) }}"

    - name: Assert the RHSM gate marker skipped on an EL rebuild
      ansible.builtin.assert:
        that:
          - __vault_rhsm_marker is defined
          - __vault_rhsm_marker.skipped | default(false)
        fail_msg: >-
          the RHSM gate ran on Rocky. subscription-manager does not exist there; this
          is the #36 defect that rejected every compatible EL distribution.

    - name: "DID NOT FIRE - the RHSM gate suppressed under the mirror source"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/rhsm.yml
      vars:
        vault_manage_repo: true
        vault_repo_source: mirror

    - name: "FIRES - a foreign process holds the Vault API port"
      block:
        - name: Run the port gate against a foreign listener
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/port.yml
        - name: A foreign holder should not have passed
          ansible.builtin.fail:
            msg: "port gate did not fire against a foreign listener"
      rescue:
        - name: Assert the message names foreign ownership
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('not the ' ~ vault_service_name ~ ' service')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"

    - name: "PASSES - the port is held by the Vault service itself"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/port.yml
      vars:
        vault_listener_port: 18200

    - name: Assert the ownership check actually ran and passed
      ansible.builtin.assert:
        that:
          - __vault_port_owner is defined
          - not (__vault_port_owner.skipped | default(false))
          # Same reason as the custom-slice oracle below: the register survives
          # include_role, and the foreign-listener case leaves it defined,
          # unskipped and FAILED. Without this the oracle is satisfied by that
          # stale result if this case's include is ever removed.
          - not (__vault_port_owner.failed | default(false))
        fail_msg: >-
          The port pass-case skipped the ownership block or inherited a failed
          result, so the cgroup logic was not evaluated successfully here.
          "Nothing failed" is not proof for a pass case.

    - name: "FIRES - the socket query tool is unusable"
      block:
        - name: Shim a failing ss ahead of the real one
          ansible.builtin.copy:
            content: |
              #!/bin/sh
              echo "shimmed failure" >&2
              exit 1
            dest: /usr/local/bin/ss
            mode: '0755'

        - name: Run the port gate with a failing query tool
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/port.yml
          vars:
            vault_listener_port: 19999

        - name: A failing query should not have passed
          ansible.builtin.fail:
            msg: >-
              port gate passed while ss failed. A failed query with empty output
              is indistinguishable from a free port, so this must fail closed.
      rescue:
        - name: Assert the message names the query failure
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('Querying listeners')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"
      always:
        - name: Remove the ss shim
          ansible.builtin.file:
            path: /usr/local/bin/ss
            state: absent


    - name: "PASSES - a genuinely free port skips the ownership block"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/port.yml
      vars:
        vault_listener_port: 19998

    - name: Assert a free port does NOT reach the attribution assert
      ansible.builtin.assert:
        that:
          - __vault_port_attrib is defined
          - __vault_port_attrib.skipped | default(false)
        fail_msg: >-
          A free port reached the attribution assert with an empty PID list,
          which hard-fails. Changing the ownership block's when: to something
          always-true would block every fresh Vault install while CI stayed
          green -- this case exists to catch exactly that.

    - name: "FIRES - a listener with no attributable PID fails closed"
      block:
        - name: Shim ss to report a listener with no owning PID
          ansible.builtin.copy:
            content: |
              #!/bin/sh
              echo "LISTEN 0 4096 0.0.0.0:19995 0.0.0.0:*"
            dest: /usr/local/bin/ss
            mode: '0755'

        - name: Run the port gate against an unattributable listener
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/port.yml
          vars:
            vault_listener_port: 19995

        - name: An unattributable listener should not have passed
          ansible.builtin.fail:
            msg: >-
              port gate passed on a listener with no owning PID. The CHANGELOG
              claims this fails closed; assuming such a holder is Vault would
              reintroduce the defect being repaired.
      rescue:
        - name: Assert the message names the attribution failure
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('ss omits that field')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"
      always:
        - name: Remove the unattributable-listener shim
          ansible.builtin.file:
            path: /usr/local/bin/ss
            state: absent

    # This fixture is a unit legitimately placed in app.slice. Under the old
    # '/system.slice/<name>.service' anchor it was REJECTED, which was the
    # inverse of the real bug: slice placement is a default, not an identity.
    # systemd reports /app.slice/fakevault.service as that unit's control group,
    # so when it IS the configured unit the gate must accept it.
    - name: "PASSES - the Vault unit in a non-default slice is still the Vault unit"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/port.yml
      vars:
        vault_listener_port: 19996
        vault_service_name: fakevault

    # Registers survive include_role, so "defined and not skipped" is satisfied
    # by the PREVIOUS case's register -- the foreign-listener case fails inside
    # this very assert, leaving it defined, unskipped and failed. Requiring
    # failed to be false binds this to a successful result from THIS case, so
    # deleting the include above turns the oracle red instead of green.
    - name: Assert the ownership comparison ran and PASSED for the custom slice
      ansible.builtin.assert:
        that:
          - __vault_port_owner is defined
          - not (__vault_port_owner.skipped | default(false))
          - not (__vault_port_owner.failed | default(false))
        fail_msg: >-
          The custom-slice case passed without the ownership task running, so it
          proves nothing: a skipped comparison looks exactly like an accepted
          one from the outside.

    # The boundary that replaces the anchor: a holder whose cgroup merely
    # EXTENDS the configured unit's must not satisfy it -- the same containment
    # error that let a nested user-manager cgroup pass as the system unit.
    - name: "FIRES - a holder whose cgroup extends the Vault unit's does not satisfy it"
      block:
        - name: Run the port gate against the extension holder
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/port.yml
          vars:
            vault_listener_port: 19993
            vault_service_name: vault-share
        - name: A cgroup that merely CONTAINS the unit's should not have passed
          ansible.builtin.fail:
            msg: >-
              The configured unit's control group is
              /system.slice/vault-share.service; the holder's is
              /system.slice/vault-share.service-rogue.service, which contains it
              as a strict prefix. Accepting that is the same containment error
              that let a nested user-manager cgroup pass as the system unit.
              This port has one listener, so nothing else can fail the case.
      rescue:
        - name: Assert the message names the configured unit, not the holder
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('not the vault-share service')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"


    - name: "FIRES - one Vault listener plus one foreign listener on the same port"
      block:
        - name: Run the port gate where only SOME listeners are Vault
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/port.yml
          vars:
            vault_listener_port: 19995
            vault_service_name: vault-shared
        - name: A partially-foreign port should not have passed
          ansible.builtin.fail:
            msg: >-
              The gate accepted a port where one listener is Vault and another
              is not. Relaxing the cardinality comparison from "all listeners"
              to "any listener" is a fail-open, and this case is what
              discriminates it.
      rescue:
        - name: Assert the message names foreign ownership
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('not the vault-shared service')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"

    # The mirror-URL cause had no fires oracle of its own, so its predicate was
    # tautologizable; only the GPG-key cause was proven.
    - name: "FIRES - mirror mode with the URL still pointing upstream"
      block:
        - name: Run repo_source with an upstream URL and an internal key
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/repo_source.yml
          vars:
            vault_manage_repo: true
            vault_repo_source: mirror
            vault_repo_gpg_key: https://repo.closednetwork.local/hashicorp/gpg
        # The scaffold must not contain the discriminator. Naming the variable
        # here made the rescue match its own scaffold, so deleting the URL
        # predicate left this case green -- a false-positive oracle guarding the
        # control it was written for.
        - name: An upstream mirror base URL should not have passed
          ansible.builtin.fail:
            msg: "the repo-source gate did not fire for an upstream base address"
      rescue:
        - name: Assert the message names the URL, not the key
          ansible.builtin.assert:
            that:
              # Keyed to the VARIABLE, not to prose: asserting on wording makes
              # every reword a false failure. The scaffold above deliberately
              # names neither variable.
              - ansible_failed_result.msg is search('vault_repo_url')
              - ansible_failed_result.msg is not search('vault_repo_gpg_key')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"

    - name: "FIRES - an unattributed row alongside a Vault-owned listener"
      block:
        - name: Shim ss to emit one Vault row and one unattributable row
          ansible.builtin.copy:
            content: |
              #!/bin/sh
              MP=$(systemctl show -p MainPID --value vault.service 2>/dev/null)
              echo "LISTEN 0 4096 0.0.0.0:19994 0.0.0.0:* users:((\"ncat\",pid=${MP},fd=8))"
              echo "LISTEN 0 4096 [::]:19994 [::]:*"
            dest: /usr/local/bin/ss
            mode: '0755'

        - name: Run the port gate against a mixed attributed/unattributed pair
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/port.yml
          vars:
            vault_listener_port: 19994

        - name: A partially unattributed port should not have passed
          ansible.builtin.fail:
            msg: >-
              The gate passed with one socket attributable to Vault and one
              carrying no owning PID. Counting PIDs globally reduces "every
              listener is attributable" to "at least one PID exists", so an
              SO_REUSEPORT pair of one Vault socket and one foreign socket
              slips through.
      rescue:
        - name: Assert the message names the attribution shortfall
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('carry an owning PID')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"
      always:
        - name: Remove the mixed-attribution shim
          ansible.builtin.file:
            path: /usr/local/bin/ss
            state: absent

    ###########################################################################
    # Mirror-source normalisation
    ###########################################################################

    - name: "FIRES - mirror URL uses the absolute (root-dot) public hostname"
      block:
        - name: Run repo_source with a trailing-dot upstream host
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/repo_source.yml
          vars:
            vault_manage_repo: true
            vault_repo_source: mirror
            vault_repo_url: https://rpm.releases.hashicorp.com./RHEL/9/x86_64/stable
            vault_repo_gpg_key: https://repo.closednetwork.local/hashicorp/gpg
        - name: A root-dot FQDN should not have passed
          ansible.builtin.fail:
            msg: >-
              DNS treats 'rpm.releases.hashicorp.com.' as the same public endpoint
              as the bare name, so comparing the hostname literally lets a
              declared internal mirror fetch from HashiCorp.
      rescue:
        - name: Assert the message names the URL, not the key
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('vault_repo_url')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"

    - name: "PASSES - a synchronised chronyd satisfies the gate"
      block:
        # The absent-tool case was the ONLY chrony coverage, and it fires for a
        # different reason -- so nothing here ever exercised a HEALTHY host, and
        # no test could have told a working sync predicate from a broken one.
        # (An earlier version of this comment said the predicate "could never
        # match". That was false: measured, the pre-fix plain-scalar expression
        # matches correctly. The gap was coverage, not the regex.)
        - name: Shim chronyc to emit a synchronised tracking report
          ansible.builtin.copy:
            content: |
              #!/bin/sh
              cat <<'OUT'
              Reference ID    : C0248F98 (time.example.net)
              Stratum         : 3
              Ref time (UTC)  : Fri Aug 22 11:00:00 2026
              System time     : 0.000012345 seconds slow of NTP time
              Leap status     : Normal
              OUT
            dest: /usr/local/bin/chronyc
            mode: '0755'

        - name: Run the chrony gate against a synchronised daemon
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/chrony.yml
      always:
        - name: Remove the chronyc shim
          ansible.builtin.file:
            path: /usr/local/bin/chronyc
            state: absent

    - name: "FIRES - chronyd running but not synchronised"
      block:
        - name: Shim chronyc to report an unsynchronised daemon
          ansible.builtin.copy:
            content: |
              #!/bin/sh
              cat <<'OUT'
              Reference ID    : 00000000 ()
              Stratum         : 0
              Leap status     : Not synchronised
              OUT
            dest: /usr/local/bin/chronyc
            mode: '0755'

        - name: Run the chrony gate against an unsynchronised daemon
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/chrony.yml

        - name: An unsynchronised clock should not have passed
          ansible.builtin.fail:
            msg: >-
              Vault leases, token TTLs and audit timestamps all depend on the
              clock; a daemon that is running but has never synchronised is the
              case this gate exists for.
      rescue:
        - name: Assert the message names the synchronisation state
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('not synchronised')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"
      always:
        - name: Remove the unsynchronised shim
          ansible.builtin.file:
            path: /usr/local/bin/chronyc
            state: absent

    ###########################################################################
    # The chrony gate / The firewalld gate - non-primary cause arms, via PATH shims
    ###########################################################################
    - name: "FIRES - chronyd unreachable is distinguished from unsynchronised"
      block:
        - name: Shim chronyc to report an unreachable daemon
          ansible.builtin.copy:
            content: |
              #!/bin/sh
              echo "506 Cannot talk to daemon"
              exit 1
            dest: /usr/local/bin/chronyc
            mode: '0755'

        - name: Run the chrony gate against an unreachable daemon
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/chrony.yml

        - name: An unreachable daemon should not have passed
          ansible.builtin.fail:
            msg: "chrony gate did not fire for an unreachable daemon"
      rescue:
        - name: Assert the daemon-unreachable remediation, not the sync one
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('cannot reach chronyd')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"

    - name: "FIRES - a running but unsynchronised clock names the sync cause"
      block:
        - name: Shim chronyc to report an unsynchronised clock
          ansible.builtin.copy:
            content: |
              #!/bin/sh
              echo "Leap status     : Not synchronised"
            dest: /usr/local/bin/chronyc
            mode: '0755'

        - name: Run the chrony gate against an unsynchronised clock
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/chrony.yml

        - name: An unsynchronised clock should not have passed
          ansible.builtin.fail:
            msg: "chrony gate did not fire for an unsynchronised clock"
      rescue:
        - name: Assert the not-synchronised remediation
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('not synchronised')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"
      always:
        - name: Remove the chronyc shim
          ansible.builtin.file:
            path: /usr/local/bin/chronyc
            state: absent

    ###########################################################################
    # tasks/repo.yml - executed by NO scenario before this case. The satellite
    # branch and its leftover-removal are fail-open controls otherwise.
    ###########################################################################
    # A LOCAL key, deliberately: this case only needs the repo file created and
    # then removed, and repo.yml also imports vault_repo_gpg_key under the
    # hashicorp source. Left at its default that reaches out to
    # rpm.releases.hashicorp.com, making a file-lifecycle test depend on public
    # network access it has no reason to need.
    # SKIPPED ON EL10, and the gap is deliberate rather than hidden: this case
    # drives the real tasks/repo.yml, which imports the GPG key via rpm_key --
    # and rpm_key is BROKEN on EL10 (#71). ubi10's RPM keyring ships a v6 key
    # its own gpg cannot parse, rpm_key enumerates the keyring, and it fails
    # regardless of which key is requested. Measured: fails on ubi10, succeeds
    # on ubi9, same valid key.
    #
    # Skipping keeps CI honest about a defect that is out of #36's scope while
    # #71 tracks the fix. It does NOT paper over it: EL8 and EL9 still execute
    # this case, so the repo lifecycle stays covered.
    - name: Write a repo file as the hashicorp source would
      when: ansible_facts['distribution_major_version'] is version('10', '<')
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: repo.yml
      vars:
        vault_repo_source: hashicorp
        # redhat-beta, not redhat-release: on EL10 the release key is a v6
        # OpenPGP packet that the image's gpg refuses ("packet(6) with unknown
        # version 6"), so rpm_key fails. Measured on ubi8/9/10 -- beta parses on
        # all three. A local key at all, rather than the default, keeps this
        # file-lifecycle case off the public network.
        vault_repo_gpg_key: /etc/pki/rpm-gpg/RPM-GPG-KEY-redhat-beta

    - name: Confirm the hashicorp source wrote the repo file
      ansible.builtin.stat:
        path: /etc/yum.repos.d/hashicorp.repo
      register: __repo_after_hashicorp
      when: ansible_facts['distribution_major_version'] is version('10', '<')

    - name: Re-run under the satellite source
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: repo.yml
      vars:
        vault_repo_source: satellite
      when: ansible_facts['distribution_major_version'] is version('10', '<')

    - name: Stat the repo file after the satellite run
      ansible.builtin.stat:
        path: /etc/yum.repos.d/hashicorp.repo
      register: __repo_after_satellite
      when: ansible_facts['distribution_major_version'] is version('10', '<')

    # Both halves, or the case proves nothing: without "present before",
    # deleting the template task passes; without "absent after", deleting the
    # cleanup passes. The split removed these assertions along with an adjacent
    # Satellite block and left the two stat tasks recording nothing.
    - name: "Assert the role wrote the file, then removed it for satellite"
      when: ansible_facts['distribution_major_version'] is version('10', '<')
      ansible.builtin.assert:
        that:
          - __repo_after_hashicorp.stat.exists
          - not __repo_after_satellite.stat.exists
        fail_msg: >-
          hashicorp source wrote the repo file:
          {{ __repo_after_hashicorp.stat.exists }} (want true);
          satellite source left it in place:
          {{ __repo_after_satellite.stat.exists }} (want false).
          A leftover .repo means dnf can still resolve Vault from the public
          internet while subscription-manager owns repo configuration.
        success_msg: "repo.yml: written under hashicorp, removed under satellite"

    - name: "FIRES - Satellite source on an unregistered host"
      block:
        - name: Run the RHSM gate for Satellite-sourced content
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/rhsm.yml
          vars:
            vault_manage_repo: true
            vault_repo_source: satellite
        - name: An unregistered host should not have passed
          ansible.builtin.fail:
            msg: "rhsm gate did not fire on an unregistered host"
      rescue:
        - name: Assert the message names the registration state, not something else
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('This host is not registered')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"

    - name: "DID NOT FIRE - unregistered host, but source is not satellite"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/rhsm.yml
      vars:
        vault_manage_repo: true
        vault_repo_source: hashicorp

    - name: Assert the RHSM gate was suppressed by the sourcing mode
      ansible.builtin.assert:
        that:
          - __vault_rhsm_registered is defined
          - __vault_rhsm_registered.skipped | default(false)
        fail_msg: >-
          RHSM gate ran for a non-satellite source. This is the #36 defect:
          registration is a prerequisite of the sourcing mode, not of the role.
    - name: "PASSES - all three staged and regular files"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/tls.yml
      vars:
        vault_manage_tls: false
        vault_tls_cert_file: /tmp/preflight-fixtures/good.crt
        vault_tls_key_file: /tmp/preflight-fixtures/good.key
        vault_tls_ca_file: /tmp/preflight-fixtures/good.ca

    - name: Assert the TLS pass-case actually evaluated all three files
      ansible.builtin.assert:
        that:
          - __vault_tls_ok is defined
          - __vault_tls_ok.results | default([]) | length == 3
        fail_msg: "TLS pass-case did not evaluate three files"

    - name: "FIRES UNDER --check - a foreign listener is not waved through in a dry run"
      block:
        - name: Stage a foreign listener on the Vault port
          ansible.builtin.command:
            argv: [systemd-run, --unit, checkmode-squatter, --collect,
                   ncat, -l, "19997"]
          changed_when: true

        # check_mode is a block keyword, not an include_role one, and only the
        # GATE belongs in the dry run -- the fixture above has to really run.
        - name: Drive the port gate as a dry run
          check_mode: true
          block:
            - name: Run the port gate in check mode
              ansible.builtin.include_role:
                name: ansible-role-vault
                tasks_from: preflight/port.yml
              vars:
                vault_listener_port: 19997

            - name: A dry run must not green a host it would have rejected
              ansible.builtin.fail:
                msg: >-
                  command and shell are skipped under --check, and a skipped
                  probe registers rc 0 with empty output. The ownership block
                  would never run and the gate would report a free port.
      rescue:
        - name: Assert the dry run failed on ownership, not on something else
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('not the ' ~ vault_service_name ~ ' service')
                or ansible_failed_result.msg is search('carry an owning PID')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"
      always:
        - name: Stop the check-mode squatter
          ansible.builtin.command:
            argv: [systemctl, stop, checkmode-squatter.service]
          failed_when: false
          changed_when: true

    ###########################################################################
    # The edition gate - the PKCS#11 seal requires an HSM-capable build
    ###########################################################################
    - name: "FIRES - HSM enabled on the Community edition"
      block:
        - name: Run edition with HSM enabled on a Community build
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/edition.yml
          vars:
            vault_edition: vault
            vault_hsm_enabled: true
        - name: Community plus HSM should not have passed
          ansible.builtin.fail:
            msg: "edition gate did not fire for HSM on a Community build"
      rescue:
        - name: Assert the message names the cause and the remedy
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('not an HSM-capable build')
              - ansible_failed_result.msg is search('vault-enterprise-hsm-fips1403')
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"

    - name: "FIRES - HSM enabled on the non-HSM Enterprise edition"
      # Block vars reach the rescue; an include_role param does NOT -- it is
      # scoped to that task. The rescue below concatenates vault_edition into
      # its pattern, so without this the rescue itself dies on
      # "'vault_edition' is undefined" and, being IN the rescue, nothing catches
      # it: the play aborts and the remaining edition cases never run.
      vars:
        vault_edition: vault-enterprise-fips1403
      block:
        - name: Run edition with HSM enabled on Enterprise FIPS without HSM
          ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/edition.yml
          vars:
            vault_hsm_enabled: true
        - name: Enterprise-without-HSM plus HSM should not have passed
          # The scaffold msg MUST NOT contain the edition string: the rescue
          # asserts on it, and tests/assert-verify-rescues-discriminate.sh fails
          # any rescue whose pattern also matches its own scaffold.
          ansible.builtin.fail:
            msg: "edition gate did not fire for the non-HSM Enterprise build"
      rescue:
        - name: Assert Enterprise alone is not treated as HSM-capable
          ansible.builtin.assert:
            that:
              - ansible_failed_result.msg is search('not an HSM-capable build')
              # Concatenated, NOT a bare literal: preflight/edition.yml emits the
              # edition only via {{ vault_edition }}, so this literal appears
              # nowhere in the gate's source and
              # assert-rescue-patterns-are-emittable.sh:142 rejects it. That
              # guard skips patterns containing ` ~ `.
              - ansible_failed_result.msg is search("is '" ~ vault_edition ~ "'")
            fail_msg: "wrong cause: {{ ansible_failed_result.msg | default('') }}"

    - name: "EXECUTES - the gate runs and passes on an HSM-capable edition"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/edition.yml
      vars:
        vault_edition: vault-enterprise-hsm-fips1403
        vault_hsm_enabled: true

    - name: Assert the edition marker executed rather than skipping
      ansible.builtin.assert:
        that:
          - __vault_edition_marker is defined
          - not (__vault_edition_marker.skipped | default(false))
          # REQUIRED, and the reason this case is not vacuous. The marker is a
          # registered HOST var and the FIRES cases above already set it --
          # register captures even on a failed assert. Without the failed check,
          # deleting this include_role leaves the assert reading the leftover
          # marker and passing.
          - not (__vault_edition_marker.failed | default(false))
        fail_msg: >-
          the edition gate did not execute on an HSM-capable edition; a gate
          that never runs is indistinguishable from a deleted one.

    - name: "DID NOT FIRE - HSM disabled suppresses the edition gate entirely"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/edition.yml
      vars:
        vault_edition: vault
        vault_hsm_enabled: false

    - name: Assert the edition marker was skipped, not merely non-failing
      ansible.builtin.assert:
        that:
          - __vault_edition_marker is defined
          - __vault_edition_marker.skipped | default(false)
        fail_msg: >-
          edition ran with vault_hsm_enabled false. A suppressed gate must
          register skipped; "nothing failed" is also what a deleted gate looks
          like.

    ###########################################################################
    # Enterprise NEVRA resolution - the +ent suffix
    ###########################################################################
    # TWO MECHANISMS, both required, and they are not the same one.
    #
    # 1. `public: true` on ONE include brings the role's defaults/main.yml and
    #    vars/main.yml into play scope. molecule/preflight/molecule.yml:67-69
    #    states verify.yml is a plain playbook that loads neither, so without
    #    this every assertion dies on an undefined variable -- which looks
    #    identical to the test failing for its real reason.
    #
    # 2. The FIXTURE goes in the `vars:` of the ASSERTING task, not on the
    #    include. An include_role's `vars:` are role PARAMS, scoped to that task
    #    and the tasks it includes; they are gone by the next task. Because
    #    __vault_package_version_resolved is lazily templated, it re-resolves
    #    against defaults at the assert and silently reports the default answer.
    #
    # Measured on ansible-core 2.19.6:
    #    inside the role            -> 2.1.1+ent   (param applies)
    #    after the include, no vars -> 2.1.1       (param gone: WRONG, and green
    #                                               for the Community case, so it
    #                                               would pass vacuously)
    #    fixture on the assert task -> 2.1.1+ent   (correct)
    - name: Bring role defaults and vars into play scope (scope only, no fixture)
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/edition.yml
        public: true
      vars:
        vault_hsm_enabled: false

    - name: "RESOLVES - Community leaves the pin untouched"
      ansible.builtin.assert:
        that:
          - __vault_package_version_resolved == '2.1.1'
        fail_msg: "Community pin was rewritten to {{ __vault_package_version_resolved }}"
      vars:
        vault_edition: vault
        vault_package_version: "2.1.1"

    - name: "RESOLVES - Enterprise gains the +ent suffix"
      ansible.builtin.assert:
        that:
          - __vault_package_version_resolved == '2.1.1+ent'
        fail_msg: "Enterprise pin resolved to {{ __vault_package_version_resolved }}"
      vars:
        vault_edition: vault-enterprise-fips1403
        vault_package_version: "2.1.1"

    - name: "RESOLVES - a release-suffixed pin keeps +ent in the VERSION field"
      # dnf reads 1.18.3-1+ent as version 1.18.3 release 1+ent, which matches
      # nothing -- the exact NEVRA defect #62 exists to remove. The suffix must
      # land before the release: 1.18.3+ent-1.
      ansible.builtin.assert:
        that:
          - __vault_package_version_resolved == '1.18.3+ent-1'
        fail_msg: "release-suffixed pin resolved to {{ __vault_package_version_resolved }}"
      vars:
        vault_edition: vault-enterprise-fips1403
        vault_package_version: "1.18.3-1"

    - name: "RESOLVES - a dist-tagged release survives the split"
      # Measured: the narrower '-[0-9]+$' does NOT match 1.18.3-1.el9, so that
      # pin resolved to 1.18.3-1.el9+ent -- release '1.el9+ent', no match.
      ansible.builtin.assert:
        that:
          - __vault_package_version_resolved == '1.18.3+ent-1.el9'
        fail_msg: "dist-tagged pin resolved to {{ __vault_package_version_resolved }}"
      vars:
        vault_edition: vault-enterprise-fips1403
        vault_package_version: "1.18.3-1.el9"

    - name: "RESOLVES - an explicit +ent is not doubled"
      ansible.builtin.assert:
        that:
          - __vault_package_version_resolved == '2.1.1+ent'
        fail_msg: "idempotence broken: {{ __vault_package_version_resolved }}"
      vars:
        vault_edition: vault-enterprise-hsm-fips1403
        vault_package_version: "2.1.1+ent"

    - name: "RESOLVES - latest is never suffixed"
      ansible.builtin.assert:
        that:
          - __vault_package_version_resolved == 'latest'
        fail_msg: "latest was rewritten to {{ __vault_package_version_resolved }}"
      vars:
        vault_edition: vault-enterprise-fips1403
        vault_package_version: "latest"

    - name: "REPORTS - the suffix report fires for an Enterprise pin"
      # MIRRORS tasks/install.yml's when: rather than driving it -- the install
      # task cannot run here without a package transaction. Deleting the report
      # from install.yml leaves this green; the binding is held instead by
      # tests/assert-install-uses-resolved-version.sh.
      ansible.builtin.debug:
        msg: "resolved={{ __vault_package_version_resolved }}"
      register: __ent_report
      when:
        - vault_package_version != 'latest'
        - __vault_package_version_resolved != vault_package_version
      vars:
        vault_edition: vault-enterprise-fips1403
        vault_package_version: "2.1.1"

    - name: Assert the Enterprise report was not skipped
      ansible.builtin.assert:
        that:
          - not (__ent_report.skipped | default(false))
        fail_msg: "the +ent report did not fire for an Enterprise pin"

    ###########################################################################
    # Enterprise license - config reference
    ###########################################################################
    # The template needs ~22 variables for a non-HSM render and ~31 with the
    # seal, none of which are in verify.yml's scope. include_role with
    # public: true makes the role's defaults AND vars live for the rest of the
    # play, so the lookup resolves and vault_config_dir is the ROLE's value --
    # not a fixture copy that would make the path assertion prove nothing.
    - name: Expose role scope for the Enterprise render
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/edition.yml
        public: true
      vars:
        vault_hsm_enabled: false

    - name: Render vault.hcl for an Enterprise edition
      ansible.builtin.set_fact:
        __rendered_ent: "{{ lookup('template', playbook_dir + '/../../templates/vault.hcl.j2') }}"
      vars:
        vault_edition: vault-enterprise-fips1403

    - name: "RENDERS - Enterprise config references the license path"
      ansible.builtin.assert:
        that:
          # NOT `is search(...)`: assert-rescue-patterns-are-emittable.sh:142
          # collects those literals in molecule/preflight/verify.yml and scopes
          # them to the preceding tasks_from:, which these renders inherit.
          # `in` is not matched by that regex and reads the same.
          - "'license_path' in __rendered_ent"
          - "(vault_config_dir ~ '/vault.hclic') in __rendered_ent"
        fail_msg: "license_path missing from the Enterprise render"

    - name: Render vault.hcl for the Community edition
      ansible.builtin.set_fact:
        __rendered_oss: "{{ lookup('template', playbook_dir + '/../../templates/vault.hcl.j2') }}"
      vars:
        vault_edition: vault

    - name: "RENDERS - Community config carries no license path"
      ansible.builtin.assert:
        that:
          - "'license_path' not in __rendered_oss"
        fail_msg: "license_path leaked into the Community render"

    ###########################################################################
    # The PKCS#11 seal - the combination the edition gate permits
    ###########################################################################
    # The template gates the seal on vault_hsm_enabled ALONE and is NOT changed
    # by this arc. The edition contract is enforced at TWO surfaces instead:
    # tasks/preflight/edition.yml at Phase 1, and the same file included from
    # tasks/configure.yml before the render -- which is the only one a
    # --tags configure or --skip-tags preflight run reaches. These cases pin
    # the supported behaviour so a future template edit cannot drop the seal
    # silently.
    - name: Render vault.hcl for the HSM edition with the seal enabled
      ansible.builtin.set_fact:
        __rendered_hsm: "{{ lookup('template', playbook_dir + '/../../templates/vault.hcl.j2') }}"
      vars:
        vault_edition: vault-enterprise-hsm-fips1403
        vault_hsm_enabled: true

    - name: "RENDERS - the HSM edition emits the pkcs11 seal stanza"
      ansible.builtin.assert:
        that:
          - "'seal \"pkcs11\"' in __rendered_hsm"
          - "'license_path' in __rendered_hsm"
        fail_msg: "pkcs11 seal or license_path missing from the HSM render"

    - name: Render vault.hcl with the seal disabled
      ansible.builtin.set_fact:
        __rendered_noseal: "{{ lookup('template', playbook_dir + '/../../templates/vault.hcl.j2') }}"
      vars:
        vault_edition: vault-enterprise-hsm-fips1403
        vault_hsm_enabled: false

    - name: "RENDERS - no seal stanza when HSM is disabled"
      # Weak on its own -- the role default is already false, so this would pass
      # even if the task var never applied. It is non-vacuous only paired with
      # the true-case above.
      ansible.builtin.assert:
        that:
          - "'seal \"pkcs11\"' not in __rendered_noseal"
        fail_msg: "pkcs11 seal rendered with vault_hsm_enabled false"
