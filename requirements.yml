---
###############################################################################
# Filename: requirements.yml
# Role: ansible-role-vault
# Summary: Ansible collection dependencies for this role. Install with:
#   ansible-galaxy collection install -r requirements.yml
# For EE builds, ansible-builder reads this automatically.
# Last Updated: 03 Apr 2026
# Classification: UNCLASSIFIED
###############################################################################
collections:
  # Address classification for the DNS preflight gate (ansible.utils.ipaddr).
  # Hand-rolled regex classification was defeated by three successive review
  # rounds -- IPv4-mapped loopback, the unspecified address, limited broadcast --
  # because reachability is address arithmetic, not string matching. Requires
  # netaddr>=0.10.1 on the CONTROLLER (see requirements.in); the filter runs
  # controller-side, so the managed host needs nothing.
  # Required for: tasks/preflight/dns.yml
  - name: ansible.utils
    version: ">=6.0.0"

  # Firewalld module (ansible.posix.firewalld)
  # Required for: tasks/firewall.yml
  # Min ansible-core: 2.16.0
  - name: ansible.posix
    version: ">=1.6.0"

  # SELinux file context management (community.general.sefcontext)
  # Required for: tasks/system.yml
  - name: community.general
    version: ">=9.0.0"

  # HashiCorp Vault modules and lookup plugins
  # Required for: post-install Vault initialization and configuration
  # (vault_init, vault_write, vault_read, hashi_vault lookup)
  # Min ansible-core: 2.17.0 (binding constraint for this role)
  - name: community.hashi_vault
    version: ">=7.0.0"
