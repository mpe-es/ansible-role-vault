---
###############################################################################
# Filename: tasks/firewall.yml
# Role: ansible-role-vault
# Summary: Configure firewalld rules for Vault ports
# NIST 800-53: SC-7 (Boundary Protection)
# Classification: UNCLASSIFIED
###############################################################################

- name: Open Vault ports in firewalld
  ansible.posix.firewalld:
    port: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ vault_firewall_ports }}"
