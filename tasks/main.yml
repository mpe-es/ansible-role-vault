---
###############################################################################
# Filename: tasks/main.yml
# Role: ansible-role-vault
# Summary: Main task orchestration for HashiCorp Vault installation and STIG
#   compliance on RHEL systems. Tasks are split into logical includes.
# Last Updated: 29 Jul 2026
# Classification: UNCLASSIFIED
###############################################################################

###############################################################################
# Phase 1: Pre-flight Validation
# Verify target system meets requirements before making changes.
###############################################################################
- name: Include pre-flight validation tasks
  ansible.builtin.include_tasks:
    file: preflight.yml
    apply:
      tags:
        - vault
        - preflight
  tags:
    - vault
    - preflight

###############################################################################
# Phase 2: Repository Configuration
# Write the repo file for the hashicorp/mirror sources; under satellite,
# write none and remove any role-written one. No mirror reachability check.
# NIST 800-53: SI-7 (Software, Firmware, and Information Integrity)
###############################################################################
- name: Include repository configuration tasks
  ansible.builtin.include_tasks:
    file: repo.yml
    apply:
      tags:
        - vault
        - repo
  when: vault_manage_repo | bool
  tags:
    - vault
    - repo

###############################################################################
# Phase 3: Package Installation
# Install HashiCorp Vault RPM package.
###############################################################################
- name: Include package installation tasks
  ansible.builtin.include_tasks:
    file: install.yml
    apply:
      tags:
        - vault
        - install
  tags:
    - vault
    - install

###############################################################################
# Phase 4: System Preparation
# Create directories, set permissions, configure system user/group.
# NIST 800-53: AC-6 (Least Privilege)
###############################################################################
- name: Include system preparation tasks
  ansible.builtin.include_tasks:
    file: system.yml
    apply:
      tags:
        - vault
        - system
  tags:
    - vault
    - system

###############################################################################
# Phase 5: TLS Certificate Deployment
# Deploy TLS certificates for Vault listener and Raft cluster comms.
# NIST 800-53: SC-8 (Transmission Confidentiality and Integrity)
###############################################################################
- name: Include TLS certificate tasks
  ansible.builtin.include_tasks:
    file: tls.yml
    apply:
      tags:
        - vault
        - tls
  when: vault_manage_tls | bool
  tags:
    - vault
    - tls

###############################################################################
# Phase 6: Vault Configuration
# Deploy vault.hcl with listener, storage, and cluster settings.
###############################################################################
- name: Include Vault configuration tasks
  ansible.builtin.include_tasks:
    file: configure.yml
    apply:
      tags:
        - vault
        - configure
  tags:
    - vault
    - configure

###############################################################################
# Phase 7: Firewall Configuration
# Open required ports in firewalld.
# NIST 800-53: SC-7 (Boundary Protection)
###############################################################################
- name: Include firewall configuration tasks
  ansible.builtin.include_tasks:
    file: firewall.yml
    apply:
      tags:
        - vault
        - firewall
  when: vault_manage_firewall | bool
  tags:
    - vault
    - firewall

###############################################################################
# Phase 8: STIG Hardening
# Apply STIG-compliant configurations: audit logging, logrotate, AIDE,
# file permissions, rsyslog forwarding.
###############################################################################
- name: Include STIG hardening tasks
  ansible.builtin.include_tasks:
    file: stig.yml
    apply:
      tags:
        - vault
        - stig
  tags:
    - vault
    - stig

###############################################################################
# Phase 8.5: fapolicyd Trust Management
# Register file-trust entries for the Vault binary and helper scripts.
# apply: is REQUIRED — include_tasks does NOT propagate its own tags to
# included tasks (only import_tasks does).
# NIST 800-53: CM-7(5), SI-7
###############################################################################
- name: Include fapolicyd trust tasks
  ansible.builtin.include_tasks:
    file: fapolicyd.yml
    apply:
      tags:
        - vault
        - install
        - stig
        - fapolicyd
  when: vault_manage_fapolicyd | bool
  tags:
    - vault
    - install
    - stig
    - fapolicyd

###############################################################################
# Phase 9: Service Management
# Enable and start the Vault service.
###############################################################################
- name: Include service management tasks
  ansible.builtin.include_tasks:
    file: service.yml
    apply:
      tags:
        - vault
        - service
  tags:
    - vault
    - service
