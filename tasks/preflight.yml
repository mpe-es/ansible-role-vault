---
###############################################################################
# Filename: tasks/preflight.yml
# Role: ansible-role-vault
# Summary: Pre-flight validation orchestrator. One file per gate under
#   tasks/preflight/; this file only sequences them. The canonical order is
#   locked by tests/assert-preflight-gate-order.sh (issue #36).
#
#   Each include carries BOTH its own tags: and an apply: block. A dynamic
#   include does not propagate its own tags, so an include with only apply: is
#   skipped entirely under --tags; one with only tags: includes the file but
#   runs none of its tasks. tasks/main.yml Phase 8.5 is the in-repo precedent.
#
#   apply: carries [preflight] ONLY, not [vault, preflight]: mirroring both
#   would make --tags vault run the gates and then nothing else -- a run that
#   looks like it worked. That is the #28 trap, which this change does not fix.
# Classification: UNCLASSIFIED
###############################################################################
- name: Include preflight gate - os_family
  ansible.builtin.include_tasks:
    file: preflight/os_family.yml
    apply:
      tags:
        - preflight
  tags:
    - vault
    - preflight

- name: Include preflight gate - os_version
  ansible.builtin.include_tasks:
    file: preflight/os_version.yml
    apply:
      tags:
