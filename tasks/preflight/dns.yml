---
###############################################################################
# Filename: tasks/preflight/dns.yml
# Role: ansible-role-vault
# Summary: Preflight gate - the host's own FQDN resolves LOCALLY to a
#   non-loopback, non-link-local address (issue #79).
#
#   This gate used to probe `getent hosts` and warn only on a non-zero rc,
#   measuring "did resolution return an answer", never "is the answer an address
#   anything can reach". The second is what the role depends on, because
#   defaults/main.yml derives BOTH advertised addresses from this same name:
#
#       vault_api_addr:     "https://{{ ansible_fqdn }}:{{ vault_listener_port }}"
#       vault_cluster_addr: "https://{{ ansible_fqdn }}:8201"
#
#   A Debian-convention `127.0.1.1 <fqdn>` line in /etc/hosts satisfies the old
#   predicate completely. The host converges and Vault advertises an api_addr
#   clients cannot reach and a cluster_addr no Raft peer can dial -- surfacing at
#   cluster-join time, far from its cause. That shape was hit on a real lab host.
#
#   WHAT THIS GATE DOES NOT PROVE, stated plainly because an earlier draft of
#   this file claimed otherwise: it does not prove a PEER can resolve the name.
#   `nss-myhostname` resolves the local hostname to the locally configured
#   addresses -- the NIC address, not 127.0.0.2 -- whenever any are configured,
#   so a host with a working interface and NO DNS record whatsoever passes this
#   gate. What it catches is a name that resolves only to an address nothing can
#   route to: an explicit loopback mapping in `files`, a link-local address from
#   a failed DHCP lease, or a name that does not resolve at all. Proving the
#   record exists in the zone a client will query is a different check, from a
#   different vantage point, and is not attempted here.
#
#   `getent ahosts`, not `getent hosts`: hosts returns the first match only and
#   prefers IPv6, so a loopback AAAA masks a routable A. ahosts reports every
#   family, which is the set this gate needs.
#
#   POLARITY. This is a hard gate only when the ROLE needs the name to resolve:
#   when vault_api_addr or vault_cluster_addr still contain ansible_fqdn (the
#   default), OR when vault_manage_tls is true AND vault_tls_source is
#   'vault_pki', because tasks/tls.yml
#   issues that certificate with `common_name: "{{ ansible_fqdn }}"` regardless
#   of what the advertised addresses say. An operator with neither dependency
#   gets a warning instead of a failure. An earlier draft armed on the addresses
#   alone and claimed in three places that pinning them removed the dependency
#   entirely -- `grep -rn ansible_fqdn` across the role disproves that.
# NIST 800-53: SC-8, CM-6 (Configuration Settings)
# Classification: UNCLASSIFIED
###############################################################################
# `command -v getent` as its own probe, exactly as tasks/preflight/port.yml
# does for `ss` and tasks/preflight/chrony.yml for `chronyc`. An earlier draft
# tried to discriminate on the resolve command's own rc and could not: a missing
# binary makes ansible.builtin.command fail_json with rc = ENOENT = 2, which is
# byte-identical to getent's own "key not found" exit. rc 127 is a SHELL
# convention and `command` execs directly, so it never appears.
- name: Detect getent
  ansible.builtin.command:
    cmd: command -v getent
  register: __vault_getent_bin
  check_mode: false
  changed_when: false
  failed_when: false
  environment:
    LC_ALL: C

- name: "Preflight | dns | resolver query tool is available"
  ansible.builtin.assert:
    that:
      - __vault_getent_bin.rc == 0
    fail_msg: >-
      `getent` is not on PATH, so this gate cannot determine whether
      {{ ansible_fqdn }} resolves. getent ships with glibc and should always be
      present; its absence is a broken host, not a DNS problem. Install glibc-common.
    success_msg: "Resolver query tool: present"

- name: Resolve the host FQDN across all address families
  ansible.builtin.command:
    cmd: "getent ahosts {{ ansible_fqdn }}"
  register: __vault_dns_check
  check_mode: false          # command/shell are skipped under --check;
  # a skipped probe returns rc 0 with empty output, which would read here as
  # "resolved to nothing" and fail a healthy host.
  changed_when: false
  failed_when: false
  environment:
    LC_ALL: C

# First whitespace-delimited field of each ahosts line is the address; the same
# address repeats once per socket type (STREAM/DGRAM/RAW), hence unique.
#
# IPv4-MAPPED FORMS ARE NORMALISED FIRST. `::ffff:127.0.0.1` is loopback wearing
# an IPv6 costume: it matches none of the IPv4 patterns and is not `::1`, so
# without stripping the prefix it counted as reachable. Measured, not assumed.
#
# Excluded after that: loopback (127.0.0.0/8, ::1), the unspecified address
# (0.0.0.0), and link-local (169.254.0.0/16 and fe80::/10). Note the IPv6
# link-local range is fe80 through febf -- the first TEN bits, not the first
# sixteen -- so the test is [Ff][Ee][89AaBb], not fe80. An earlier draft matched
# `fe80:` only and admitted fe90:: and febf:: as reachable.
#
# Link-local is what a failed DHCP lease leaves behind, and nss-myhostname
# returns it ordered by scope -- an advertised address on any of these is
# equally unreachable.
- name: Extract the reachable addresses the FQDN resolves to
  ansible.builtin.set_fact:
    __vault_dns_routable: >-
      {{ __vault_dns_check.stdout_lines | default([])
         | map('regex_replace', '^(\S+).*$', '\1')
         | map('regex_replace', '^::[Ff]{4}:', '')
         | reject('match', '^127\.')
         | reject('equalto', '::1')
         | reject('equalto', '0.0.0.0')
         | reject('match', '^169\.254\.')
         | reject('match', '^[Ff][Ee][89AaBb]')
         | select | unique | list }}

# Substring, deliberately: true for the default templates, false for an
# operator-pinned literal address, without needing to know which produced the
# value. It errs toward ARMING: a short hostname (socket.getfqdn() returns one
# when the host has no domain) is a substring of a pinned FQDN address, so such
# an operator is gated on a name they meant to stop depending on. Arming a host
# that did not need it is the safe direction to be wrong in; the reverse would
# ship the defect this gate exists to catch. default('', true) because an explicitly-null override is a real shape
# and `in` against None raises rather than reporting the gate's own message.
- name: Determine whether the advertised addresses depend on this hostname
  ansible.builtin.set_fact:
    __vault_dns_advertised: >-
      {{ (ansible_fqdn | default('', true) | length > 0)
         and ((ansible_fqdn in (vault_api_addr | default('', true)))
              or (ansible_fqdn in (vault_cluster_addr | default('', true)))) }}

# The addresses are not the only consumer of this name. tasks/tls.yml issues a
# Vault-PKI certificate with `common_name: "{{ ansible_fqdn }}"`, so an operator
# who pinned both advertised addresses AND selected vault_pki still depends on
# the FQDN -- and would otherwise be downgraded to a warning while the role mints
# a certificate for a name nothing resolves. An earlier draft asserted in three
# artifacts that pinning removes the dependency; it does not.
- name: Determine whether the role needs this hostname to resolve
  ansible.builtin.set_fact:
    __vault_dns_required: >-
      {{ (__vault_dns_advertised | bool)
         or ((vault_manage_tls | default(false) | bool)
             and (vault_tls_source | default('file')) == 'vault_pki') }}

- name: "Preflight | dns | FQDN resolves to a reachable address"
  ansible.builtin.assert:
    that:
      - __vault_dns_routable | length > 0
    fail_msg: >-
      {{ ansible_fqdn }} resolves to no reachable address
      {% if __vault_dns_check.rc == 0 %}
      -- only to loopback or link-local
      ({{ __vault_dns_check.stdout_lines | map('regex_replace', '^(\S+).*$', '\1') | unique | join(', ') }})
      {% else %}
      -- it does not resolve at all
      {% endif %}
      {% if __vault_dns_advertised | bool %}
      , and vault_api_addr / vault_cluster_addr are derived from it, so Vault
      would advertise an address no client or Raft peer can reach. Fix the DNS
      record or the /etc/hosts entry for this host, or set vault_api_addr and
      vault_cluster_addr to explicit reachable addresses.
      {% else %}
      , and vault_tls_source is 'vault_pki', so the role would issue a listener
      certificate whose common name is this unresolvable FQDN. Fix the DNS record
      or the /etc/hosts entry for this host.
      {% endif %}
      A Debian-style 127.0.1.1 line is the usual cause.
    success_msg: "DNS: {{ ansible_fqdn }} -> {{ __vault_dns_routable | join(', ') }}"
  when: __vault_dns_required | bool

# The operator pinned explicit advertised addresses, so an unreachable hostname
# breaks nothing the role does -- but it is still worth saying out loud, because
# the next operator to remove that override inherits a broken deployment.
- name: Warn when the FQDN is unreachable but the advertised addresses are pinned
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ ansible_fqdn }} does not resolve to a reachable address.
      vault_api_addr and vault_cluster_addr are set explicitly, so this does not
      block the run -- but remove those overrides and the deployment breaks.
  when:
    - not (__vault_dns_required | bool)
    - __vault_dns_routable | length == 0
