---
###############################################################################
# Filename: tasks/preflight/san.yml
# Role: ansible-role-vault
# Summary: Preflight gate - the listener certificate carries the SANs the
#   role's OWN callers require (issue #85).
#
#   Preflight previously checked that the TLS trio EXISTS and never looked
#   inside it. A certificate missing the 127.0.0.1 IP SAN therefore passed every
#   gate, the role converged the host in full -- package installed, config
#   written, hardening applied, firewall opened -- and only then did init and
#   unseal fail at service start. That is the late-failure-after-mutation class
#   Phase 1 exists to eliminate, on the DEFAULT TLS path.
#
#   MEASURED, not inferred. On a live host, a certificate carrying
#   DNS:vault.home.lab.local + IP:10.110.11.55 but no loopback SAN gives:
#
#     Get "https://127.0.0.1:8200/v1/sys/seal-status": tls: failed to verify
#     certificate: x509: certificate is valid for 10.110.11.55, not 127.0.0.1
#
#   while the SAME certificate works via the FQDN. The certificate is not
#   invalid; it is unusable by this role's callers. Adding IP:127.0.0.1 and
#   changing nothing else took vault_initialize from failing at the unseal call
#   to Initialized true / Sealed false.
#
#   WHY THE LOOPBACK SAN IS NOT NEGOTIABLE. tasks/service.yml verifies against
#   https://127.0.0.1:<port>, and templates/vault.env.j2 plus
#   templates/vault-unseal.service.j2 BAKE that address into the host as the
#   boot-time unseal target. The unit runs before DNS is dependable, which is
#   why loopback rather than the FQDN. Enterprise issuing CAs sometimes refuse
#   IP SANs; where that is so, this gate reports the conflict at Phase 1 instead
#   of letting it surface as an opaque service-start failure.
#
#   HOSTNAME VERIFICATION IS DELEGATED, NOT REIMPLEMENTED. An earlier revision
#   compared the advertised name against the DNS SAN list with string equality.
#   That rejected `DNS:*.example.com` for `vault.example.com` -- a certificate
#   every TLS client accepts -- turning a usable listener cert into a Phase 1
#   failure. `openssl x509 -checkhost/-checkip` implements RFC 6125, wildcards
#   and label boundaries included, and returns rc 0/1. Measured against a
#   wildcard fixture: vault.example.com matches, a.b.example.com does not
#   (crosses a label), example.com does not (bare domain uncovered).
#   Same defect class as #79, where hand-rolled address classification was
#   defeated three review rounds running before being handed to a library.
#
#   THE URL IS PARSED, NOT STRIPPED. `urlsplit('hostname')` is used instead of
#   a regex. Stripping from the first `:` produced `[2001` for the documented
#   form `https://[2001:db8::10]:8200`, which was then classified as a name and
#   looked up as `DNS:[2001`. urlsplit returns the bracket-free address.
#
#   This gate checks ONLY what the role itself depends on. It is not a general
#   certificate validator: expiry, key size, chain trust and EKU are out of
#   scope and deliberately unmentioned, so a pass here is never mistaken for
#   "this certificate is good".
# NIST 800-53: SC-8, SC-12, SC-17
# Classification: UNCLASSIFIED
###############################################################################

# Which certificate is authoritative, and WHERE it lives, differs by path --
# the same split the tls/managed_tls gates already make. The README states the
# requirement is about the FINAL listener certificate "regardless of who puts it
# there", so both inspectable paths are covered.
- name: "Preflight | san | resolve which certificate to inspect"
  ansible.builtin.set_fact:
    __vault_san_path: >-
      {{ vault_tls_cert_file if not (vault_manage_tls | bool)
         else (vault_tls_src_cert | default('')) }}
    __vault_san_on_controller: "{{ vault_manage_tls | bool }}"

# vault_pki issues at run time, so there is nothing to inspect here. Reported,
# never failed -- the path is tracked separately (#63) and silently skipping
# would leave an operator believing the contract was checked.
- name: "Preflight | san | vault_pki issues at run time and cannot be inspected"
  ansible.builtin.debug:
    msg: >-
      vault_tls_source is 'vault_pki', so no certificate exists yet to inspect.
      The SAN contract still applies to what that engine issues -- it must carry
      IP:127.0.0.1 and the advertised host identity. See issue #63.
  when:
    - vault_manage_tls | bool
    - vault_tls_source == 'vault_pki'

# A relative controller source is left to copy's own search path, exactly as the
# managed_tls gate does (#80). Rejecting them would hard-fail this project's own
# documented examples.
- name: "Preflight | san | relative controller source cannot be inspected"
  ansible.builtin.debug:
    msg: >-
      vault_tls_src_cert is '{{ __vault_san_path }}', a relative path resolved
      through Ansible's search path at copy time. This gate does not reimplement
      that order, so the SAN contract is unverified here. Give it an absolute
      controller path to have it checked.
  when:
    - vault_manage_tls | bool
    - vault_tls_source == 'file'
    - __vault_san_path | length > 0
    - not (__vault_san_path is match('^/'))

- name: "Preflight | san | set the inspection premise"
  ansible.builtin.set_fact:
    __vault_san_inspectable: >-
      {{ (not (vault_manage_tls | bool))
         or (vault_tls_source == 'file'
             and (__vault_san_path | length > 0)
             and (__vault_san_path is match('^/'))) }}

###############################################################################
# Probe. openssl is required wherever the certificate lives; probed with
# command -v exactly as the port, chrony and dns gates probe ss, chronyc and
# getent. check_mode: false on every probe -- command/shell are SKIPPED under
# --check and register rc 0 with empty stdout, which every assert below would
# read as a healthy host (locked as a class by assert-preflight-check-mode.sh).
###############################################################################
- name: Detect openssl for SAN inspection
  ansible.builtin.command:
    cmd: command -v openssl
  register: __vault_san_ossl
  check_mode: false
  changed_when: false
  failed_when: false
  environment:
    LC_ALL: C
  delegate_to: "{{ 'localhost' if (__vault_san_on_controller | bool) else inventory_hostname }}"
  when: __vault_san_inspectable | bool

- name: Read the certificate's subjectAltName extension
  ansible.builtin.command:
    cmd: "openssl x509 -in {{ __vault_san_path }} -noout -ext subjectAltName"
  register: __vault_san_raw
  check_mode: false
  changed_when: false
  failed_when: false
  environment:
    LC_ALL: C
  delegate_to: "{{ 'localhost' if (__vault_san_on_controller | bool) else inventory_hostname }}"
  when:
    - __vault_san_inspectable | bool
    - __vault_san_ossl.rc | default(1) == 0

###############################################################################
# Verify. Two questions, each asked of openssl rather than of a parsed string:
# does the certificate serve the loopback address the role's own callers use,
# and does it serve the identity the role advertises. argv form throughout, so
# a path containing spaces cannot be resplit by the module.
#
# check_mode: false on every probe -- command/shell are SKIPPED under --check
# and register rc 0 with empty stdout, which every assert below would read as a
# healthy host (locked as a class by assert-preflight-check-mode.sh).
###############################################################################
- name: "Preflight | san | resolve the advertised host identity"
  ansible.builtin.set_fact:
    # urlsplit, not a regex: it returns the hostname with IPv6 brackets already
    # removed, which is the whole reason the regex form was wrong.
    __vault_san_host: "{{ vault_api_addr | urlsplit('hostname') }}"

- name: Verify the certificate serves the loopback address
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ __vault_san_path }}"
      - -noout
      - -checkip
      - 127.0.0.1
  register: __vault_san_loopback
  check_mode: false
  changed_when: false
  failed_when: false
  environment:
    LC_ALL: C
  delegate_to: "{{ 'localhost' if (__vault_san_on_controller | bool) else inventory_hostname }}"
  when:
    - __vault_san_inspectable | bool
    - __vault_san_ossl.rc | default(1) == 0

- name: Verify the certificate serves the advertised identity
  ansible.builtin.command:
    # -checkip for an address, -checkhost for a name. Classification is
    # delegated to ansible.utils.ipaddr, the same decision #79 reached -- and
    # it is what makes DNS:10.0.0.5 fail to satisfy https://10.0.0.5, which is
    # correct: that certificate does not validate for that URL.
    argv:
      - openssl
      - x509
      - -in
      - "{{ __vault_san_path }}"
      - -noout
      - "{{ '-checkip' if (__vault_san_host | ansible.utils.ipaddr) else '-checkhost' }}"
      - "{{ __vault_san_host }}"
  register: __vault_san_advertised
  check_mode: false
  changed_when: false
  failed_when: false
  environment:
    LC_ALL: C
  delegate_to: "{{ 'localhost' if (__vault_san_on_controller | bool) else inventory_hostname }}"
  when:
    - __vault_san_inspectable | bool
    - __vault_san_ossl.rc | default(1) == 0

# Read purely to make the failure message actionable -- it names what the
# certificate actually carries. Never used for the decision itself.
- name: Read the certificate's subjectAltName extension for reporting
  ansible.builtin.command:
    argv:
      - openssl
      - x509
      - -in
      - "{{ __vault_san_path }}"
      - -noout
      - -ext
      - subjectAltName
  register: __vault_san_raw
  check_mode: false
  changed_when: false
  failed_when: false
  environment:
    LC_ALL: C
  delegate_to: "{{ 'localhost' if (__vault_san_on_controller | bool) else inventory_hostname }}"
  when:
    - __vault_san_inspectable | bool
    - __vault_san_ossl.rc | default(1) == 0

- name: "Preflight | san | the certificate serves this role's own callers"
  ansible.builtin.assert:
    that:
      - __vault_san_loopback.rc is defined
      - __vault_san_loopback.rc | default(1) == 0
      - __vault_san_advertised.rc | default(1) == 0
      # openssl falls back to the Common Name when a certificate carries no
      # dNSName SAN, so -checkhost alone would accept a CN-only certificate.
      # Vault's client is Go, and Go has ignored CN since 1.15 -- such a
      # certificate passes here and then fails at service start, which is the
      # exact failure this gate exists to prevent. Measured: a cert with
      # CN=vault.fixture.test and only an IP SAN satisfies -checkhost.
      - >-
        true if (__vault_san_host | ansible.utils.ipaddr)
        else (__vault_san_raw.stdout | default('') is search('DNS:'))
    fail_msg: >-
      {% if __vault_san_ossl.rc | default(1) != 0 %}
      openssl is not available
      {{ 'on the Ansible controller' if (__vault_san_on_controller | bool) else 'on this host' }},
      so the certificate cannot be checked. Install it, or accept that the SAN
      contract is unverified and may fail at service start.
      {% elif __vault_san_loopback.rc is not defined %}
      {{ __vault_san_path }} was never inspected
      {{ 'on the Ansible controller' if (__vault_san_on_controller | bool) else 'on this host' }};
      the check did not run, so the SAN contract is unverified.
      {% elif __vault_san_loopback.rc | default(1) != 0 %}
      {{ __vault_san_path }} does not serve 127.0.0.1. The role's own callers use
      the loopback address -- tasks/service.yml verifies against
      https://127.0.0.1:{{ vault_listener_port }}, and the unseal unit sets
      VAULT_ADDR to it because it runs before DNS is dependable -- so init and
      unseal WILL fail hostname verification at service start with
      "x509: certificate is valid for ..., not 127.0.0.1", however valid the
      certificate is otherwise. Reissue with IP:127.0.0.1 in subjectAltName.
      If your issuing CA refuses IP SANs, that conflict has to be resolved
      before this role can initialise Vault.
      Certificate carries: {{ (__vault_san_raw.stdout_lines | default([]) | last) | default('(unreadable)', true) | trim }}
      {% elif not (__vault_san_host | ansible.utils.ipaddr)
              and not (__vault_san_raw.stdout | default('') is search('DNS:')) %}
      {{ __vault_san_path }} carries no DNS SAN at all. It may match
      {{ __vault_san_host }} through its Common Name, but Vault's client is Go,
      which has ignored the Common Name since Go 1.15 -- so this certificate
      would be rejected at service start even though openssl accepts it.
      Reissue with the name in subjectAltName rather than only in the subject.
      Certificate carries: {{ (__vault_san_raw.stdout_lines | default([]) | last) | default('(unreadable)', true) | trim }}
      {% else %}
      {{ __vault_san_path }} does not serve {{ __vault_san_host }}, the identity
      vault_api_addr advertises
      ({{ 'an ADDRESS, so it needs an IP SAN -- a DNS SAN of the same text does not validate it'
          if (__vault_san_host | ansible.utils.ipaddr)
          else 'a NAME, so it needs a matching DNS SAN (wildcards count, one label only)' }}).
      Clients dialling that address will fail hostname verification.
      Certificate carries: {{ (__vault_san_raw.stdout_lines | default([]) | last) | default('(unreadable)', true) | trim }}
      {% endif %}
    success_msg: >-
      Certificate SANs: serves {{ __vault_san_host }} and 127.0.0.1
  when: __vault_san_inspectable | bool
