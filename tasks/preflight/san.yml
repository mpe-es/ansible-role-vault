---
###############################################################################
# Filename: tasks/preflight/san.yml
# Role: ansible-role-vault
# Summary: Preflight gate - the listener certificate carries the SANs the
#   role's OWN callers require (issue #85).
#
#   Preflight previously checked that the TLS trio EXISTS and never looked
#   inside it. A certificate missing the 127.0.0.1 IP SAN therefore passed every
#   gate, the role converged the host in full -- package installed, config
#   written, hardening applied, firewall opened -- and only then did init and
#   unseal fail at service start. That is the late-failure-after-mutation class
#   Phase 1 exists to eliminate, on the DEFAULT TLS path.
#
#   MEASURED, not inferred. On a live host, a certificate carrying
#   DNS:vault.home.lab.local + IP:10.110.11.55 but no loopback SAN gives:
#
#     Get "https://127.0.0.1:8200/v1/sys/seal-status": tls: failed to verify
#     certificate: x509: certificate is valid for 10.110.11.55, not 127.0.0.1
#
#   while the SAME certificate works via the FQDN. The certificate is not
#   invalid; it is unusable by this role's callers. Adding IP:127.0.0.1 and
#   changing nothing else took vault_initialize from failing at the unseal call
#   to Initialized true / Sealed false.
#
#   WHY THE LOOPBACK SAN IS NOT NEGOTIABLE. tasks/service.yml verifies against
#   https://127.0.0.1:<port>, and templates/vault.env.j2 plus
#   templates/vault-unseal.service.j2 BAKE that address into the host as the
#   boot-time unseal target. The unit runs before DNS is dependable, which is
#   why loopback rather than the FQDN. Enterprise issuing CAs sometimes refuse
#   IP SANs; where that is so, this gate reports the conflict at Phase 1 instead
#   of letting it surface as an opaque service-start failure.
#
#   This gate checks ONLY what the role itself depends on. It is not a general
#   certificate validator: expiry, key size, chain trust and EKU are out of
#   scope and deliberately unmentioned, so a pass here is never mistaken for
#   "this certificate is good".
# NIST 800-53: SC-8, SC-12, SC-17
# Classification: UNCLASSIFIED
###############################################################################

# Which certificate is authoritative, and WHERE it lives, differs by path --
# the same split the tls/managed_tls gates already make. The README states the
# requirement is about the FINAL listener certificate "regardless of who puts it
# there", so both inspectable paths are covered.
- name: "Preflight | san | resolve which certificate to inspect"
  ansible.builtin.set_fact:
    __vault_san_path: >-
      {{ vault_tls_cert_file if not (vault_manage_tls | bool)
         else (vault_tls_src_cert | default('')) }}
    __vault_san_on_controller: "{{ vault_manage_tls | bool }}"

# vault_pki issues at run time, so there is nothing to inspect here. Reported,
# never failed -- the path is tracked separately (#63) and silently skipping
# would leave an operator believing the contract was checked.
- name: "Preflight | san | vault_pki issues at run time and cannot be inspected"
  ansible.builtin.debug:
    msg: >-
      vault_tls_source is 'vault_pki', so no certificate exists yet to inspect.
      The SAN contract still applies to what that engine issues -- it must carry
      IP:127.0.0.1 and the advertised host identity. See issue #63.
  when:
    - vault_manage_tls | bool
    - vault_tls_source == 'vault_pki'

# A relative controller source is left to copy's own search path, exactly as the
# managed_tls gate does (#80). Rejecting them would hard-fail this project's own
# documented examples.
- name: "Preflight | san | relative controller source cannot be inspected"
  ansible.builtin.debug:
    msg: >-
      vault_tls_src_cert is '{{ __vault_san_path }}', a relative path resolved
      through Ansible's search path at copy time. This gate does not reimplement
      that order, so the SAN contract is unverified here. Give it an absolute
      controller path to have it checked.
  when:
    - vault_manage_tls | bool
    - vault_tls_source == 'file'
    - __vault_san_path | length > 0
    - not (__vault_san_path is match('^/'))

- name: "Preflight | san | set the inspection premise"
  ansible.builtin.set_fact:
    __vault_san_inspectable: >-
      {{ (not (vault_manage_tls | bool))
         or (vault_tls_source == 'file'
             and (__vault_san_path | length > 0)
             and (__vault_san_path is match('^/'))) }}

###############################################################################
# Probe. openssl is required wherever the certificate lives; probed with
# command -v exactly as the port, chrony and dns gates probe ss, chronyc and
# getent. check_mode: false on every probe -- command/shell are SKIPPED under
# --check and register rc 0 with empty stdout, which every assert below would
# read as a healthy host (locked as a class by assert-preflight-check-mode.sh).
###############################################################################
- name: Detect openssl for SAN inspection
  ansible.builtin.command:
    cmd: command -v openssl
  register: __vault_san_ossl
  check_mode: false
  changed_when: false
  failed_when: false
  environment:
    LC_ALL: C
  delegate_to: "{{ 'localhost' if (__vault_san_on_controller | bool) else inventory_hostname }}"
  when: __vault_san_inspectable | bool

- name: Read the certificate's subjectAltName extension
  ansible.builtin.command:
    cmd: "openssl x509 -in {{ __vault_san_path }} -noout -ext subjectAltName"
  register: __vault_san_raw
  check_mode: false
  changed_when: false
  failed_when: false
  environment:
    LC_ALL: C
  delegate_to: "{{ 'localhost' if (__vault_san_on_controller | bool) else inventory_hostname }}"
  when:
    - __vault_san_inspectable | bool
    - __vault_san_ossl.rc | default(1) == 0

###############################################################################
# Parse. openssl prints one line of comma-separated entries:
#     DNS:vault.home.lab.local, IP Address:127.0.0.1, IP Address:10.0.0.5
# Verified byte-identical on OpenSSL 3.5.8 (EL9) and 3.6.4 (macOS controller);
# the -ext flag exists from 1.1.1, which is EL8's version.
# Note the label is "IP Address:" WITH A SPACE, not "IP:" -- the form accepted
# in a -extfile is not the form printed back.
###############################################################################
- name: "Preflight | san | extract the SAN entries"
  ansible.builtin.set_fact:
    # DNS names are case-insensitive (RFC 4343) and a trailing dot denotes the
    # same name, so both are normalised before comparison.
    __vault_san_dns: >-
      {{ __vault_san_raw.stdout | default('')
         | regex_findall('DNS:([^,\s]+)')
         | map('lower') | map('regex_replace', '\.$', '') | list }}
    __vault_san_ip: >-
      {{ __vault_san_raw.stdout | default('')
         | regex_findall('IP Address:([^,\s]+)') | list }}
    # The host identity the role advertises, and whether it is a name or an
    # address. Classification is delegated to ansible.utils.ipaddr rather than
    # pattern-matched, the same decision #79 reached for the DNS gate.
    __vault_san_host: >-
      {{ vault_api_addr | regex_replace('^[a-z]+://', '')
                        | regex_replace('[:/].*$', '') }}

- name: "Preflight | san | the certificate carries the SANs this role's callers need"
  ansible.builtin.assert:
    that:
      - __vault_san_raw.stdout is defined
      - "'127.0.0.1' in __vault_san_ip"
      - >-
        (__vault_san_host in __vault_san_ip)
        if (__vault_san_host | ansible.utils.ipaddr)
        else ((__vault_san_host | lower | regex_replace('\.$', '')) in __vault_san_dns)
    fail_msg: >-
      {% if __vault_san_ossl.rc | default(1) != 0 %}
      openssl is not available
      {{ 'on the Ansible controller' if (__vault_san_on_controller | bool) else 'on this host' }},
      so the certificate's SANs cannot be inspected. Install it, or accept that
      the SAN contract is unverified and may fail at service start.
      {% elif __vault_san_raw.stdout is not defined or (__vault_san_raw.rc | default(1) != 0) %}
      {{ __vault_san_path }} could not be read as a certificate
      {{ 'on the Ansible controller' if (__vault_san_on_controller | bool) else 'on this host' }}.
      openssl said: {{ (__vault_san_raw.stderr_lines | default([]) + ['(no output)']) | first }}
      {% elif '127.0.0.1' not in __vault_san_ip %}
      {{ __vault_san_path }} has no 127.0.0.1 IP SAN. The role's own callers use
      the loopback address -- tasks/service.yml verifies against
      https://127.0.0.1:{{ vault_listener_port }}, and the unseal unit sets
      VAULT_ADDR to it because it runs before DNS is dependable -- so init and
      unseal WILL fail hostname verification at service start with
      "x509: certificate is valid for ..., not 127.0.0.1", however valid the
      certificate is otherwise. Reissue with IP:127.0.0.1 in subjectAltName.
      If your issuing CA refuses IP SANs, that conflict has to be resolved
      before this role can initialise Vault. Found SANs -- DNS:
      {{ __vault_san_dns | join(', ') | default('(none)', true) }} / IP:
      {{ __vault_san_ip | join(', ') | default('(none)', true) }}
      {% elif __vault_san_host | ansible.utils.ipaddr %}
      vault_api_addr advertises the ADDRESS {{ __vault_san_host }}, so the
      certificate needs it as an IP SAN. A DNS SAN of the same text does not
      validate https://{{ __vault_san_host }}. Found IP SANs:
      {{ __vault_san_ip | join(', ') | default('(none)', true) }}
      {% else %}
      vault_api_addr advertises the NAME {{ __vault_san_host }}, which is absent
      from the certificate's DNS SANs. Clients dialling that address will fail
      hostname verification. Found DNS SANs:
      {{ __vault_san_dns | join(', ') | default('(none)', true) }}
      {% endif %}
    success_msg: >-
      Certificate SANs: {{ __vault_san_host }} present, 127.0.0.1 present
  when: __vault_san_inspectable | bool
