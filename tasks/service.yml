---
###############################################################################
# Filename: tasks/service.yml
# Role: ansible-role-vault
# Summary: Enable/start Vault service, optional initialization and unseal
# Classification: UNCLASSIFIED
###############################################################################

###############################################################################
# Service Startup
###############################################################################
# Flush any pending "Restart vault" (notified by configure.yml when vault.hcl/
# vault.env changed) BEFORE the init transaction. Otherwise the end-of-play
# handler restart runs AFTER post-init unseal and re-seals a Shamir Vault,
# leaving the node initialized-but-sealed despite vault_init_unseal=true
# (codex). No-op on idempotent re-runs (config unchanged -> nothing notified).
- name: Flush pending handlers before the init transaction
  ansible.builtin.meta: flush_handlers

# service_start: needs a live Vault; molecule skips this tag (the rest of
# service.yml — incl. the state-based [Install]-link repair — still runs).
- name: Enable and start Vault service
  ansible.builtin.systemd_service:
    name: "{{ vault_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - service_start

- name: Wait for Vault to be listening
  ansible.builtin.wait_for:
    port: "{{ vault_listener_port }}"
    host: 127.0.0.1
    timeout: 30
    delay: 2
  tags:
    - service_start

###############################################################################
# Vault Initialization (optional, for greenfield deployments)
###############################################################################
- name: Initialize Vault
  when: vault_initialize | bool
  block:
    - name: Validate initialization capture destination
      ansible.builtin.assert:
        that:
          - vault_init_capture_dir | length > 0
          - vault_init_capture_dir is match('^/')
          - vault_init_capture_mode is match('^0?[0-7]00$')
        fail_msg: >-
          Vault initialization is enabled but vault_init_capture_dir is not an
          absolute controller directory, or vault_init_capture_mode grants
          group/other access (must be owner-only, e.g. 0600). The role captures
          the root token and one file per unseal/recovery share there, under a
          per-host subdirectory (the root token is NEVER stored on the node).
        success_msg: "Vault initialization capture destination configured"

    # State-free, and ahead of the durability include: an invalid init host would
    # otherwise skip that fail-closed gate on every host (#44).
    - name: Validate the initialization host
      ansible.builtin.assert:
        that:
          - (vault_cluster_members | default([]) | length == 0)
            or (vault_init_host | default('') | length > 0)
          - (vault_init_host | default('') | length == 0)
            or (vault_init_host in ansible_play_hosts_all)
        fail_msg: >-
          vault_init_host is '{{ vault_init_host | default('') }}' with
          {{ vault_cluster_members | default([]) | length }} cluster member(s).
          A cluster must name its initializer, and that name must be in this play
          ({{ ansible_play_hosts_all | join(', ') }}). Otherwise the init register
          is empty on every host: the capture, the unseal and the durability gate
          all skip and the play reports success having initialized nothing.
        success_msg: "Initialization host resolves to {{ __vault_init_host_effective }}"

    - name: Assert the initialization capture destination is durable
      ansible.builtin.include_tasks:
        file: init-capture-durability.yml
      when: inventory_hostname == __vault_init_host_effective

    - name: Validate key shares and threshold
      ansible.builtin.assert:
        that:
          - vault_key_threshold | int >= 1
          - vault_key_threshold | int <= vault_key_shares | int
        fail_msg: >-
          vault_key_threshold ({{ vault_key_threshold }}) must be >= 1 and
          <= vault_key_shares ({{ vault_key_shares }}).
        success_msg: "Key shares and threshold are valid"

    - name: Reject audit-less auto-unseal combination
      ansible.builtin.assert:
        that:
          - (vault_hsm_enabled | bool) or (vault_init_unseal | bool) or not (vault_auto_unseal_enabled | bool)
        fail_msg: >-
          vault_init_unseal=false with vault_auto_unseal_enabled=true would
          auto-unseal Vault on boot with NO audit devices ever enabled (a
          forbidden end state). Enable vault_init_unseal (unseal + audit as
          part of init), or disable the boot-time auto-unseal service.
        success_msg: "Init/unseal/auto-unseal flag combination is valid"

    - name: Check Vault initialization status
      ansible.builtin.command:
        cmd: >-
          {{ vault_binary }} status -format=json
      register: __vault_status
      failed_when: false
      changed_when: false
      # `vault status` only reads. Without this, --check SKIPS it, and a skipped
      # command still carries rc=0 with an EMPTY stdout (measured, core 2.21.4),
      # so the parse below passes its rc gate and then from_json('') raises --
      # the rescue fires and reports an initialization failure that did not occur.
      check_mode: false
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_listener_port }}"
        VAULT_CACERT: "{{ vault_tls_ca_file }}"
        VAULT_CLIENT_CERT: "{{ __vault_client_cert }}"
        VAULT_CLIENT_KEY: "{{ __vault_client_key }}"

    - name: Parse Vault status
      ansible.builtin.set_fact:
        __vault_initialized: "{{ (__vault_status.stdout | from_json).initialized | default(false) }}"
      when: __vault_status.rc in [0, 1, 2]

    - name: Assert the initialization host is in this batch
      ansible.builtin.assert:
        that:
          # ansible_play_batch, NOT ansible_play_hosts: the latter is the whole
          # play even under serial, so it cannot detect the split it guards.
          - __vault_init_host_effective in ansible_play_batch
        fail_msg: >-
          This batch ({{ ansible_play_batch | join(', ') }}) does not contain the
          initialization host {{ __vault_init_host_effective }}, and Vault is not
          yet initialized. A serial or --limit run that separates them would
          initialize this batch's node into its own cluster.
        success_msg: "Initialization host is in this batch"
      when:
        - __vault_initialized is defined
        - not __vault_initialized | bool

    - name: Run vault operator init
      ansible.builtin.command:
        cmd: >-
          {{ vault_binary }} operator init
          -key-shares={{ vault_key_shares }}
          -key-threshold={{ vault_key_threshold }}
          -format=json
      register: __vault_init_output
      when:
        - inventory_hostname == __vault_init_host_effective
        - __vault_initialized is defined
        - not __vault_initialized | bool
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_listener_port }}"
        VAULT_CACERT: "{{ vault_tls_ca_file }}"
        VAULT_CLIENT_CERT: "{{ __vault_client_cert }}"
        VAULT_CLIENT_KEY: "{{ __vault_client_key }}"
      no_log: true
      changed_when: __vault_init_output.rc == 0

    # Under the default `linear` strategy every host reaches this point only after
    # the init host has finished `operator init`, so the shared register is
    # populated. `strategy: free` removes that barrier: a follower can arrive
    # first, read an empty register, and SKIP the unseal, the join wait and every
    # verification below -- init then succeeds on the other host and the play
    # reports success over a sealed, unjoined node. The condition lives entirely
    # in `when:` so the task renders no register content.
    - name: Fail when the init host has produced no key material for this node
      ansible.builtin.fail:
        msg: >-
          This node is not initialized, but the initialization host
          {{ __vault_init_host_effective }} has produced no init output for it to
          read. Either this play runs with `strategy: free`, which is unsupported
          for an HA bring-up because nothing orders the follower after the init
          host, or the cluster was already initialized and this node is a NEW
          peer -- adding a peer to a live cluster is day-2 and out of scope, and
          the existing unseal shares are not available to this run.
      when:
        # --check never runs `operator init`, so an empty register is the EXPECTED
        # state of a valid dry run. Without this the guard turns every greenfield
        # HA --check into a failure.
        - not ansible_check_mode
        - vault_cluster_members | default([]) | length > 0
        - inventory_hostname != __vault_init_host_effective
        - __vault_initialized is defined
        - not __vault_initialized | bool
        - __vault_init_source.stdout | default('') | length == 0

    # root:root 0600 in /etc/vault.d, which Phase 4 owns root:vault 0750:
    # the file is source'd by root (vault-unseal.service), and a root-owned
    # parent is what prevents any unprivileged account from replacing it
    # (directory write allows unlink/create regardless of file ownership).
    # Shares land on the node ONLY for the Shamir boot auto-unseal service
    # (root:root 0600 in /etc/vault.d, which Phase 4 owns root:vault 0750: the
    # file is source'd by root and a root-owned parent prevents replacement).
    # tokens.env holds shares only — the root token is never on the node (#34).
    - name: Store unseal shares on the node (for the boot auto-unseal service)
      ansible.builtin.template:
        src: tokens.env.j2
        dest: /etc/vault.d/tokens.env
        owner: root
        group: root
        mode: '0600'
      when:
        - __vault_init_source.stdout | default('') | length > 0
        - vault_auto_unseal_enabled | bool
        - not vault_hsm_enabled | bool
      no_log: true
      vars:
        __vault_init_data: "{{ __vault_init_source.stdout | from_json }}"

    # Per-file capture on the controller (delegate_to localhost). The root token
    # ALWAYS lands here (never on the node); shares/recovery keys one file each so
    # the operator can hand each to a distinct custodian. copy+content (never
    # shell) so key material is not exposed in argv/execve.
    - name: Create controller capture directory (per host — avoids cross-host key clobber)
      ansible.builtin.file:
        path: "{{ __vault_capture_host_dir }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      when: __vault_init_output is changed

    - name: Capture root token to the controller (never on the node)
      ansible.builtin.copy:
        content: "{{ (__vault_init_output.stdout | from_json).root_token }}\n"
        dest: "{{ __vault_capture_host_dir }}/root-token"
        mode: "{{ vault_init_capture_mode }}"
      delegate_to: localhost
      become: false
      no_log: true
      when: __vault_init_output is changed

    - name: Capture Shamir unseal shares to the controller (one key per file)
      ansible.builtin.copy:
        content: "{{ item }}\n"
        dest: "{{ __vault_capture_host_dir }}/unseal-key-{{ idx + 1 }}"
        mode: "{{ vault_init_capture_mode }}"
      delegate_to: localhost
      become: false
      no_log: true
      loop: "{{ (__vault_init_output.stdout | from_json).unseal_keys_b64 | default([]) }}"
      loop_control:
        index_var: idx
      when: __vault_init_output is changed

    - name: Capture HSM recovery keys to the controller (one key per file)
      ansible.builtin.copy:
        content: "{{ item }}\n"
        dest: "{{ __vault_capture_host_dir }}/recovery-key-{{ idx + 1 }}"
        mode: "{{ vault_init_capture_mode }}"
      delegate_to: localhost
      become: false
      no_log: true
      loop: "{{ (__vault_init_output.stdout | from_json).recovery_keys_b64 | default([]) }}"
      loop_control:
        index_var: idx
      when: __vault_init_output is changed

    # Unseal via the API (key in the request body), NOT `vault operator unseal
    # <key>` — the CLI form records each share in auditd execve argv on a STIG
    # host (issue #31). ansible.builtin.uri runs ON THE NODE (no delegate_to), so
    # 127.0.0.1 is the node's loopback, identical locus to the former command.
    # Leader first: a Shamir operator init leaves the node SEALED, and a sealed
    # node cannot serve the raft bootstrap challenge, so no follower can join
    # until this runs (#44).
    - name: Unseal the initialization host (Shamir — key in API body, never argv)
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ vault_listener_port }}/v1/sys/unseal"
        method: POST
        body_format: json
        body:
          key: "{{ item }}"
        ca_path: "{{ vault_tls_ca_file }}"
        client_cert: "{{ vault_tls_cert_file if (vault_tls_require_client_cert | bool) else omit }}"
        client_key: "{{ vault_tls_key_file if (vault_tls_require_client_cert | bool) else omit }}"
        status_code: [200]
      loop: "{{ (__vault_init_source.stdout | from_json).unseal_keys_b64[:vault_key_threshold] }}"
      when:
        - inventory_hostname == __vault_init_host_effective
        - __vault_init_source.stdout | default('') | length > 0
        - vault_init_unseal | bool
        - not (vault_hsm_enabled | bool)
      no_log: true          # body carries the key; response unusable for verify
      changed_when: true

    # A Shamir joiner reports initialized only once the leader is unsealed and the
    # join completes, so this sits between the two unseals. It runs under an HSM
    # seal as well: those nodes unseal THEMSELVES but they still have to JOIN, and
    # excluding them meant a follower with broken retry_join TLS or unreachable
    # peers stayed uninitialized while the play reported success. Under HSM the
    # gate is the seal type, not vault_init_unseal, which is the same pairing the
    # audit-enable tasks use.
    - name: Wait for this node to join the cluster
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ vault_listener_port }}/v1/sys/seal-status"
        method: GET
        ca_path: "{{ vault_tls_ca_file }}"
        client_cert: "{{ vault_tls_cert_file if (vault_tls_require_client_cert | bool) else omit }}"
        client_key: "{{ vault_tls_key_file if (vault_tls_require_client_cert | bool) else omit }}"
        status_code: [200]
      register: __vault_join_status
      until: __vault_join_status.json.initialized | default(false) | bool
      retries: 30
      delay: 2
      changed_when: false
      when:
        - vault_cluster_members | default([]) | length > 0
        - inventory_hostname != __vault_init_host_effective
        - __vault_init_source.stdout | default('') | length > 0
        - (vault_hsm_enabled | bool) or (vault_init_unseal | bool)
        - __vault_initialized is defined
        - not __vault_initialized | bool

    - name: Unseal the remaining cluster nodes (Shamir — key in API body, never argv)
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ vault_listener_port }}/v1/sys/unseal"
        method: POST
        body_format: json
        body:
          key: "{{ item }}"
        ca_path: "{{ vault_tls_ca_file }}"
        client_cert: "{{ vault_tls_cert_file if (vault_tls_require_client_cert | bool) else omit }}"
        client_key: "{{ vault_tls_key_file if (vault_tls_require_client_cert | bool) else omit }}"
        status_code: [200]
      loop: "{{ (__vault_init_source.stdout | from_json).unseal_keys_b64[:vault_key_threshold] }}"
      when:
        - inventory_hostname != __vault_init_host_effective
        - __vault_init_source.stdout | default('') | length > 0
        - vault_init_unseal | bool
        - not (vault_hsm_enabled | bool)
      no_log: true
      changed_when: true

    # Happy-path unseal verification (there is no such check elsewhere on the
    # success path — only audit-enable implicitly requires an unsealed Vault).
    # uri GET returns HTTP 200 sealed-or-not, avoiding the `vault status` rc-2 ->
    # rescue footgun. Seal status carries NO key material, so this is NOT no_log.
    - name: Verify Vault is unsealed after the Shamir threshold (seal status — no key material)
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ vault_listener_port }}/v1/sys/seal-status"
        method: GET
        ca_path: "{{ vault_tls_ca_file }}"
        client_cert: "{{ vault_tls_cert_file if (vault_tls_require_client_cert | bool) else omit }}"
        client_key: "{{ vault_tls_key_file if (vault_tls_require_client_cert | bool) else omit }}"
        status_code: [200]
      register: __vault_seal_status
      when:
        - __vault_init_source.stdout | default('') | length > 0
        - vault_init_unseal | bool
        - not (vault_hsm_enabled | bool)
      changed_when: false

    - name: Assert the unseal succeeded (fail fast if still sealed)
      ansible.builtin.assert:
        that:
          - not (__vault_seal_status.json.sealed | bool)
        success_msg: "Vault is unsealed (Shamir threshold reached via API)"
        fail_msg: "Vault is STILL SEALED after applying the threshold shares via the API"
      when:
        - __vault_init_source.stdout | default('') | length > 0
        - vault_init_unseal | bool
        - not (vault_hsm_enabled | bool)

    # Every task above keys on a node's OWN `initialized` flag. N nodes each
    # initialized separately -- N independent Vaults with N unseal key sets -- all
    # report initialized, so every task above skips and the play reports success
    # over a split cluster. That is the precise failure #44 exists to prevent and
    # nothing above detects it. cluster_id is the cheap cross-node identity.
    # LIMIT: seal-status carries cluster_id only while the node is UNSEALED, so a
    # cluster deliberately left sealed (vault_init_unseal=false) is not checked.
    - name: Read this node's cluster identity (seal status — no key material)
      ansible.builtin.uri:
        url: "https://127.0.0.1:{{ vault_listener_port }}/v1/sys/seal-status"
        method: GET
        ca_path: "{{ vault_tls_ca_file }}"
        client_cert: "{{ vault_tls_cert_file if (vault_tls_require_client_cert | bool) else omit }}"
        client_key: "{{ vault_tls_key_file if (vault_tls_require_client_cert | bool) else omit }}"
        status_code: [200]
      register: __vault_cluster_identity
      when: vault_cluster_members | default([]) | length > 0
      changed_when: false
      check_mode: false

    - name: Assert every cluster node reports the same Raft cluster
      ansible.builtin.assert:
        that:
          - __vault_this_cluster_id | length > 0
          - __vault_this_cluster_id == __vault_peer_cluster_id
        fail_msg: >-
          This node reports Raft cluster
          '{{ __vault_this_cluster_id | default('<none>') }}' while the
          initialization host {{ __vault_init_host_effective }} reports
          '{{ __vault_peer_cluster_id | default('<none>') }}'. Those are separate
          Vault clusters with separate unseal key sets, not one HA cluster:
          either retry_join never took effect, or these nodes were initialized
          independently before vault_cluster_members was set. An
          already-initialized node cannot be joined to another cluster -- destroy
          the Raft data directory on every node except the initialization host
          and re-run.
        success_msg: "Cluster identity matches the initialization host"
      vars:
        __vault_this_cluster_id: >-
          {{ __vault_cluster_identity.json.cluster_id | default('') }}
        __vault_peer_cluster_id: >-
          {{ hostvars[__vault_init_host_effective]['__vault_cluster_identity'].json.cluster_id
             | default('') }}
      when:
        - vault_cluster_members | default([]) | length > 0
        # Under serial, a follower batch processed BEFORE the init host has no
        # identity in that host's hostvars, and the comparison would fail on a
        # healthy cluster. ansible_play_batch, not ansible_play_hosts: the latter
        # is the whole play even under serial.
        - __vault_init_host_effective in ansible_play_batch
        - not (__vault_cluster_identity.json.sealed | default(true) | bool)

    # The two cases the comparison above cannot cover. They are WARNED, not failed:
    # a sealed cluster is the operator's stated desired state (vault_init_unseal
    # false), and failing it would make that option unusable on a cluster. Silence
    # was the defect -- a skipped check read as a passed one.
    - name: Warn that cluster identity could not be verified
      ansible.builtin.debug:
        msg: >-
          WARNING: cluster identity was NOT verified on this node
          ({{ "it is sealed, and seal-status carries cluster_id only while unsealed"
              if (__vault_cluster_identity.json.sealed | default(true) | bool)
              else "the initialization host is not in this batch" }}).
          Independently initialized nodes are indistinguishable from one HA cluster
          in this state. Confirm with `vault operator raft list-peers` on the
          initialization host once the cluster is unsealed: it must list every
          member of vault_cluster_members and nothing else.
      when:
        - vault_cluster_members | default([]) | length > 0
        - (__vault_cluster_identity.json.sealed | default(true) | bool)
          or (__vault_init_host_effective not in ansible_play_batch)

    - name: Enable file audit device
      ansible.builtin.command:
        cmd: >-
          {{ vault_binary }} audit enable file
          file_path={{ vault_log_dir }}/vault_audit.log
      when:
        - inventory_hostname == __vault_init_host_effective
        - __vault_init_source.stdout | default('') | length > 0
        - (vault_hsm_enabled | bool) or (vault_init_unseal | bool)
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_listener_port }}"
        VAULT_CACERT: "{{ vault_tls_ca_file }}"
        VAULT_CLIENT_CERT: "{{ __vault_client_cert }}"
        VAULT_CLIENT_KEY: "{{ __vault_client_key }}"
        VAULT_TOKEN: "{{ (__vault_init_output.stdout | from_json).root_token }}"
      no_log: true
      changed_when: true

    - name: Enable syslog audit device
      ansible.builtin.command:
        cmd: >-
          {{ vault_binary }} audit enable syslog
          tag=vault facility=LOCAL1
      when:
        - inventory_hostname == __vault_init_host_effective
        - __vault_init_source.stdout | default('') | length > 0
        - (vault_hsm_enabled | bool) or (vault_init_unseal | bool)
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_listener_port }}"
        VAULT_CACERT: "{{ vault_tls_ca_file }}"
        VAULT_CLIENT_CERT: "{{ __vault_client_cert }}"
        VAULT_CLIENT_KEY: "{{ __vault_client_key }}"
        VAULT_TOKEN: "{{ (__vault_init_output.stdout | from_json).root_token }}"
      no_log: true
      changed_when: true

    - name: Warn that Vault was left sealed (audit devices not enabled)
      ansible.builtin.debug:
        msg: >-
          WARNING: Vault initialized but left SEALED (vault_init_unseal=false).
          Audit devices were NOT enabled. Run 'vault operator unseal' with the
          threshold shares, then enable file and syslog audit devices manually.
          {{ "This is an HA cluster, so the FOLLOWERS ARE ALSO NOT JOINED: a
          sealed leader cannot serve the Raft bootstrap challenge, so retry_join
          keeps retrying until the leader is unsealed by hand. Unseal the
          initialization host FIRST, then the rest."
          if (vault_cluster_members | default([]) | length > 0)
          else "" }}
      when:
        - __vault_init_source.stdout | default('') | length > 0
        - not (vault_init_unseal | bool)
        - not (vault_hsm_enabled | bool)

  rescue:
    - name: Re-check Vault status for failure context
      ansible.builtin.command:
        cmd: "{{ vault_binary }} status -format=json"
      register: __vault_status_rescue
      failed_when: false
      changed_when: false
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_listener_port }}"
        VAULT_CACERT: "{{ vault_tls_ca_file }}"
        VAULT_CLIENT_CERT: "{{ __vault_client_cert }}"
        VAULT_CLIENT_KEY: "{{ __vault_client_key }}"

    - name: Surface Vault initialization failure state
      vars:
        # Defensive: a dead/refused Vault leaves stdout empty OR non-JSON.
        # Parse ONLY when status returned JSON (rc 0=unsealed, 2=sealed) and
        # stdout is non-empty; else {} so the message still renders ('unknown').
        __status: "{{ (__vault_status_rescue.stdout | from_json) if ((__vault_status_rescue.rc | int) in [0, 2] and (__vault_status_rescue.stdout | default('') | length) > 0) else {} }}"
      ansible.builtin.fail:
        msg: >-
          Vault initialization FAILED at task
          '{{ ansible_failed_task.name | default('unknown') }}'. Current state:
          initialized={{ __status.initialized | default('unknown') }},
          sealed={{ __status.sealed | default('unknown') }}
          (Vault may be down if 'unknown'). If init ran, the root token and
          unseal/recovery shares were captured to the controller directory
          {{ __vault_capture_host_dir | default('the configured vault_init_capture_dir') }}
          (and shares also to /etc/vault.d/tokens.env if vault_auto_unseal_enabled).
          Next: unseal manually and enable audit devices, or destroy the node and re-initialize.

###############################################################################
# Enable auto-unseal service (after init completes).
# The [Install] link repair is STATE-based, not notify-based: a handler
# queued on unit-file change is discarded if the play aborts before
# flush, and `enabled: true` is a no-op on already-enabled units — so a
# missing vault.service.wants link would otherwise never heal on
# upgraded hosts (review round 6). reenable rebuilds all [Install]
# links from the on-disk unit file. The link is HEALTHY only when it is
# a symlink resolving to the canonical unit fragment — a stale symlink to
# another unit, or a regular file, must trigger repair (a bare exists
# check would skip it and Vault would start sealed; codex).
###############################################################################
- name: Check vault.service.wants link for the unseal unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ vault_service_name }}.service.wants/vault-unseal.service"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __vault_unseal_wants
  when:
    - vault_auto_unseal_enabled | bool
    - not vault_hsm_enabled | bool

- name: Repair unseal unit Install links (reenable)
  ansible.builtin.command:
    cmd: systemctl reenable vault-unseal.service
  changed_when: true
  when:
    - vault_auto_unseal_enabled | bool
    - not vault_hsm_enabled | bool
    - >-
      not (
        (__vault_unseal_wants.stat.islnk | default(false))
        and (__vault_unseal_wants.stat.lnk_source | default('')
             == '/usr/lib/systemd/system/vault-unseal.service')
      )

- name: Enable vault-unseal.service
  ansible.builtin.systemd_service:
    name: vault-unseal.service
    enabled: true
    daemon_reload: true
  when:
    - vault_auto_unseal_enabled | bool
    - not vault_hsm_enabled | bool

###############################################################################
# Secure-default upgrade safety (issue #34).
# When boot auto-unseal is OFF (the secure default), stop auto-unsealing on
# boot and warn about any legacy on-node key material a pre-#34 install left in
# tokens.env. The role does NOT auto-delete tokens.env — on an already-
# initialized node it may be the ONLY copy of the keys (init does not re-run,
# so nothing re-captures them). The operator must preserve then remove it.
###############################################################################
- name: Check for the boot auto-unseal unit (secure default)
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/vault-unseal.service
    get_checksum: false
    get_attributes: false
  register: __vault_unseal_unit
  when: not (vault_auto_unseal_enabled | bool)

- name: Disable the boot auto-unseal service (secure default)
  ansible.builtin.systemd_service:
    name: vault-unseal.service
    enabled: false
    daemon_reload: true
  when:
    - not (vault_auto_unseal_enabled | bool)
    - __vault_unseal_unit.stat.exists | default(false)

- name: Check for legacy on-node key material (secure default)
  ansible.builtin.stat:
    path: /etc/vault.d/tokens.env
    get_checksum: false
    get_attributes: false
  register: __vault_legacy_tokens
  when: not (vault_auto_unseal_enabled | bool)

- name: Warn about legacy on-node key material (secure default)
  ansible.builtin.debug:
    msg: >-
      WARNING: /etc/vault.d/tokens.env exists on this node but boot auto-unseal
      is disabled (secure default). It holds unseal shares (and, if written by a
      pre-#34 role, the root token). The role does NOT delete it automatically —
      it may be your only copy. Preserve the keys to an approved store, then
      remove /etc/vault.d/tokens.env from the node.
  when:
    - not (vault_auto_unseal_enabled | bool)
    - __vault_legacy_tokens.stat.exists | default(false)
