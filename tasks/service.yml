---
###############################################################################
# Filename: tasks/service.yml
# Role: ansible-role-vault
# Summary: Enable/start Vault service, optional initialization and unseal
# Classification: UNCLASSIFIED
###############################################################################

###############################################################################
# Service Startup
###############################################################################
# service_start: needs a live Vault; molecule skips this tag (the rest of
# service.yml — incl. the state-based [Install]-link repair — still runs).
- name: Enable and start Vault service
  ansible.builtin.systemd_service:
    name: "{{ vault_service_name }}"
    enabled: true
    state: started
    daemon_reload: true
  tags:
    - service_start

- name: Wait for Vault to be listening
  ansible.builtin.wait_for:
    port: "{{ vault_listener_port }}"
    host: 127.0.0.1
    timeout: 30
    delay: 2
  tags:
    - service_start

###############################################################################
# Vault Initialization (optional, for greenfield deployments)
###############################################################################
- name: Initialize Vault
  when: vault_initialize | bool
  block:
    - name: Validate initialization handoff destination
      ansible.builtin.assert:
        that:
          - vault_init_store_target | bool or vault_init_controller_capture_enabled | bool
          - not vault_init_controller_capture_enabled | bool or vault_init_controller_output_path | length > 0
          - not vault_init_controller_capture_enabled | bool or vault_init_controller_output_path is match('^/')
        fail_msg: >-
          Vault initialization is enabled, but no valid initialization handoff
          destination is configured. Enable vault_init_store_target, or enable
          vault_init_controller_capture_enabled and set
          vault_init_controller_output_path to an absolute controller path.
        success_msg: "Vault initialization handoff destination configured"

    - name: Reject audit-less auto-unseal combination
      ansible.builtin.assert:
        that:
          - (vault_hsm_enabled | bool) or (vault_init_unseal | bool) or not (vault_auto_unseal_enabled | bool)
        fail_msg: >-
          vault_init_unseal=false with vault_auto_unseal_enabled=true would
          auto-unseal Vault on boot with NO audit devices ever enabled (a
          forbidden end state). Enable vault_init_unseal (unseal + audit as
          part of init), or disable the boot-time auto-unseal service.
        success_msg: "Init/unseal/auto-unseal flag combination is valid"

    - name: Check Vault initialization status
      ansible.builtin.command:
        cmd: >-
          {{ vault_binary }} status -format=json
      register: __vault_status
      failed_when: false
      changed_when: false
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_listener_port }}"
        VAULT_CACERT: "{{ vault_tls_ca_file }}"

    - name: Parse Vault status
      ansible.builtin.set_fact:
        __vault_initialized: "{{ (__vault_status.stdout | from_json).initialized | default(false) }}"
      when: __vault_status.rc in [0, 1, 2]

    - name: Run vault operator init
      ansible.builtin.command:
        cmd: >-
          {{ vault_binary }} operator init
          -key-shares={{ vault_key_shares }}
          -key-threshold={{ vault_key_threshold }}
          -format=json
      register: __vault_init_output
      when:
        - __vault_initialized is defined
        - not __vault_initialized | bool
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_listener_port }}"
        VAULT_CACERT: "{{ vault_tls_ca_file }}"
      no_log: true
      changed_when: __vault_init_output.rc == 0

    # root:root 0600 in /etc/vault.d, which Phase 4 owns root:vault 0750:
    # the file is source'd by root (vault-unseal.service), and a root-owned
    # parent is what prevents any unprivileged account from replacing it
    # (directory write allows unlink/create regardless of file ownership).
    - name: Store unseal keys and root token
      ansible.builtin.template:
        src: tokens.env.j2
        dest: /etc/vault.d/tokens.env
        owner: root
        group: root
        mode: '0600'
      when:
        - __vault_init_output is changed
        - vault_init_store_target | bool
      no_log: true
      vars:
        __vault_init_data: "{{ __vault_init_output.stdout | from_json }}"

    - name: Create controller directory for Vault init capture
      ansible.builtin.file:
        path: "{{ vault_init_controller_output_path | dirname }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false
      when:
        - __vault_init_output is changed
        - vault_init_controller_capture_enabled | bool
      no_log: true

    - name: Capture Vault init output on controller
      ansible.builtin.copy:
        content: "{{ __vault_init_output.stdout }}\n"
        dest: "{{ vault_init_controller_output_path }}"
        mode: "{{ vault_init_controller_output_mode }}"
      delegate_to: localhost
      become: false
      when:
        - __vault_init_output is changed
        - vault_init_controller_capture_enabled | bool
      no_log: true

    - name: Unseal Vault after initialization (Shamir)
      ansible.builtin.command:
        cmd: "{{ vault_binary }} operator unseal {{ item }}"
      loop: "{{ (__vault_init_output.stdout | from_json).unseal_keys_b64[:vault_key_threshold] }}"
      when:
        - __vault_init_output is changed
        - vault_init_unseal | bool
        - not (vault_hsm_enabled | bool)
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_listener_port }}"
        VAULT_CACERT: "{{ vault_tls_ca_file }}"
      no_log: true
      changed_when: true

    - name: Enable file audit device
      ansible.builtin.command:
        cmd: >-
          {{ vault_binary }} audit enable file
          file_path={{ vault_log_dir }}/vault_audit.log
      when:
        - __vault_init_output is changed
        - (vault_hsm_enabled | bool) or (vault_init_unseal | bool)
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_listener_port }}"
        VAULT_CACERT: "{{ vault_tls_ca_file }}"
        VAULT_TOKEN: "{{ (__vault_init_output.stdout | from_json).root_token }}"
      no_log: true
      changed_when: true

    - name: Enable syslog audit device
      ansible.builtin.command:
        cmd: >-
          {{ vault_binary }} audit enable syslog
          tag=vault facility=LOCAL1
      when:
        - __vault_init_output is changed
        - (vault_hsm_enabled | bool) or (vault_init_unseal | bool)
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_listener_port }}"
        VAULT_CACERT: "{{ vault_tls_ca_file }}"
        VAULT_TOKEN: "{{ (__vault_init_output.stdout | from_json).root_token }}"
      no_log: true
      changed_when: true

    - name: Warn that Vault was left sealed (audit devices not enabled)
      ansible.builtin.debug:
        msg: >-
          WARNING: Vault initialized but left SEALED (vault_init_unseal=false).
          Audit devices were NOT enabled. Run 'vault operator unseal' with the
          threshold shares, then enable file and syslog audit devices manually.
      when:
        - __vault_init_output is changed
        - not (vault_init_unseal | bool)
        - not (vault_hsm_enabled | bool)

  rescue:
    - name: Re-check Vault status for failure context
      ansible.builtin.command:
        cmd: "{{ vault_binary }} status -format=json"
      register: __vault_status_rescue
      failed_when: false
      changed_when: false
      environment:
        VAULT_ADDR: "https://127.0.0.1:{{ vault_listener_port }}"
        VAULT_CACERT: "{{ vault_tls_ca_file }}"

    - name: Surface Vault initialization failure state
      vars:
        # Defensive: a dead/refused Vault leaves stdout empty OR non-JSON.
        # Parse ONLY when status returned JSON (rc 0=unsealed, 2=sealed) and
        # stdout is non-empty; else {} so the message still renders ('unknown').
        __status: "{{ (__vault_status_rescue.stdout | from_json) if ((__vault_status_rescue.rc | int) in [0, 2] and (__vault_status_rescue.stdout | default('') | length) > 0) else {} }}"
      ansible.builtin.fail:
        msg: >-
          Vault initialization FAILED at task
          '{{ ansible_failed_task.name | default('unknown') }}'. Current state:
          initialized={{ __status.initialized | default('unknown') }},
          sealed={{ __status.sealed | default('unknown') }}
          (Vault may be down if 'unknown'). If init ran, key material is at
          {{ '/etc/vault.d/tokens.env' if vault_init_store_target | bool
             else (vault_init_controller_output_path | default('the configured controller path')) }}.
          Next: unseal manually and enable audit devices, or destroy the node and re-initialize.

###############################################################################
# Enable auto-unseal service (after init completes).
# The [Install] link repair is STATE-based, not notify-based: a handler
# queued on unit-file change is discarded if the play aborts before
# flush, and `enabled: true` is a no-op on already-enabled units — so a
# missing vault.service.wants link would otherwise never heal on
# upgraded hosts (review round 6). reenable rebuilds all [Install]
# links from the on-disk unit file. The link is HEALTHY only when it is
# a symlink resolving to the canonical unit fragment — a stale symlink to
# another unit, or a regular file, must trigger repair (a bare exists
# check would skip it and Vault would start sealed; codex).
###############################################################################
- name: Check vault.service.wants link for the unseal unit
  ansible.builtin.stat:
    path: "/etc/systemd/system/{{ vault_service_name }}.service.wants/vault-unseal.service"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: __vault_unseal_wants
  when:
    - vault_auto_unseal_enabled | bool
    - not vault_hsm_enabled | bool

- name: Repair unseal unit Install links (reenable)
  ansible.builtin.command:
    cmd: systemctl reenable vault-unseal.service
  changed_when: true
  when:
    - vault_auto_unseal_enabled | bool
    - not vault_hsm_enabled | bool
    - >-
      not (
        (__vault_unseal_wants.stat.islnk | default(false))
        and (__vault_unseal_wants.stat.lnk_source | default('')
             == '/usr/lib/systemd/system/vault-unseal.service')
      )

- name: Enable vault-unseal.service
  ansible.builtin.systemd_service:
    name: vault-unseal.service
    enabled: true
    daemon_reload: true
  when:
    - vault_auto_unseal_enabled | bool
    - not vault_hsm_enabled | bool
