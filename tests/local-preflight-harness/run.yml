---
# Local execution of the #79/#80 gates -- the cases molecule would run in CI,
# minus the container. Each case that must FIRE is wrapped in block/rescue and
# asserts the gate's OWN message; each case that must PASS runs bare.
- name: Exercise the new preflight gates
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    fx: "{{ playbook_dir }}/fixtures"

  tasks:
    # The DNS cases below override the fqdn FACT per include. With
    # INJECT_FACTS_AS_VARS gone (#78) the gate reads ansible_facts['fqdn'], so
    # `ansible_fqdn:` in vars no longer reaches it and every case would silently
    # exercise this machine's real name instead. Overriding ansible_facts in
    # vars self-references ("Recursive loop detected"); replacing the whole dict
    # loses every other fact. Snapshotting once into a plain var breaks the
    # self-reference and keeps the per-include scoping these cases depend on.
    - name: Snapshot the real facts so cases can override one at a time
      ansible.builtin.set_fact:
        __real_facts: "{{ ansible_facts }}"

    - name: Stage controller-side fixtures
      block:
        - name: Fixture directory
          ansible.builtin.file:
            path: "{{ fx }}"
            state: directory
            mode: '0755'
        - name: Readable sources
          ansible.builtin.copy:
            content: "mock\n"
            dest: "{{ fx }}/{{ item }}"
            mode: '0644'
          loop: [good.crt, good.key, good.ca]
        - name: A directory where a certificate is expected
          ansible.builtin.file:
            path: "{{ fx }}/isdir.crt"
            state: directory
            mode: '0755'
        - name: An unreadable source (mode 0000)
          # Meaningful only as a non-root user, which is the normal case for a
          # developer machine and NOT the case in molecule's root container --
          # os.access() returns True for root regardless of mode. Skipped rather
          # than silently vacuous when running as root.
          ansible.builtin.copy:
            content: "mock\n"
            dest: "{{ fx }}/unreadable.crt"
            mode: '0000'
          when: lookup('env', 'USER') != 'root'

        - name: FIPS sysctl fixtures (#66)
          # The gate reads __vault_fips_path, so every FAILURE branch is
          # reachable without a FIPS-capable kernel. Only the happy path needs
          # one, and the live lab host covers that.
          ansible.builtin.copy:
            content: "{{ item.c }}\n"
            dest: "{{ fx }}/{{ item.n }}"
            mode: '0644'
          loop:
            - {n: fips_on, c: '1'}
            - {n: fips_off, c: '0'}
            - {n: fips_garbage, c: 'banana'}
          loop_control: {label: "{{ item.n }}"}

        - name: An unreadable FIPS sysctl (mode 0000)
          # Same root caveat as unreadable.crt above: os.access() returns True
          # for root regardless of mode, so as root this fixture proves nothing.
          ansible.builtin.copy:
            content: "1\n"
            dest: "{{ fx }}/fips_noread"
            mode: '0000'
          when: lookup('env', 'USER') != 'root'

        - name: SAN fixture CA + certs (#85)
          # Generated at run time, never committed: no key material in the repo
          # and no expiry to rot. Each cert isolates ONE property of the SAN
          # contract so a case cannot pass for the wrong reason.
          ansible.builtin.shell:
            chdir: "{{ fx }}"
            cmd: |
              set -e
              umask 077
              openssl req -x509 -newkey rsa:2048 -sha256 -days 2 -nodes \
                -keyout san-ca.key -out san-ca.crt -subj "/CN=SAN Fixture CA" 2>/dev/null
              mk() {  # $1=name  $2=SAN string
                openssl req -newkey rsa:2048 -sha256 -nodes -keyout "$1.key" \
                  -out "$1.csr" -subj "/CN=vault.fixture.test" 2>/dev/null
                printf "subjectAltName=%s\nbasicConstraints=CA:FALSE\n" "$2" > "$1.ext"
                openssl x509 -req -in "$1.csr" -CA san-ca.crt -CAkey san-ca.key \
                  -CAcreateserial -out "$1.crt" -days 2 -sha256 -extfile "$1.ext" 2>/dev/null
              }
              mk san-good      "DNS:vault.fixture.test,IP:127.0.0.1"
              mk san-noloop    "DNS:vault.fixture.test,IP:10.0.0.5"
              mk san-nodns     "IP:127.0.0.1"
              mk san-wrongtype "DNS:10.0.0.5,IP:127.0.0.1"
              mk san-upper     "DNS:VAULT.FIXTURE.TEST,IP:127.0.0.1"
              mk san-wild      "DNS:*.fixture.test,IP:127.0.0.1"
              mk san-v6        "IP:127.0.0.1,IP:2001:db8::10"
            creates: "{{ fx }}/san-good.crt"
          changed_when: true

        - name: A symlinked source (certmonger shape)
          ansible.builtin.file:
            src: "{{ fx }}/good.crt"
            dest: "{{ fx }}/link.crt"
            state: link
            force: true

    ###########################################################################
    # san (#85) - the certificate must carry the SANs the role's OWN callers
    # need. Measured on a live host: with no 127.0.0.1 IP SAN, a loopback
    # caller gets "x509: certificate is valid for 10.110.11.55, not 127.0.0.1"
    # while the SAME cert works fine via the FQDN -- so the certificate is not
    # invalid, it is merely unusable by tasks/service.yml and the unseal unit.
    # That failure lands at service start, after the host is fully mutated.
    ###########################################################################
    - name: "S1 PASSES - FQDN DNS SAN and loopback IP SAN both present"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/san.yml
      vars:
        vault_manage_tls: false
        vault_tls_cert_file: "{{ fx }}/san-good.crt"
        vault_api_addr: "https://vault.fixture.test:8200"

    - name: "S2 FIRES - no 127.0.0.1 IP SAN"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/san.yml
          vars:
            vault_manage_tls: false
            vault_tls_cert_file: "{{ fx }}/san-noloop.crt"
            vault_api_addr: "https://vault.fixture.test:8200"
        - ansible.builtin.fail: {msg: "S2 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('127.0.0.1')
            success_msg: "S2: missing loopback IP SAN caught before mutation"

    - name: "S3 FIRES - advertised hostname has no matching DNS SAN"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/san.yml
          vars:
            vault_manage_tls: false
            vault_tls_cert_file: "{{ fx }}/san-nodns.crt"
            vault_api_addr: "https://vault.fixture.test:8200"
        - ansible.builtin.fail: {msg: "S3 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              # Literal gate text, not the hostname: the name is interpolated
              # from a variable, so searching for it could match incidental
              # output and pass for the wrong reason (caught by
              # assert-rescue-patterns-are-emittable.sh).
              # The CN arm's own literal text. Asserting 'does not serve' here
              # would search for a different arm's wording and could only fail.
              - ansible_failed_result.msg | default('') is search('carries no DNS SAN')
              - ansible_failed_result.msg | default('') is search('Go 1.15')
            success_msg: "S3: CN-only cert rejected (Go ignores CN; openssl would accept)"

    - name: "S4 FIRES - address advertised but encoded as a DNS SAN, not an IP SAN"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/san.yml
          vars:
            vault_manage_tls: false
            vault_tls_cert_file: "{{ fx }}/san-wrongtype.crt"
            vault_api_addr: "https://10.0.0.5:8200"
        - ansible.builtin.fail: {msg: "S4 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('IP SAN')
            success_msg: "S4: DNS:10.0.0.5 does not validate https://10.0.0.5"

    - name: "S5 PASSES - DNS names are case-insensitive per RFC 4343"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/san.yml
      vars:
        vault_manage_tls: false
        vault_tls_cert_file: "{{ fx }}/san-upper.crt"
        vault_api_addr: "https://vault.fixture.test:8200"

    - name: "S6 PASSES - a wildcard DNS SAN covers one label (RFC 6125)"
      # The case the first revision got wrong: DNS:*.fixture.test is valid for
      # vault.fixture.test under every TLS client, and string equality rejected
      # it. Verification is delegated to `openssl -checkhost`, not reimplemented.
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/san.yml
      vars:
        vault_manage_tls: false
        vault_tls_cert_file: "{{ fx }}/san-wild.crt"
        vault_api_addr: "https://vault.fixture.test:8200"

    - name: "S7 FIRES - a wildcard does NOT cross a label boundary"
      # The negative half of S6. Without it, a gate that accepted any name
      # ending in the wildcard's suffix would still pass S6.
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/san.yml
          vars:
            vault_manage_tls: false
            vault_tls_cert_file: "{{ fx }}/san-wild.crt"
            vault_api_addr: "https://a.b.fixture.test:8200"
        - ansible.builtin.fail: {msg: "S7 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('does not serve')
            success_msg: "S7: *.fixture.test does not cover a.b.fixture.test"

    - name: "S8 PASSES - a bracketed IPv6 vault_api_addr"
      # https://[2001:db8::10]:8200 is the documented URL form. A regex that
      # stripped from the first colon produced '[2001' and then looked for a
      # DNS SAN of that text; urlsplit returns the bracket-free address.
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/san.yml
      vars:
        vault_manage_tls: false
        vault_tls_cert_file: "{{ fx }}/san-v6.crt"
        vault_api_addr: "https://[2001:db8::10]:8200"

    ###########################################################################
    # fips (#66) - the probe must ASSERT, never crash, and must distinguish
    # "FIPS is off" from "FIPS state could not be observed". Those are
    # materially different findings for SC-13. Before #66 an absent sysctl
    # killed the play at the probe with "File not found", so the gate's
    # remediation text was unreachable on exactly the hosts that needed it.
    ###########################################################################
    - name: "F1 PASSES - sysctl reads 1"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/fips.yml
      vars: {__vault_fips_path: "{{ fx }}/fips_on"}

    - name: "F2 FIRES - sysctl reads 0"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/fips.yml
          vars: {__vault_fips_path: "{{ fx }}/fips_off"}
        - ansible.builtin.fail: {msg: "F2 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('not running in FIPS mode')
            success_msg: "F2: disabled -> enable-and-reboot remediation"

    - name: "F3 FIRES - sysctl absent, and is NOT reported as 'off'"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/fips.yml
          vars: {__vault_fips_path: "{{ fx }}/fips_absent"}
        - ansible.builtin.fail: {msg: "F3 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              # The discriminating half: it must NOT claim FIPS is off, because
              # an absent sysctl does not establish that.
              - ansible_failed_result.msg | default('') is search('exposes no FIPS sysctl')
              - ansible_failed_result.msg | default('') is not search('not running in FIPS mode')
            success_msg: "F3: absent -> unobservable, distinguished from off"

    - name: "F4 FIRES - sysctl reads something that is neither 1 nor 0"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/fips.yml
          vars: {__vault_fips_path: "{{ fx }}/fips_garbage"}
        - ansible.builtin.fail: {msg: "F4 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search("neither '1' nor '0'")
            success_msg: "F4: unexpected value -> unverified, not assumed off"

    - name: "F5 FIRES - sysctl unreadable is a PRIVILEGE finding, not a FIPS one"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/fips.yml
          vars: {__vault_fips_path: "{{ fx }}/fips_noread"}
        - ansible.builtin.fail: {msg: "F5 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('privilege problem')
            success_msg: "F5: unreadable -> become: true, not a FIPS failure"
      when: lookup('env', 'USER') != 'root'

    ###########################################################################
    # managed_tls (#80)
    ###########################################################################
    - name: "M1 FIRES - source unset"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/managed_tls.yml
          vars: {vault_manage_tls: true, vault_tls_source: file,
                 vault_tls_src_cert: "", vault_tls_src_key: "{{ fx }}/good.key",
                 vault_tls_src_ca: "{{ fx }}/good.ca"}
        - ansible.builtin.fail: {msg: "M1 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([]) | map(attribute='msg', default='')
                | join(' ') is search('vault_tls_src_cert is empty')
            success_msg: "M1 fired on the unset source"

    - name: "M2 FIRES - source is NULL (the group_vars shape)"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/managed_tls.yml
          vars: {vault_manage_tls: true, vault_tls_source: file,
                 vault_tls_src_cert: null, vault_tls_src_key: "{{ fx }}/good.key",
                 vault_tls_src_ca: "{{ fx }}/good.ca"}
        - ansible.builtin.fail: {msg: "M2 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([]) | map(attribute='msg', default='')
                | join(' ') is search('is empty')
            success_msg: "M2 fired with the gate's message, not a Jinja type error"

    - name: "M3 FIRES - absolute source absent on the controller"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/managed_tls.yml
          vars: {vault_manage_tls: true, vault_tls_source: file,
                 vault_tls_src_cert: "{{ fx }}/absent.crt",
                 vault_tls_src_key: "{{ fx }}/good.key", vault_tls_src_ca: "{{ fx }}/good.ca"}
        - ansible.builtin.fail: {msg: "M3 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([]) | map(attribute='msg', default='')
                | join(' ') is search('does not exist on the Ansible controller')
            success_msg: "M3 fired and pointed at the controller"

    - name: "M4 FIRES - absolute source is a directory"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/managed_tls.yml
          vars: {vault_manage_tls: true, vault_tls_source: file,
                 vault_tls_src_cert: "{{ fx }}/isdir.crt",
                 vault_tls_src_key: "{{ fx }}/good.key", vault_tls_src_ca: "{{ fx }}/good.ca"}
        - ansible.builtin.fail: {msg: "M4 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([]) | map(attribute='msg', default='')
                | join(' ') is search('not a regular file')
            success_msg: "M4 fired on the file type"

    - name: "M5 FIRES - vault_pki with empty mount"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/managed_tls.yml
          vars: {vault_manage_tls: true, vault_tls_source: vault_pki,
                 vault_pki_mount: "", vault_pki_role: listener}
        - ansible.builtin.fail: {msg: "M5 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([]) | map(attribute='msg', default='')
                | join(' ') is search('vault_pki_mount is empty')
            success_msg: "M5 fired on the PKI mount"

    - name: "M6 PASSES - relative source is reported, not rejected (the README shape)"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/managed_tls.yml
      vars: {vault_manage_tls: true, vault_tls_source: file,
             vault_tls_src_cert: "files/vault-tls.crt",
             vault_tls_src_key: "{{ fx }}/good.key", vault_tls_src_ca: "{{ fx }}/good.ca"}

    - name: "M6 assert - exactly one stat skipped, and the gate did not fail"
      ansible.builtin.assert:
        that:
          - __vault_managed_tls_stat.results | selectattr('skipped', 'defined') | list | length == 1
          - __vault_managed_tls_readable.results | length == 2
          # The report must have FIRED for exactly the relative source. Without
          # this the whole report task is deletable with the suite green, while
          # three artifacts promise relative sources are reported.
          - __vault_managed_tls_unverifiable.results | default([])
            | rejectattr('skipped', 'defined') | list | length == 1
        success_msg: "M6: relative source skipped by the stat, reported, other two verified"

    - name: "M9 FIRES - absolute source exists but is not readable"
      when: lookup('env', 'USER') != 'root'
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/managed_tls.yml
          vars: {vault_manage_tls: true, vault_tls_source: file,
                 vault_tls_src_cert: "{{ fx }}/unreadable.crt",
                 vault_tls_src_key: "{{ fx }}/good.key", vault_tls_src_ca: "{{ fx }}/good.ca"}
        - ansible.builtin.fail: {msg: "M9 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.results | default([]) | map(attribute='msg', default='')
                | join(' ') is search('is not readable by the')
            success_msg: "M9 fired on an unreadable source"

    - name: "M7 PASSES - symlinked source accepted (follow: true)"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/managed_tls.yml
      vars: {vault_manage_tls: true, vault_tls_source: file,
             vault_tls_src_cert: "{{ fx }}/link.crt",
             vault_tls_src_key: "{{ fx }}/good.key", vault_tls_src_ca: "{{ fx }}/good.ca"}

    - name: "M8 DID NOT FIRE - operator stages TLS"
      ansible.builtin.include_role:
        name: ansible-role-vault
        tasks_from: preflight/managed_tls.yml
      vars: {vault_manage_tls: false, vault_tls_source: file,
             vault_tls_src_cert: "", vault_tls_src_key: "", vault_tls_src_ca: ""}

    - name: "M8 assert - marker skipped"
      ansible.builtin.assert:
        that:
          - __vault_managed_tls_marker.skipped | default(false)
        success_msg: "M8: gate suppressed, not merely non-failing"

    ###########################################################################
    # dns (#79)
    ###########################################################################
    - name: "D1 FIRES - loopback only, addresses derive from the name"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/dns.yml
          vars: {ansible_facts: "{{ __real_facts | combine({'fqdn': 'dns-loopback-fixture.test'}) }}",
                 vault_api_addr: "https://dns-loopback-fixture.test:8200",
                 vault_cluster_addr: "https://dns-loopback-fixture.test:8201"}
        - ansible.builtin.fail: {msg: "D1 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('resolves to no reachable address')
              - ansible_failed_result.msg | default('') is search('127.0.1.1')
            success_msg: "D1 fired and named the loopback answer"

    - name: "D2 FIRES - link-local only"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/dns.yml
          vars: {ansible_facts: "{{ __real_facts | combine({'fqdn': 'dns-linklocal-fixture.test'}) }}",
                 vault_api_addr: "https://dns-linklocal-fixture.test:8200",
                 vault_cluster_addr: "https://dns-linklocal-fixture.test:8201"}
        - ansible.builtin.fail: {msg: "D2 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('169.254.7.7')
            success_msg: "D2 fired on link-local"

    - name: "D3 FIRES - name does not resolve at all"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/dns.yml
          vars: {ansible_facts: "{{ __real_facts | combine({'fqdn': 'dns-absent-fixture.test'}) }}",
                 vault_api_addr: "https://dns-absent-fixture.test:8200",
                 vault_cluster_addr: "https://dns-absent-fixture.test:8201"}
        - ansible.builtin.fail: {msg: "D3 did not fire"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('does not resolve at all')
            success_msg: "D3 fired with the no-resolution branch"

    - name: "D4 FIRES - vault_pki arms the gate even with pinned addresses (C5)"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/dns.yml
          vars: {ansible_facts: "{{ __real_facts | combine({'fqdn': 'dns-loopback-fixture.test'}) }}",
                 vault_api_addr: "https://10.99.0.1:8200",
                 vault_cluster_addr: "https://10.99.0.1:8201",
                 vault_manage_tls: true, vault_tls_source: vault_pki}
        - ansible.builtin.fail: {msg: "D4 did not fire -- the PKI arm is not wired"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('vault_pki')
            success_msg: "D4 fired for the PKI common-name reason"

    - name: "D8 FIRES - IPv4-mapped loopback (::ffff:127.0.0.1) is not reachable"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/dns.yml
          vars: {ansible_facts: "{{ __real_facts | combine({'fqdn': 'dns-mapped-loopback-fixture.test'}) }}",
                 vault_api_addr: "https://dns-mapped-loopback-fixture.test:8200",
                 vault_cluster_addr: "https://dns-mapped-loopback-fixture.test:8201"}
        - ansible.builtin.fail: {msg: "D8 did not fire -- mapped loopback counted as reachable"}
      rescue:
        - ansible.builtin.assert:
            that:
              - ansible_failed_result.msg | default('') is search('resolves to no reachable address')
            success_msg: "D8 fired: loopback in IPv6 clothing is still loopback"

    - name: "D9 FIRES - fe90:: is link-local (fe80::/10 is ten bits, not sixteen)"
      block:
        - ansible.builtin.include_role:
            name: ansible-role-vault
            tasks_from: preflight/dns.yml
