---
###############################################################################
# Filename: tests/preflight-only.yml
# Role: ansible-role-vault
# Summary: Preflight-only harness for the issue #36 gate acceptance oracle.
#   import_role + tasks_from loads defaults/main.yml; a bare import_tasks does
#   NOT, leaving every gate's when: an undefined-variable fatal.
#   Scoped to Phase 1 deliberately: running tests/test.yml with
#   --skip-tags preflight would execute Phases 2-9 against the invoking host.
# Classification: UNCLASSIFIED
###############################################################################
- name: Preflight gates only
  hosts: all
  gather_facts: true
  tasks:
    - name: Import preflight tasks
      ansible.builtin.import_role:
        name: "{{ playbook_dir }}/.."
        tasks_from: preflight.yml
