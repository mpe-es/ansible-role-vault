---
###############################################################################
# Filename: vars/main.yml
# Role: ansible-role-vault
# Summary: Internal variables for HashiCorp Vault role. These have higher
#   precedence than defaults and should NOT be overridden by consumers.
# Last Updated: 13 Aug 2026
# Classification: UNCLASSIFIED
###############################################################################

###############################################################################
# Package and Service Names
###############################################################################
vault_package_name: "{{ vault_edition }}"
vault_service_name: vault

###############################################################################
# System Paths (HashiCorp RPM standard layout)
# Verified against vault-1.21.4-1.x86_64 RPM. NOT re-verified against 2.x --
# the default pin crossed a major boundary (#62); re-check on the next bump.
###############################################################################
vault_config_dir: /etc/vault.d
vault_config_file: /etc/vault.d/vault.hcl
vault_env_file: /etc/vault.d/vault.env
# Common parent of data/tls/plugins. Managed in its own right: under STIG's
# mandated `umask 077`, an operator following tasks/preflight/tls.yml's
# instruction to stage TLS material creates this 0700 root:root, and vault
# then cannot TRAVERSE to its own Raft db however correct the children are.
vault_root_dir: /opt/vault
vault_data_dir: /opt/vault/data
vault_tls_dir: /opt/vault/tls
vault_log_dir: /var/log/vault
vault_plugin_dir: /opt/vault/plugins
vault_run_dir: /run/vault
vault_backup_dir: /opt/vault-backup
vault_binary: /usr/bin/vault
# Probed by tasks/preflight/fips.yml. A variable so the gate's absent-path and
# unreadable-path branches can be exercised without a bespoke kernel (#66);
# internal, not an operator knob.
__vault_fips_path: /proc/sys/crypto/fips_enabled
# Probed by tasks/preflight/san.yml. A variable for the same reason as the FIPS
# path above (#66): the absent-binary branch is untestable otherwise, and that
# branch is exactly where a gate silently stops gating.
__vault_san_openssl_bin: openssl
vault_service_file: /usr/lib/systemd/system/vault.service

###############################################################################
# System User and Group
# Created by RPM post-install (vault:vault, shell=/bin/false)
###############################################################################
vault_user: vault
vault_group: vault

###############################################################################
# File Permissions (STIG-hardened)
# RPM defaults are too permissive for STIG compliance:
#   RPM: /etc/vault.d 0755, vault.hcl 0644 root:root
#   Hardened: /etc/vault.d 0750 root:vault (vault reads via group, cannot
#   replace entries — the auto-unseal tokens file lives here root-only),
#   vault.hcl 0640 vault:vault (file ownership tightening is issue #38)
# NIST 800-53: AC-6 (Least Privilege)
###############################################################################
vault_config_dir_mode: '0750'
vault_config_file_mode: '0640'
vault_env_file_mode: '0600'
# root:vault 0750 — same pairing as vault_tls_dir and for the same reason:
# root owns it so the vault process cannot replace what it holds, group r-x
# keeps it TRAVERSABLE so vault can reach data/ and tls/ beneath it.
vault_root_dir_mode: '0750'
vault_data_dir_mode: '0750'
vault_tls_dir_mode: '0750'
vault_tls_file_mode: '0640'
vault_log_dir_mode: '0750'
# Backup tree is root-only: it stages root-only auditd extracts, so the
# vault service account must have no read access (dirs 0700, files 0600).
# Do not loosen: files/vault-audit-backup.sh re-enforces 0700 on every run.
vault_backup_dir_mode: '0700'

###############################################################################
# SELinux Contexts
# RPM sets /opt/vault/* to unconfined_u:object_r:usr_t — we enforce system_u
###############################################################################
vault_selinux_contexts:
  - path: /opt/vault(/.*)?
    setype: usr_t
    seuser: system_u
  - path: /etc/vault.d(/.*)?
    setype: etc_t
    seuser: system_u
  - path: /var/log/vault(/.*)?
    setype: var_log_t
    seuser: system_u

###############################################################################
# fapolicyd Trust Management (internal)
###############################################################################
vault_fapolicyd_trust_file: /etc/fapolicyd/trust.d/vault.trust

###############################################################################
# Edition Capability (derived -- never set these directly)
###############################################################################
# Capability is derivable from the edition name. These derive it once for TASK
# consumers; `is match` is a PREFIX test, the same form templates/vault.hcl.j2
# uses inline.
#
# templates/vault.hcl.j2 deliberately does NOT read these. It is rendered
# standalone by tests/render-hsm-pin-test.sh with hand-pinned variables and no
# role scope, so a derived fact is undefined there -- measured: routing the
# Enterprise branch through __vault_is_enterprise failed that test with
# "'__vault_is_enterprise' is undefined". The duplication is the cost of keeping
# the template renderable outside the role, which is what makes that #41 lock
# possible at all.
#
# Consumers cast with `| bool` defensively. Measured on ansible-core 2.19.6
# these return native bools, but the vars-plugin return type is not contractual
# across core versions and the cast is free.
#
# __vault_is_fips_build is deliberately NOT derived: every Enterprise choice in
# vault_edition is a FIPS 140-3 build, so the fact would be a constant -- and a
# constant dressed as a computed value is a check that looks like a guard and
# is not one.
__vault_is_enterprise: "{{ vault_edition is match('vault-enterprise') }}"
__vault_is_hsm_capable: "{{ 'hsm' in vault_edition }}"

# Enterprise NEVRA carries +ent in the VERSION field: measured against the live
# repository (#62's dnf evidence), vault-enterprise-fips1403 and
# vault-enterprise-hsm-fips1403 are both 2.x.y+ent-1 where Community vault is
# 2.x.y-1 -- plain '+ent', not '+ent.fips1403'.
# Same base version, suffix only on Enterprise. So a bare pin like "2.1.1"
# resolves vault-enterprise-2.1.1, which matches nothing and fails with "no
# package available".
#
# Appending here rather than rejecting in preflight is deliberate (operator
# ruling, 2026-09-22): +ent is packaging trivia, not a version decision, so
# vault_package_version means the same thing on either edition. The append is
# REPORTED by tasks/install.yml, not silent -- an operator who pinned 2.1.1 for
# an audit trail should see that 2.1.1+ent was installed.
#
# Split a trailing release field off before inserting the suffix. A pin may be
# written version-only (2.1.1) or version-release (1.18.3-1). Appending blindly
# yields 1.18.3-1+ent, which dnf reads as version 1.18.3 release 1+ent: no
# match, the very defect this exists to remove. +ent belongs in the VERSION.
#
# The release pattern allows a dist tag. Measured: '-[0-9]+$' does NOT match
# 1.18.3-1.el9, so that pin would resolve to 1.18.3-1.el9+ent -- release
# '1.el9+ent'. '-[0-9][A-Za-z0-9._]*$' matches both -1 and -1.el9 while leaving
# a version-only pin like 2.1.1 untouched.
#
# The `'+ent' in ...` arm is load-bearing: an operator who already writes
# 2.1.1+ent must not get 2.1.1+ent+ent.
#
# CONTRACT EDGES, measured on ansible-core 2.19.6 and deliberately NOT handled
# -- vault_package_version is documented as version or version-release:
#   2.1.1-rc1            -> 2.1.1-rc1+ent   (the -[0-9] anchor needs a digit)
#   LATEST               -> LATEST+ent      ('latest' comparisons are case-sensitive)
#   2.1.1-1.el9.x86_64   -> 2.1.1+ent-1.el9.x86_64  (arch swallowed as release)
# All are outside the documented contract. Widening the pattern to catch them
# would make it guess at strings the role does not claim to accept.
__vault_ent_release: "{{ vault_package_version | regex_search('-[0-9][A-Za-z0-9._]*$') | default('', true) }}"
__vault_ent_base: "{{ vault_package_version | regex_replace('-[0-9][A-Za-z0-9._]*$', '') }}"
__vault_package_version_resolved: >-
  {{ vault_package_version
     if (vault_package_version == 'latest'
         or not (__vault_is_enterprise | bool)
         or '+ent' in vault_package_version)
     else __vault_ent_base ~ '+ent' ~ __vault_ent_release }}
